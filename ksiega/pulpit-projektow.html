<title>Pulpit projektów</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Układ: aplikacja z panelem bocznym (widoki + lista projektów z wyszukiwarką) i obszarem głównym.
   Widoki: Przegląd (tabela projektów), Projekt (opis, faza, tablica, etapy, księga, marketing), Tablica, Terminy.
   Czcionka systemowa dla czytelności; stany jako plakietki w kolorze z podpisem. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --sunk:#f0f2f5; --hover:#eef1f6; --line:#dde1e7; --line-2:#c9ced8;
  --ink:#1d2433; --ink-2:#465163; --ink-3:#687385; --accent:#2563c9; --accent-ink:#ffffff; --accent-soft:#e3ecfb;
  --l-grey-bg:#e4e7ec; --l-grey:#3b4454; --l-blue-bg:#dbe7fd; --l-blue:#1d4fa8; --l-green-bg:#d9f5e1; --l-green:#176a32;
  --l-yellow-bg:#fff0bf; --l-yellow:#6e4d00; --l-red-bg:#ffe1de; --l-red:#a8281a; --l-purple-bg:#ebe3ff; --l-purple:#5636b8;
  --bar-done:#2a8a4a; --bar-rev:#7c5cd6; --bar-wip:#2563c9;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c7:#6250d6;
  --s1:#86b6ef; --s2:#5598e7; --s3:#2a78d6; --s4:#184f95;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",Arial,sans-serif;
  --r:6px; --side:248px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171c; --surface:#1d2027; --sunk:#22262e; --hover:#262a33; --line:#30353f; --line-2:#3d4350;
  --ink:#e7e9ee; --ink-2:#b9bfca; --ink-3:#8d95a3; --accent:#6b9ef0; --accent-ink:#0f1420; --accent-soft:#1f2c45;
  --l-grey-bg:#2f343e; --l-grey:#c9ced8; --l-blue-bg:#1d3157; --l-blue:#a9c6ff; --l-green-bg:#173a25; --l-green:#8fe0a8;
  --l-yellow-bg:#3d3112; --l-yellow:#f3cf6b; --l-red-bg:#45201d; --l-red:#ffaaa0; --l-purple-bg:#2f2550; --l-purple:#c9b6ff;
  --bar-done:#4cb46c; --bar-rev:#a08af0; --bar-wip:#6b9ef0;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c7:#9085e9;
  --s1:#184f95; --s2:#2a78d6; --s3:#5598e7; --s4:#86b6ef;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171c; --surface:#1d2027; --sunk:#22262e; --hover:#262a33; --line:#30353f; --line-2:#3d4350;
  --ink:#e7e9ee; --ink-2:#b9bfca; --ink-3:#8d95a3; --accent:#6b9ef0; --accent-ink:#0f1420; --accent-soft:#1f2c45;
  --l-grey-bg:#2f343e; --l-grey:#c9ced8; --l-blue-bg:#1d3157; --l-blue:#a9c6ff; --l-green-bg:#173a25; --l-green:#8fe0a8;
  --l-yellow-bg:#3d3112; --l-yellow:#f3cf6b; --l-red-bg:#45201d; --l-red:#ffaaa0; --l-purple-bg:#2f2550; --l-purple:#c9b6ff;
  --bar-done:#4cb46c; --bar-rev:#a08af0; --bar-wip:#6b9ef0;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c7:#9085e9;
  --s1:#184f95; --s2:#2a78d6; --s3:#5598e7; --s4:#86b6ef;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)} .soft{color:var(--ink-2)}

.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
/* panel boczny */
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .mark{width:28px;height:28px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.brand b{font-size:15px;display:block;line-height:1.2}
.brand small{font-size:12px;color:var(--ink-3)}
.nav{display:grid;gap:2px}
.nav a,.plist a{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--r);color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover,.plist a:hover{background:var(--hover);color:var(--ink)}
.nav a[aria-current="page"],.plist a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:16px;height:16px;flex:none}
.nav .count{margin-left:auto;font-size:12px;font-weight:600;background:var(--l-purple-bg);color:var(--l-purple);border-radius:10px;padding:0 7px}
.sidehead{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:0 8px;display:flex;justify-content:space-between}
.search{position:relative}
.search input{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:6px 10px 6px 30px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink-3)}
.plist{display:grid;gap:1px}
.plist .av{width:22px;height:22px;font-size:11px}
.plist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .ph{font-size:11px;color:var(--ink-3);white-space:nowrap}
.av{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:12px;flex:none}

/* obszar główny */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.crumbs{font-size:13px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:var(--ink-3);text-decoration:none}
.crumbs a:hover{color:var(--accent);text-decoration:underline}
.content{padding:20px 24px 40px;padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:20px;max-width:1320px;width:100%}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.pagehead h1{font-size:22px;font-weight:650}
.pagehead p{color:var(--ink-3)}
.mobilenav{display:none}

/* plakietki */
.lz{display:inline-flex;align-items:center;gap:4px;border-radius:3px;padding:1px 6px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;line-height:18px}
.lz.grey{background:var(--l-grey-bg);color:var(--l-grey)} .lz.blue{background:var(--l-blue-bg);color:var(--l-blue)}
.lz.green{background:var(--l-green-bg);color:var(--l-green)} .lz.yellow{background:var(--l-yellow-bg);color:var(--l-yellow)}
.lz.red{background:var(--l-red-bg);color:var(--l-red)} .lz.purple{background:var(--l-purple-bg);color:var(--l-purple)}
.lz.out{background:transparent;border:1px solid var(--line-2);color:var(--ink-2)}

/* karty, panele */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel>h2{font-size:15px;font-weight:650;padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel>h2 small{font-size:12px;font-weight:500;color:var(--ink-3)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;display:grid;gap:2px}
.stat .l{font-size:13px;color:var(--ink-2);font-weight:500}
.stat .v{font-size:26px;font-weight:650;line-height:1.2}
.stat .d{font-size:12px;color:var(--ink-3)}
.stat.red .v{color:var(--l-red)} .stat.purple .v{color:var(--l-purple)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}

/* listy */
.rows{list-style:none;margin:0;padding:0 16px 8px}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.rows li:first-child{border-top:0}
.rows .t{font-weight:500}
.rows .s{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rows .r{text-align:right;font-size:13px;white-space:nowrap}
.rows .r.late{color:var(--l-red);font-weight:650}
.rows a{color:inherit;text-decoration:none}
.rows a:hover .t{color:var(--accent);text-decoration:underline}
.empty{padding:12px 16px 16px;color:var(--ink-3)}

/* tabela projektów */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--ink-3);text-align:left;padding:8px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
.proj{display:flex;gap:10px;min-width:260px}
.proj b{display:block;font-size:14px}
.proj b a{color:var(--ink);text-decoration:none}
.proj b a:hover{color:var(--accent);text-decoration:underline}
.proj p{font-size:13px;color:var(--ink-3);max-width:48ch;line-height:1.4}
.phase{display:grid;gap:4px;min-width:170px}
.phase .steps{display:flex;gap:3px}
.phase .steps i{height:6px;flex:1;border-radius:2px;background:var(--line)}
.phase .steps i.done{background:var(--ink-3)}
.phase .steps i.cur{background:var(--accent)}
.phase span{font-size:13px;font-weight:600}
.prog{display:grid;gap:4px;min-width:140px}
.track{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;display:flex;border:1px solid var(--line)}
.track i{height:100%;display:block}
.prog span{font-size:12px;color:var(--ink-2)}
.due b{display:block;font-size:13px;font-weight:600;white-space:nowrap}
.due span{font-size:12px;color:var(--ink-3);white-space:nowrap}
.due.late b{color:var(--l-red)}

/* strona projektu */
.phead{display:grid;gap:12px}
.ptitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ptitle .av{width:40px;height:40px;font-size:16px;border-radius:8px}
.ptitle h1{font-size:22px;font-weight:650}
.desc{max-width:75ch;color:var(--ink-2);font-size:15px}
.stepper{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.stepper div{border-top:4px solid var(--line);padding-top:6px;font-size:12px;color:var(--ink-3)}
.stepper div b{display:block;font-size:13px;color:var(--ink-2);font-weight:600}
.stepper .done{border-color:var(--ink-3)}
.stepper .cur{border-color:var(--accent)}
.stepper .cur b{color:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:grid;gap:2px}
.fact .l{font-size:12px;color:var(--ink-3);font-weight:500}
.fact .v{font-size:15px;font-weight:650}
.fact .d{font-size:12px;color:var(--ink-3)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.tabs a{padding:8px 12px;color:var(--ink-2);text-decoration:none;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--accent);border-color:var(--accent)}

/* tablica */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--sunk);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h3{font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;padding:4px 6px;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:8px;cursor:pointer;text-align:left;width:100%;box-shadow:0 1px 1px rgba(9,30,66,.08)}
.card:hover{border-color:var(--line-2);background:var(--hover)}
.card .tt{font-weight:500;line-height:1.35}
.card .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.card .key{font-weight:600;color:var(--ink-3)}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.who{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2)}
.who i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;color:#fff}
.dl{font-size:12px;font-weight:600;white-space:nowrap}
.dl.late{color:var(--l-red)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar select,.toolbar .tg{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:5px 10px}
.toolbar .tg{cursor:pointer;font-weight:500}
.toolbar .tg[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

/* etapy */
.stagelist{list-style:none;margin:0;padding:0 16px 8px}
.stagelist li{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.stagelist li:first-child{border-top:0}
.stagelist .nm b{display:block}
.stagelist .nm span{font-size:12px;color:var(--ink-3)}
.tl{position:relative;height:22px;background:var(--sunk);border-radius:4px}
.tl .b{position:absolute;top:4px;bottom:4px;border-radius:3px}
.tl .today{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--l-red)}
.tlaxis{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);padding:0 16px 4px;margin-left:calc((100% - 32px) * 0.375 + 16px)}

/* księga */
.check{list-style:none;margin:0;padding:0 16px 8px}
.check li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.check li:first-child{border-top:0}
.check .ic{width:18px;height:18px;margin-top:1px}
.check .f{font-size:12px;color:var(--ink-3)}

/* szuflada */
.scrim{position:fixed;inset:0;background:rgba(9,15,30,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;padding:20px;padding-right:max(20px,env(safe-area-inset-right,0px));padding-top:max(20px,env(safe-area-inset-top,0px));display:grid;gap:14px;align-content:start;overflow-y:auto;box-shadow:-8px 0 24px rgba(0,0,0,.12)}
.drawer h2{font-size:18px;font-weight:650}
.drawer dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;margin:0;font-size:14px}
.drawer dt{color:var(--ink-3)}
.drawer dd{margin:0}
.x{justify-self:end;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:4px 10px;cursor:pointer}
.note{font-size:13px;color:var(--ink-3)}
.hint{border:1px dashed var(--line-2);border-radius:8px;padding:12px 16px;color:var(--ink-2);background:var(--surface)}

@media (max-width:1100px){.stats,.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}}
.kgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.chartbox{padding:0 16px 14px;display:grid;gap:8px;min-width:0}
.chartbox p.cap{font-size:13px;color:var(--ink-3)}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.chartbox svg text{fill:var(--ink-3);font:12px var(--font)}
.chartbox svg text.lb{fill:var(--ink-2);font-weight:600}
.chartbox svg .gl{stroke:var(--line);stroke-width:1}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:6px;padding:8px 10px;font-size:13px;line-height:1.45;z-index:30;min-width:160px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.tip b{display:block;margin-bottom:2px}
.tip .r{display:flex;justify-content:space-between;gap:14px}
.tip .r span:first-child{display:inline-flex;align-items:center;gap:6px}
.tip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13px;font-weight:600;justify-self:start}
.dt{font-size:13px}.dt th,.dt td{padding:6px 8px;text-align:right}.dt th:first-child,.dt td:first-child{text-align:left}
.hbar{display:grid;grid-template-columns:90px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.hbar .tr{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--c1);border-radius:0 3px 3px 0}
@media (max-width:1100px){.kgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.cgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){.kgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mobilenav{display:flex;gap:8px;flex-wrap:wrap;width:100%}
  .mobilenav select{flex:1;min-width:0;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:6px 8px}
  .topbar,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .stepper{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:10px}
  .stagelist li{grid-template-columns:minmax(0,1fr);gap:6px}
  .tlaxis{display:none}
}
@media (max-width:480px){.stats,.facts{grid-template-columns:minmax(0,1fr)}}
</style>

<div class="app">
  <aside class="side" aria-label="Nawigacja">
    <div class="brand"><div class="mark">IS</div><div><b>Projekty</b><small>IntegrateSystems</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div style="display:grid;gap:8px">
      <div class="sidehead"><span>Projekty</span><span id="pcount"></span></div>
      <label class="search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg><input id="q" type="search" placeholder="Szukaj projektu  /" aria-label="Szukaj projektu"></label>
      <div class="plist" id="plist"></div>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="mobilenav"><select id="mnav" aria-label="Widok"></select></div>
      <span class="lz yellow">Dane przykładowe</span>
    </div>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="drawerHost"></div>
<div class="tip" id="tip" hidden></div>

<script>
(function(){
const TODAY="2026-11-12";
const PHASES=["Pomysł","Księga","Budowa","Wdrożenie","Marketing","Utrzymanie"];
const WHO={claude:{n:"Claude",c:"#c4673d",i:"C"},codex:{n:"Codex",c:"#3f7d5c",i:"X"},ty:{n:"Ty",c:"#5636b8",i:"Ty"}};
const COLS=[["todo","Do zrobienia"],["wip","W toku"],["rev","Do odbioru"],["done","Zrobione"]];

function stagesView(p){

/* ---------- wskaźniki ---------- */
const CFD_ST=[["done","Zrobione","--s4"],["rev","Do odbioru","--s3"],["wip","W toku","--s2"],["todo","Do zrobienia","--s1"]];
function hist(id){
  const h=HIST[id],c=counts(id),out=[];
  for(let i=0;i<7;i++){const t=h.total[i],d=h.done[i],w=h.wip[i],r=h.rev[i];out.push({total:t,done:d,wip:w,rev:r,todo:t-d-w-r});}
  out.push({total:c.all,done:c.done,wip:c.wip,rev:c.rev,todo:c.todo});
  return out;
}
function sumHist(L){return WEEKS.map((_,i)=>{const r={total:0,done:0,wip:0,rev:0,todo:0};L.forEach(p=>{const h=hist(p.id)[i];for(const k in r)r[k]+=h[k];});return r;});}
const fmt1=v=>String(Math.round(v*10)/10).replace(".",",");
const CHARTS={};
function tipShow(html,ev){const t=$("#tip");t.innerHTML=html;t.hidden=false;const w=t.offsetWidth,h=t.offsetHeight;let x=ev.clientX+14,y=ev.clientY+14;if(x+w>innerWidth-8)x=ev.clientX-w-14;if(y+h>innerHeight-8)y=ev.clientY-h-14;t.style.left=x+"px";t.style.top=y+"px";}
function tipHide(){$("#tip").hidden=true;}
const sw=v=>`<i style="background:var(${v})"></i>`;
const pv=p=>"--c"+{IS:1,A:2,B:3,C:4,D:5,T:7}[p.id];

function kpis(L){
  const H=sumHist(L),n=H[7],o=H[3];
  const pct=n.total?100*n.done/n.total:0, pctOld=o.total?100*o.done/o.total:0;
  const thr=[4,5,6,7].map(i=>H[i].done-H[i-1].done), avgThr=thr.reduce((a,b)=>a+b,0)/4;
  const late=T.filter(t=>L.some(p=>p.id===t.p)&&t.s!=="done"&&t.due&&dTo(t.due)<0).length+L.reduce((a,p)=>a+p.stages.filter(s=>s.s==="late").length,0);
  const stDone=L.reduce((a,p)=>a+p.stages.filter(s=>s.s==="done").length,0), stLate=L.reduce((a,p)=>a+p.stages.filter(s=>s.s==="late").length,0);
  const leads=L.filter(p=>LEAD[p.id]!=null&&counts(p.id).done), lead=leads.length?leads.reduce((a,p)=>a+LEAD[p.id]*counts(p.id).done,0)/leads.reduce((a,p)=>a+counts(p.id).done,0):null;
  const dp=Math.round(pct-pctOld);
  return `<div class="kgrid">
   <div class="stat"><span class="l">Postęp</span><span class="v num">${Math.round(pct)}%</span><span class="d num">${n.done} z ${n.total} zadań · ${dp>=0?"+":""}${dp} pkt w 4 tyg.</span></div>
   <div class="stat"><span class="l">Tempo</span><span class="v num">${fmt1(avgThr)}</span><span class="d">zadań na tydzień, średnio z 4 tyg.</span></div>
   <div class="stat"><span class="l">Praca w toku</span><span class="v num">${n.wip+n.rev}</span><span class="d num">w toku ${n.wip} · do odbioru ${n.rev}</span></div>

  </div>`;
}

/* wykres liniowy: postęp w % */
function lineChart(id,L){
  const W=620,Hh=250,ml=38,mr=150,mt=12,mb=26,iw=W-ml-mr,ih=Hh-mt-mb;
  const x=i=>ml+iw*i/7,y=v=>mt+ih-ih*v/100;
  const series=L.map(p=>({p,v:hist(p.id).map(h=>h.total?100*h.done/h.total:null)})).filter(s=>s.v.some(v=>v!=null));
  if(L.length>1){const H=sumHist(L);series.unshift({p:null,v:H.map(h=>h.total?100*h.done/h.total:null)});}
  let g="";[0,25,50,75,100].forEach(v=>{g+=`<line class="gl" x1="${ml}" x2="${ml+iw}" y1="${y(v)}" y2="${y(v)}"/><text x="${ml-8}" y="${y(v)+4}" text-anchor="end">${v}%</text>`;});
  WEEKS.forEach((d,i)=>{g+=`<text x="${x(i)}" y="${Hh-6}" text-anchor="middle">${dd(d)}</text>`;});
  let lines="",labs=[];
  series.forEach(s=>{const col=s.p?`var(${pv(s.p)})`:"var(--ink)";let d="",pen=false;
    s.v.forEach((v,i)=>{if(v==null){pen=false;return;}d+=(pen?"L":"M")+x(i)+","+y(v);pen=true;});
    if(series.length===1&&s.p){let a="",st=s.v.findIndex(v=>v!=null);a="M"+x(st)+","+y(0);s.v.forEach((v,i)=>{if(v!=null)a+="L"+x(i)+","+y(v)});a+="L"+x(7)+","+y(0)+"Z";lines+=`<path d="${a}" fill="${col}" opacity=".12"/>`;}
    lines+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="${s.p?2:3}" stroke-linejoin="round" stroke-linecap="round" ${s.p?"":'stroke-dasharray="0"'}/>`;
    const lv=s.v[7];if(lv!=null){lines+=`<circle cx="${x(7)}" cy="${y(lv)}" r="4" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`;labs.push({y:y(lv),t:(s.p?s.p.name:"Cały portfel")+" "+Math.round(lv)+"%"});}});
  labs.sort((a,b)=>a.y-b.y);for(let i=1;i<labs.length;i++)if(labs[i].y-labs[i-1].y<15)labs[i].y=labs[i-1].y+15;
  const lt=labs.map(l=>`<text class="lb" x="${ml+iw+10}" y="${l.y+4}">${esc(l.t)}</text>`).join("");
  CHARTS[id]={type:"x",x,ml,iw,W,n:8,html:i=>`<b>Tydzień od ${dd(WEEKS[i])}</b>`+series.map(s=>s.v[i]==null?"":`<div class="r"><span>${s.p?sw(pv(s.p)):'<i style="background:var(--ink)"></i>'}${esc(s.p?s.p.name:"Cały portfel")}</span><span class="num">${Math.round(s.v[i])}%</span></div>`).join("")};
  const leg=series.length>1?`<div class="leg">${series.map(s=>`<span>${s.p?sw(pv(s.p)):'<i style="background:var(--ink)"></i>'}${esc(s.p?s.p.name:"Cały portfel")}</span>`).join("")}</div>`:"";
  return `${leg}<svg viewBox="0 0 ${W} ${Hh}" data-chart="${id}" role="img" aria-label="Postęp w procentach w 8 tygodniach">${g}${lines}${lt}<line class="cx" x1="0" x2="0" y1="${mt}" y2="${mt+ih}" stroke="var(--ink-2)" stroke-width="1" opacity="0"/><rect class="hit" x="${ml}" y="${mt}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
}

/* słupki: zadania zakończone w tygodniu (skumulowane wg projektu) */
function barChart(id,L){
  const W=600,Hh=250,ml=30,mr=10,mt=24,mb=26,iw=W-ml-mr,ih=Hh-mt-mb;
  const act=L.filter(p=>hist(p.id).some(h=>h.done));
  const wk=[1,2,3,4,5,6,7];
  const val=(p,i)=>{const h=hist(p.id);return h[i].done-h[i-1].done;};
  const tot=wk.map(i=>act.reduce((a,p)=>a+val(p,i),0)),max=Math.max(2,...tot),top=Math.ceil(max/2)*2;
  const y=v=>mt+ih-ih*v/top,bw=iw/wk.length;
  let g="";for(let v=0;v<=top;v+=top>8?2:1){g+=`<line class="gl" x1="${ml}" x2="${ml+iw}" y1="${y(v)}" y2="${y(v)}"/><text x="${ml-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;}
  let bars="";
  wk.forEach((i,k)=>{const bx=ml+k*bw+bw*.2,w=bw*.6;let base=0;const segs=act.map(p=>({p,v:val(p,i)})).filter(s=>s.v>0);

      if(j===segs.length-1){const r=Math.min(4,h/2);bars+=`<path d="M${bx},${y0}V${y1+r}Q${bx},${y1} ${bx+r},${y1}H${bx+w-r}Q${bx+w},${y1} ${bx+w},${y1+r}V${y0}Z" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`;}
      else bars+=`<rect x="${bx}" y="${y1}" width="${w}" height="${h}" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`;
      base+=sg.v;});
    if(k===wk.length-1)bars+=`<text class="lb" x="${bx+w/2}" y="${y(tot[k])-6}" text-anchor="middle">${tot[k]}</text>`;
    bars+=`<text x="${bx+w/2}" y="${Hh-6}" text-anchor="middle">${dd(WEEKS[i])}</text>`;});
  CHARTS[id]={type:"band",ml,bw,W,n:wk.length,html:k=>{const i=wk[k];return `<b>Tydzień od ${dd(WEEKS[i])}</b>`+act.map(p=>`<div class="r"><span>${sw(act.length>1?pv(p):"--c1")}${esc(p.name)}</span><span class="num">${val(p,i)}</span></div>`).join("")+(act.length>1?`<div class="r"><span>Razem</span><span class="num">${tot[k]}</span></div>`:"");}};
  const leg=act.length>1?`<div class="leg">${act.map(p=>`<span>${sw(pv(p))}${esc(p.name)}</span>`).join("")}</div>`:"";
  return `${leg}<svg viewBox="0 0 ${W} ${Hh}" data-chart="${id}" role="img" aria-label="Zadania zakończone w kolejnych tygodniach">${g}${bars}<rect class="hit" x="${ml}" y="${mt}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
}

/* przepływ: liczba zadań w każdym stanie */
function cfdChart(id,L){
  const H=sumHist(L),W=600,Hh=250,ml=30,mr=118,mt=12,mb=26,iw=W-ml-mr,ih=Hh-mt-mb;
  const max=Math.max(1,...H.map(h=>h.total)),step=max>40?10:max>20?5:2,top=Math.ceil(max/step)*step;
  const x=i=>ml+iw*i/7,y=v=>mt+ih-ih*v/top;
  let g="";for(let v=0;v<=top;v+=step){g+=`<line class="gl" x1="${ml}" x2="${ml+iw}" y1="${y(v)}" y2="${y(v)}"/><text x="${ml-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;}
  WEEKS.forEach((d,i)=>{g+=`<text x="${x(i)}" y="${Hh-6}" text-anchor="middle">${dd(d)}</text>`;});
  let base=H.map(()=>0),areas="",labs=[];
  CFD_ST.forEach(([k,n,v])=>{const lo=base.slice(),hi=base.map((b,i)=>b+H[i][k]);
    areas+=`<path d="M${hi.map((h,i)=>x(i)+","+y(h)).join("L")}L${lo.map((l,i)=>[x(i),y(l)]).reverse().map(p=>p.join(",")).join("L")}Z" fill="var(${v})" stroke="var(--surface)" stroke-width="2" stroke-linejoin="round"/>`;
    if(H[7][k])labs.push({y:y((lo[7]+hi[7])/2),t:n+" "+H[7][k]});base=hi;});
  labs.sort((a,b)=>b.y-a.y);for(let i=1;i<labs.length;i++)if(labs[i-1].y-labs[i].y<16)labs[i].y=labs[i-1].y-16;
  CHARTS[id]={type:"x",x,ml,iw,W,n:8,html:i=>`<b>Tydzień od ${dd(WEEKS[i])}</b>`+CFD_ST.slice().reverse().map(([k,n,v])=>`<div class="r"><span>${sw(v)}${n}</span><span class="num">${H[i][k]}</span></div>`).join("")};
  return `<div class="leg">${CFD_ST.slice().reverse().map(([k,n,v])=>`<span>${sw(v)}${n}</span>`).join("")}</div><svg viewBox="0 0 ${W} ${Hh}" data-chart="${id}" role="img" aria-label="Liczba zadań w każdym stanie w 8 tygodniach">${g}${areas}${labs.map(l=>`<text class="lb" x="${ml+iw+10}" y="${l.y+4}">${l.t}</text>`).join("")}<line class="cx" x1="0" x2="0" y1="${mt}" y2="${mt+ih}" stroke="var(--ink)" stroke-width="1" opacity="0"/><rect class="hit" x="${ml}" y="${mt}" width="${iw}" height="${ih}" fill="transparent"/></svg>
  <button class="linkbtn" data-toggle="t-${id}">Pokaż liczby w tabeli</button><div class="tw" id="t-${id}" hidden><table class="dt"><thead><tr><th>Tydzień od</th>${CFD_ST.slice().reverse().map(s=>`<th>${s[1]}</th>`).join("")}</tr></thead><tbody>${H.map((h,i)=>`<tr><td>${dd(WEEKS[i])}</td>${CFD_ST.slice().reverse().map(s=>`<td class="num">${h[s[0]]}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

/* spalanie bieżącego etapu */
function burnChart(id,p){
  const s=p.stages.find(x=>x.s!=="done"&&x.s!=="plan");
  if(!s)return `<p class="cap">Brak etapu w toku.</p>`;
  const L=T.filter(t=>t.p===p.id&&t.stage===s.t),n=L.length,open=L.filter(t=>t.s!=="done").length;
  const days=dTo(s.b)-dTo(s.a),today=Math.min(days,Math.max(0,dTo(TODAY)-dTo(s.a)));
  const real=[];for(let i=0;i<=today;i++)real.push(Math.round(n-(n-open)*(today?i/today:1)));
  const W=600,Hh=230,ml=30,mr=20,mt=12,mb=26,iw=W-ml-mr,ih=Hh-mt-mb,x=i=>ml+iw*i/Math.max(1,days),y=v=>mt+ih-ih*v/Math.max(1,n);
  let g="";for(let v=0;v<=n;v+=n>8?2:1){g+=`<line class="gl" x1="${ml}" x2="${ml+iw}" y1="${y(v)}" y2="${y(v)}"/><text x="${ml-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;}
  const ticks=[0,Math.round(days/2),days];ticks.forEach(i=>{const d=new Date(day(s.a).getTime()+i*864e5);g+=`<text x="${x(i)}" y="${Hh-6}" text-anchor="middle">${d.getDate()}.${String(d.getMonth()+1).padStart(2,"0")}</text>`;});
  const ideal=`<path d="M${x(0)},${y(n)}L${x(days)},${y(0)}" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>`;
  const realP=`<path d="M${real.map((v,i)=>x(i)+","+y(v)).join("L")}" stroke="var(--c1)" stroke-width="2" fill="none" stroke-linejoin="round"/><circle cx="${x(today)}" cy="${y(open)}" r="4" fill="var(--c1)" stroke="var(--surface)" stroke-width="2"/>`;
  const pace=today?(n-open)/today:0,need=dTo(s.b)>0?open/dTo(s.b):open;
  CHARTS[id]=null;
  return `<div class="leg"><span><i style="background:var(--c1)"></i>Zostało zadań</span><span><i style="background:transparent;border-top:2px dashed var(--ink-3);height:0;width:14px;border-radius:0"></i>Plan równomierny</span></div>
  <svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Zadania pozostałe w etapie ${esc(s.t)}">${g}${ideal}${realP}<text class="lb" x="${x(today)+8}" y="${y(open)-8}">dziś: ${open} z ${n}</text></svg>
  <p class="cap">Etap „${esc(s.t)}” do ${dd(s.b)}. Tempo ${fmt1(pace)} zadania dziennie, potrzebne ${fmt1(need)}. ${pace>=need?"Zdążymy przy obecnym tempie.":"Przy obecnym tempie etap się spóźni."}</p>`;
}

function whoBars(L){
  const ids=L.map(p=>p.id),rows=Object.keys(WHO).map(k=>{const all=T.filter(t=>ids.includes(t.p)&&t.who===k);return {k,done:all.filter(t=>t.s==="done").length,open:all.filter(t=>t.s!=="done").length};});
  const max=Math.max(1,...rows.map(r=>r.done));
  return rows.map(r=>`<div class="hbar"><span class="who"><i style="background:${WHO[r.k].c}">${WHO[r.k].i}</i>${WHO[r.k].n}</span><span class="tr"><i style="width:${100*r.done/max}%"></i></span><span class="num">${r.done} zrobione<br><span class="muted">${r.open} otwarte</span></span></div>`).join("");
}
function spark(p){const v=hist(p.id).map(h=>h.done),max=Math.max(1,...v),W=90,H=24;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><path d="M${v.map((d,i)=>(i*W/7).toFixed(1)+","+(H-2-(H-4)*d/max).toFixed(1)).join("L")}" fill="none" stroke="var(${pv(p)})" stroke-width="2" stroke-linejoin="round"/><circle cx="${W}" cy="${H-2-(H-4)*v[7]/max}" r="3" fill="var(${pv(p)})"/></svg>`;}
function compareTable(L){
  return `<div class="tw"><table><thead><tr><th>Projekt</th><th>Postęp</th><th>Zrobione, 8 tyg.</th><th>Tempo</th><th>W toku</th><th>Zaległe</th><th>Księga</th></tr></thead><tbody>${L.map(p=>{const h=hist(p.id),c=counts(p.id),thr=(h[7].done-h[3].done)/4,late=T.filter(t=>t.p===p.id&&t.s!=="done"&&t.due&&dTo(t.due)<0).length+p.stages.filter(s=>s.s==="late").length;
    return `<tr data-go="#p-${p.id.toLowerCase()}-wskazniki"><td><div class="proj" style="min-width:160px">${av(p)}<b style="align-self:center"><a href="#p-${p.id.toLowerCase()}-wskazniki">${esc(p.name)}</a></b></div></td><td>${progCell(p)}</td><td>${spark(p)}</td><td class="num">${fmt1(thr)}/tydz.</td><td class="num">${c.wip+c.rev}</td><td class="num" style="${late?"color:var(--l-red);font-weight:650":""}">${late}</td><td>${bookLz(p)}</td></tr>`}).join("")}</tbody></table></div>`;
}

function metrics(L,one){
  if(one&&!counts(one.id).all)return `<div class="hint">Projekt nie ma jeszcze zadań, więc nie ma czego mierzyć. Wskaźniki pojawią się, gdy projekt ruszy i dostanie zadania w ZADANIA.md.</div>`;
  return `${kpis(L)}
  <div class="cgrid">
   <section class="panel"><h2>Postęp w czasie <small>% zadań zrobionych</small></h2><div class="chartbox">${lineChart("m-line",L)}</div></section>
   <section class="panel"><h2>Zakończone zadania <small>na tydzień</small></h2><div class="chartbox">${barChart("m-bar",L)}</div></section>
   <section class="panel"><h2>Przepływ pracy <small>zadania w każdym stanie</small></h2><div class="chartbox"><p class="cap">Rosnące pasmo „zrobione” to postęp. Szerokie „w toku” znaczy, że naraz rozpoczęto za dużo.</p>${cfdChart("m-cfd",L)}</div></section>
   ${one?`<section class="panel"><h2>Spalanie etapu <small>zadania pozostałe do terminu</small></h2><div class="chartbox">${burnChart("m-burn",one)}</div></section>`
        :`<section class="panel"><h2>Kto wykonuje <small>zadania według wykonawcy</small></h2><div class="chartbox">${whoBars(L)}<p class="cap">Liczby z tablicy zadań wybranych projektów.</p></div></section>`}
  </div>
  ${one?`<section class="panel"><h2>Kto wykonuje <small>zadania według wykonawcy</small></h2><div class="chartbox">${whoBars(L)}</div></section>`
       :`<section class="panel"><h2>Porównanie projektów <small>kliknij wiersz, aby zobaczyć wskaźniki projektu</small></h2>${compareTable(L)}</section>`}`;
}
function vWskazniki(){
  const L=mScope==="all"?P.filter(p=>p.state!=="back"):P.filter(p=>p.id===mScope);
  const one=mScope==="all"?null:L[0];
  return `<div class="pagehead"><div><h1>Wskaźniki</h1><p>Postęp prac, tempo i przepływ, dla całego portfela albo jednego projektu.</p></div>
  <div class="toolbar"><label class="muted" for="ms">Zakres</label><select id="ms"><option value="all">Cały portfel (projekty w toku)</option>${P.map(p=>`<option value="${p.id}" ${mScope===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div></div>
  ${metrics(L,one)}`;
}
function bindCharts(){
  document.querySelectorAll("svg[data-chart]").forEach(svg=>{const c=CHARTS[svg.dataset.chart];if(!c)return;const hit=svg.querySelector(".hit"),cx=svg.querySelector(".cx");
    hit.addEventListener("mousemove",ev=>{const r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)*c.W/r.width;let i;
      if(c.type==="x"){i=Math.max(0,Math.min(c.n-1,Math.round((px-c.ml)/c.iw*(c.n-1))));if(cx){cx.setAttribute("x1",c.x(i));cx.setAttribute("x2",c.x(i));cx.setAttribute("opacity",".5");}}
      else i=Math.max(0,Math.min(c.n-1,Math.floor((px-c.ml)/c.bw)));
      tipShow(c.html(i),ev);});
    hit.addEventListener("mouseleave",()=>{tipHide();if(cx)cx.setAttribute("opacity","0");});});
  document.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",()=>{const t=document.getElementById(b.dataset.toggle);t.hidden=!t.hidden;b.textContent=t.hidden?"Pokaż liczby w tabeli":"Ukryj tabelę";}));
}

function drawer(t){
  const p=proj(t.p),w=WHO[t.who];
  $("#drawerHost").innerHTML=`<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-label="${esc(t.k)}"><button class="x" data-close>Zamknij</button><span class="muted">${esc(t.k)} · ${esc(p.name)}</span><h2>${esc(t.t)}</h2>
  <dl><dt>Stan</dt><dd>${{todo:'<span class="lz grey">do zrobienia</span>',wip:'<span class="lz blue">w toku</span>',rev:'<span class="lz purple">do odbioru</span>',done:'<span class="lz green">zrobione</span>'}[t.s]}</dd>
  <dt>Wykonawca</dt><dd><span class="who"><i style="background:${w.c}">${w.i}</i>${w.n}</span></dd><dt>Etap</dt><dd>${esc(t.stage)}</dd>
  <dt>Termin</dt><dd>${t.due?ddl(t.due)+" · "+rel(t.due):"—"}</dd><dt>Wymaga</dt><dd>${t.need?t.need+" właściciela":"—"}</dd>
  <dt>Plik</dt><dd class="muted">ZADANIA.md projektu</dd></dl>
  <p class="note">Na prawdziwych danych tu będzie historia zmian i wyniki pracy agenta.</p></aside>`;
  $("#drawerHost .x").focus();
}

function render(){
  const r=route();sidebar(r);crumbs(r);
  let h="";
  if(r.v==="projekt")h=vProjekt(r.p,r.tab);else if(r.v==="wskazniki")h=vWskazniki();else if(r.v==="tablica")h=vTablica();else if(r.v==="terminy")h=vTerminy();else if(r.v==="ty")h=vTy();else h=vPrzeglad();
  $("#view").innerHTML=h;
  const bp=$("#bp");if(bp)bp.addEventListener("change",()=>{boardFilter.p=bp.value;save();render();});
  const bm=$("#bm");if(bm)bm.addEventListener("click",()=>{boardFilter.mine=!boardFilter.mine;save();render();});
  const ms=$("#ms");if(ms)ms.addEventListener("change",()=>{mScope=ms.value;save();render();});
  bindCharts();
}
document.addEventListener("click",e=>{
  const tr=e.target.closest("tr[data-go]");if(tr&&!e.target.closest("a")){location.hash=tr.dataset.go;return;}
  const c=e.target.closest("[data-task]");if(c){drawer(T.find(t=>t.k===c.dataset.task));return;}
  if(e.target.closest("[data-close]"))$("#drawerHost").innerHTML="";
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")$("#drawerHost").innerHTML="";
  if(e.key==="/"&&!e.target.closest("input,select")){e.preventDefault();$("#q").focus();}
});
$("#q").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();sidebar(route());});
$("#mnav").addEventListener("change",e=>{location.hash=e.target.value;});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0);});
render();
})();
</script>
