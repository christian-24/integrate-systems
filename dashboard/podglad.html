<title>Panel projektów</title>
<style>
/* Pulpit projektów: panel boczny (widoki + lista projektów z wyszukiwarką), obszar główny, szuflada szczegółów.
   Wygląd według ksiega/pulpit-projektow.html, dane z /api/data. Kontrakt: dashboard/PULPIT.md. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --sunk:#f0f2f5; --hover:#eef1f6; --line:#dde1e7; --line-2:#c9ced8;
  --ink:#1d2433; --ink-2:#465163; --ink-3:#687385; --accent:#2563c9; --accent-ink:#ffffff; --accent-soft:#e3ecfb;
  --l-grey-bg:#e4e7ec; --l-grey:#3b4454; --l-blue-bg:#dbe7fd; --l-blue:#1d4fa8; --l-green-bg:#d9f5e1; --l-green:#176a32;
  --l-yellow-bg:#fff0bf; --l-yellow:#6e4d00; --l-red-bg:#ffe1de; --l-red:#a8281a; --l-purple-bg:#ebe3ff; --l-purple:#5636b8;
  --bar-done:#2a8a4a; --bar-rev:#7c5cd6; --bar-wip:#2563c9; --bar-warn:#d99a00;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#4f9a2c; --c7:#6250d6; --c8:#d63f3f;
  --s1:#86b6ef; --s2:#5598e7; --s3:#2a78d6; --s4:#184f95;
  --scrim:rgba(9,15,30,.35);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px; --side:248px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171c; --surface:#1d2027; --sunk:#22262e; --hover:#262a33; --line:#30353f; --line-2:#3d4350;
  --ink:#e7e9ee; --ink-2:#b9bfca; --ink-3:#8d95a3; --accent:#6b9ef0; --accent-ink:#0f1420; --accent-soft:#1f2c45;
  --l-grey-bg:#2f343e; --l-grey:#c9ced8; --l-blue-bg:#1d3157; --l-blue:#a9c6ff; --l-green-bg:#173a25; --l-green:#8fe0a8;
  --l-yellow-bg:#3d3112; --l-yellow:#f3cf6b; --l-red-bg:#45201d; --l-red:#ffaaa0; --l-purple-bg:#2f2550; --l-purple:#c9b6ff;
  --bar-done:#4cb46c; --bar-rev:#a08af0; --bar-wip:#6b9ef0; --bar-warn:#e0aa2a;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#4f9e34; --c7:#9085e9; --c8:#e05a5a;
  --s1:#184f95; --s2:#2a78d6; --s3:#5598e7; --s4:#86b6ef;
  --scrim:rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171c; --surface:#1d2027; --sunk:#22262e; --hover:#262a33; --line:#30353f; --line-2:#3d4350;
  --ink:#e7e9ee; --ink-2:#b9bfca; --ink-3:#8d95a3; --accent:#6b9ef0; --accent-ink:#0f1420; --accent-soft:#1f2c45;
  --l-grey-bg:#2f343e; --l-grey:#c9ced8; --l-blue-bg:#1d3157; --l-blue:#a9c6ff; --l-green-bg:#173a25; --l-green:#8fe0a8;
  --l-yellow-bg:#3d3112; --l-yellow:#f3cf6b; --l-red-bg:#45201d; --l-red:#ffaaa0; --l-purple-bg:#2f2550; --l-purple:#c9b6ff;
  --bar-done:#4cb46c; --bar-rev:#a08af0; --bar-wip:#6b9ef0; --bar-warn:#e0aa2a;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#4f9e34; --c7:#9085e9; --c8:#e05a5a;
  --s1:#184f95; --s2:#2a78d6; --s3:#5598e7; --s4:#86b6ef;
  --scrim:rgba(0,0,0,.5);
  color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
code{font:12.5px/1.45 var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:0 5px;overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)} .soft{color:var(--ink-2)}

.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
/* panel boczny */
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .mark{width:28px;height:28px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.brand b{font-size:15px;display:block;line-height:1.2}
.brand small{font-size:12px;color:var(--ink-3)}
.nav{display:grid;gap:2px}
.nav a,.plist a{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--r);color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover,.plist a:hover{background:var(--hover);color:var(--ink)}
.nav a[aria-current="page"],.plist a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:16px;height:16px;flex:none}
.nav .count{margin-left:auto;font-size:12px;font-weight:600;background:var(--l-purple-bg);color:var(--l-purple);border-radius:10px;padding:0 7px}
.nav .count.blue{background:var(--l-blue-bg);color:var(--l-blue)}
.sidehead{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:0 8px;display:flex;justify-content:space-between}
.search{position:relative;display:block}
.search input{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:6px 10px 6px 30px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink-3)}
.plist{display:grid;gap:1px}
.plist .av{width:22px;height:22px;font-size:10px}
.plist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .ph{font-size:11px;color:var(--ink-3);white-space:nowrap}
.sidefoot{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;padding:0 6px}
.av{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:11px;flex:none;letter-spacing:.02em}
.av.sm{width:18px;height:18px;font-size:9px;border-radius:4px}

/* obszar główny */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;padding:12px 24px;padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.crumbs{font-size:13px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.crumbs a{color:var(--ink-3);text-decoration:none}
.crumbs a:hover{color:var(--accent);text-decoration:underline}
.tstat{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.content{padding:20px 24px 40px;padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:20px;max-width:1320px;width:100%;align-content:start}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.pagehead h1{font-size:22px;font-weight:650}
.pagehead p{color:var(--ink-3)}
.mobilenav{display:none}
.banners{display:grid;gap:8px;padding:0 24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.banners:empty{display:none}
.banners>div:first-child{margin-top:12px}
.banner{border:1px solid var(--line-2);border-radius:8px;padding:9px 14px;background:var(--surface);color:var(--ink-2);overflow-wrap:anywhere}
.banner.bad{border-color:var(--l-red);background:var(--l-red-bg);color:var(--l-red)}

/* plakietki, przyciski, pola */
.lz{display:inline-flex;align-items:center;gap:4px;border-radius:3px;padding:1px 6px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;line-height:18px}
.lz.grey{background:var(--l-grey-bg);color:var(--l-grey)} .lz.blue{background:var(--l-blue-bg);color:var(--l-blue)}
.lz.green{background:var(--l-green-bg);color:var(--l-green)} .lz.yellow{background:var(--l-yellow-bg);color:var(--l-yellow)}
.lz.red{background:var(--l-red-bg);color:var(--l-red)} .lz.purple{background:var(--l-purple-bg);color:var(--l-purple)}
.lz.out{background:transparent;border:1px solid var(--line-2);color:var(--ink-2);line-height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;background:var(--surface)}
.pill b{font-weight:600;color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--bar-done)} .dot.warn{background:var(--bar-warn)} .dot.bad{background:var(--l-red)} .dot.you{background:var(--bar-rev)} .dot.off{background:var(--line-2)} .dot.run{background:var(--bar-wip)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:6px 12px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.sec:hover{background:var(--hover);filter:none}
.btn.sm{padding:2px 9px;font-size:13px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:default;filter:none}
.lk{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left;overflow-wrap:anywhere}
.lk:hover{color:var(--accent);text-decoration:underline}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13px;font-weight:600;justify-self:start}
.fi{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:5px 9px;min-width:0;max-width:100%}
.fi::placeholder{color:var(--ink-3)}
textarea.fi{resize:vertical;width:100%}
.sw{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:2px 10px 2px 4px;cursor:pointer;font-size:13px;color:var(--ink-2);white-space:nowrap}
.sw::before{content:"";width:28px;height:16px;border-radius:999px;background:radial-gradient(circle at 8px 8px,var(--ink-3) 0 5px,transparent 5.5px),var(--sunk);border:1px solid var(--line)}
.sw[aria-checked="true"]{color:var(--ink);border-color:var(--accent)}
.sw[aria-checked="true"]::before{background:radial-gradient(circle at 20px 8px,var(--accent-ink) 0 5px,transparent 5.5px),var(--accent)}

/* karty, panele */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel>h2{font-size:15px;font-weight:650;padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel>h2 small{font-size:12px;font-weight:500;color:var(--ink-3)}
.panel>h2 small a{color:var(--ink-3)}
.pad{padding:0 16px 14px;display:grid;gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;display:grid;gap:2px;min-width:0;text-decoration:none;color:inherit}
a.stat:hover{border-color:var(--line-2);background:var(--hover)}
.stat .l{font-size:13px;color:var(--ink-2);font-weight:500}
.stat .v{font-size:26px;font-weight:650;line-height:1.2}
.stat .d{font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.stat.red .v{color:var(--l-red)} .stat.purple .v{color:var(--l-purple)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.sys{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

/* listy */
.rows{list-style:none;margin:0;padding:0 16px 8px}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.rows li:first-child{border-top:0}
.rows .t{font-weight:500;display:block}
.rows .s{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.rows .r{text-align:right;font-size:13px;white-space:nowrap;display:grid;gap:4px;justify-items:end}
.rows .r.late{color:var(--l-red);font-weight:650}
.rows a{color:inherit;text-decoration:none}
.rows a:hover .t{color:var(--accent);text-decoration:underline}
.empty{padding:12px 16px 16px;color:var(--ink-3)}
.rows li.empty{display:block;padding:10px 0}
.pmn{padding:0 16px 14px;color:var(--ink-2)}
.pmn h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:10px 0 4px}
.pmn h3:first-child{margin-top:0}
.pmn ul{margin:0;padding-left:18px}
.pmn li{margin-top:3px}
.pmn b{color:var(--ink)}

/* tabela projektów */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--ink-3);text-align:left;padding:8px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr[data-go]{cursor:pointer}
tbody tr[data-go]:hover td{background:var(--hover)}
.proj{display:flex;gap:10px;min-width:200px}
.proj b{display:block;font-size:14px}
.proj b a{color:var(--ink);text-decoration:none}
.proj b a:hover{color:var(--accent);text-decoration:underline}
.proj p{font-size:13px;color:var(--ink-3);max-width:48ch;line-height:1.4}
.phase{display:grid;gap:4px;min-width:120px}
.phase .steps{display:flex;gap:3px}
.phase .steps i{height:6px;flex:1;border-radius:2px;background:var(--line)}
.phase .steps i.done{background:var(--ink-3)}
.phase .steps i.cur{background:var(--accent)}
.phase span{font-size:13px;font-weight:600}
.prog{display:grid;gap:4px;min-width:130px}
.track{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;display:flex;border:1px solid var(--line)}
.track i{height:100%;display:block}
.prog span{font-size:12px;color:var(--ink-2)}
.due b{display:block;font-size:13px;font-weight:600;white-space:nowrap}
.due span{font-size:12px;color:var(--ink-3)}
.due.late b{color:var(--l-red)}
.dt{font-size:13px}.dt th,.dt td{padding:6px 8px;text-align:right}.dt th:first-child,.dt td:first-child{text-align:left}
.mx td,.mx th{padding:8px 10px;font-size:13px}

/* strona projektu */
.phead{display:grid;gap:12px}
.ptitle{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.ptitle .av{width:40px;height:40px;font-size:14px;border-radius:8px}
.ptitle h1{font-size:22px;font-weight:650;overflow-wrap:anywhere}
.desc{max-width:75ch;color:var(--ink-2);font-size:15px}
.stepper{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.stepper button{all:unset;box-sizing:border-box;border-top:4px solid var(--line);padding-top:6px;font-size:12px;color:var(--ink-3);cursor:pointer;min-width:0}
.stepper button[disabled]{cursor:default}
.stepper button:not([disabled]):hover b{color:var(--accent)}
.stepper button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stepper b{display:block;font-size:13px;color:var(--ink-2);font-weight:600}
.stepper .done{border-color:var(--ink-3)}
.stepper .cur{border-color:var(--accent)}
.stepper .cur b{color:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:grid;gap:2px;min-width:0}
.fact .l{font-size:12px;color:var(--ink-3);font-weight:500}
.fact .v{font-size:15px;font-weight:650;overflow-wrap:anywhere}
.fact .d{font-size:12px;color:var(--ink-3)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.tabs a{padding:8px 12px;color:var(--ink-2);text-decoration:none;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--accent);border-color:var(--accent)}

/* tablica */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{background:var(--sunk);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:120px;min-width:0}
.col h3{font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;padding:4px 6px;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:8px;cursor:pointer;text-align:left;width:100%;box-shadow:0 1px 1px rgba(9,30,66,.08);min-width:0}
.card:hover{border-color:var(--line-2);background:var(--hover)}
.card .tt{font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.card .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.card .bd{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2)}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.who{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2)}
.who i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;color:#fff}
.dl{font-size:12px;font-weight:600;white-space:nowrap}
.dl.late{color:var(--l-red)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar select,.toolbar .tg{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:5px 10px;max-width:100%;min-width:0}
.toolbar .tg{cursor:pointer;font-weight:500}
.toolbar .tg[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.addf{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addf .fi[name="title"]{flex:1;min-width:160px}
.addf select{max-width:100%}

/* etapy */
.stagelist{list-style:none;margin:0;padding:0 16px 8px}
.stagelist li{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.stagelist li:first-child{border-top:0}
.stagelist .nm b{display:block}
.stagelist .nm span{font-size:12px;color:var(--ink-3)}
.stagelist .ed{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tl{position:relative;height:22px;background:var(--sunk);border-radius:4px}
.tl .b{position:absolute;top:4px;bottom:4px;border-radius:3px}
.tl .today{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--l-red)}

/* księga */
.check{list-style:none;margin:0;padding:0 16px 8px}
.check>li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.check>li:first-child{border-top:0}
.qa{list-style:none;margin:0;padding:0 16px 8px}
.qa>li{padding:12px 0;border-top:1px solid var(--line)}
.qa>li:first-child{border-top:0}
.qa .q{font-size:14px;line-height:1.45}
.qa .s{font-size:12.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qa form{display:flex;gap:8px;margin-top:8px;align-items:flex-start}
.qa textarea{flex:1;min-width:0;min-height:38px;resize:vertical;font:inherit;font-size:13.5px}
.qa .ans{margin-top:6px;font-size:13.5px;color:var(--ink-2);border-left:3px solid var(--line-2);padding-left:8px}

.plan{padding:0 16px 14px}

.plan textarea{flex:1;min-width:0;min-height:44px;resize:vertical;font:inherit;font-size:14px}

.plan li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.plan li:first-child{border-top:0}
.plan li label{display:flex;gap:10px;align-items:flex-start;flex:1;min-width:0;cursor:pointer}
.plan li input{margin-top:3px}
.plan .pp{font-size:12.5px;color:var(--ink-3)}
.plan .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.post{margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:10px;display:grid;gap:10px}
.post img{width:100%;max-width:420px;border-radius:8px;border:1px solid var(--line)}
.post .ptx p{margin:6px 0 0;font-size:13.5px;line-height:1.5;white-space:normal}
.post .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.lc{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.lc input{min-width:220px;max-width:100%;font:inherit;font-size:13px}
.kv2{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;padding:0 16px 14px;font-size:13px;color:var(--ink-2)}
.kv2 label{display:inline-flex;gap:6px;align-items:center}

/* marketing */
.meter{display:flex;align-items:center;gap:10px}
.meter .track{flex:1;height:10px}

/* szuflada */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;padding:20px;padding-right:max(20px,env(safe-area-inset-right,0px));padding-top:max(20px,env(safe-area-inset-top,0px));overflow-y:auto;box-shadow:-8px 0 24px rgba(0,0,0,.12)}
#dbody{display:grid;gap:14px;align-content:start}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.drawer h2{font-size:18px;font-weight:650;overflow-wrap:anywhere}
.drawer textarea.ttl{font-size:17px;font-weight:650;line-height:1.3}
.drawer dl{display:grid;grid-template-columns:100px minmax(0,1fr);gap:8px 12px;margin:0;font-size:14px;align-items:center}
.drawer dt{color:var(--ink-3)}
.drawer dd{margin:0;min-width:0;overflow-wrap:anywhere}
.drawer dd .fi{width:100%}
.drawer dd .row,.abox .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.drawer dd .row .fi{width:auto;flex:1;min-width:120px}
.drawer h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.seg{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:2px 9px;cursor:pointer;font-size:13px}
.seg[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
.x{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:4px 10px;cursor:pointer}
.abox{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.abox.you{border-color:var(--bar-rev);background:var(--l-purple-bg)}
.abox.bad{border-color:var(--l-red);background:var(--l-red-bg)}
.act{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.rsn{font-size:13px;color:var(--ink-3)}
.res{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--sunk);margin:0}
.stp{list-style:none;margin:0;padding:0;font-size:13px;max-height:220px;overflow:auto}
.stp li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:3px 0;border-top:1px solid var(--line)}
.stp li:first-child{border-top:0}
.stp .t{color:var(--ink-3);font-variant-numeric:tabular-nums}
.stp .s{overflow-wrap:anywhere}
.note{font-size:13px;color:var(--ink-3)}
.hint{border:1px dashed var(--line-2);border-radius:8px;padding:12px 16px;color:var(--ink-2);background:var(--surface)}

/* agenci, projekty */
.abar{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;padding:14px 16px}
.abar .sp{flex:1}
.ahint{padding:0 16px 12px;font-size:13.5px;color:var(--ink-2);display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap}
.runs li{grid-template-columns:auto minmax(0,1fr) auto}
.runs .wh{font-size:12.5px;color:var(--ink-3);text-align:right;white-space:nowrap}
.plx li{grid-template-columns:minmax(0,1fr) auto}
.plx .pf{font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.plx .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;white-space:normal}
.padd{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:0 16px 16px}
.padd label{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:2px 10px;cursor:pointer;font-size:13px}
.chip[aria-pressed="false"]{color:var(--ink-3);text-decoration:line-through}
.chip[aria-pressed="false"] .dot{opacity:.3}
details{padding:0 16px 12px}
details+details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600}
details[open]>summary{margin-bottom:8px}
details ul,details ol{margin:6px 0 0;padding-left:20px;color:var(--ink-2)}
details li{margin-top:4px}

/* wskaźniki */
.kgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.chartbox{padding:0 16px 14px;display:grid;gap:8px;min-width:0}
.chartbox p.cap{font-size:13px;color:var(--ink-3)}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.chartbox svg text{fill:var(--ink-3);font:12px var(--font)}
.chartbox svg text.lb{fill:var(--ink-2);font-weight:600}
.chartbox svg .gl{stroke:var(--line);stroke-width:1}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:6px;padding:8px 10px;font-size:13px;line-height:1.45;z-index:30;min-width:160px;box-shadow:0 6px 18px rgba(0,0,0,.2)}

.tip .r{display:flex;justify-content:space-between;gap:14px}

.hbar .tr i{display:block;height:100%;background:var(--c1);border-radius:0 3px 3px 0}

.dbox h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dbox h3 small{font-size:12px;font-weight:500;text-transform:none;letter-spacing:0}
.dbox p{font-size:14px;overflow-wrap:anywhere}
.dbox .sub{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-top:2px}
.steps-ro{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.steps-ro li{overflow-wrap:anywhere}
.steps-ro label{display:flex;gap:8px;align-items:flex-start}
.steps-ro input{margin:3px 0 0;flex:none}
.steps-ro .ok{color:var(--ink-3);text-decoration:line-through}
.notes{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.mats{display:flex;flex-wrap:wrap;gap:6px}
.mats .btn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;justify-content:flex-start}
.mats .btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.mat{border:1px solid var(--line);border-radius:6px;background:var(--sunk);display:grid;min-width:0}
.mat .mh{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:6px 8px 6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mat .mh b{font-size:13px;overflow-wrap:anywhere;min-width:0}
.mat .mh span{display:flex;gap:6px}
.mdx{padding:8px 12px 10px;font-size:13.5px;color:var(--ink-2);max-height:360px;overflow:auto;overflow-wrap:anywhere}
.mdx h3{font-size:12px;margin:10px 0 4px}
.mdx h3:first-child{margin-top:0}
.mdx p{margin:4px 0}
.mdx ul{margin:4px 0;padding-left:18px}
.mdx b{color:var(--ink)}
.warn{border:1px solid var(--bar-warn);background:var(--l-yellow-bg);color:var(--l-yellow);border-radius:6px;padding:6px 10px;font-size:13px;overflow-wrap:anywhere}
.dcap{font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}
.wyn p{white-space:pre-wrap}

.nx{display:grid;gap:2px;min-width:150px;max-width:240px}
.nx .lk,.nx b{font-size:13px;font-weight:600;line-height:1.35}
.nx span{font-size:12px;color:var(--ink-3)}
.nx span.late{color:var(--l-red);font-weight:600}
.pcards{display:none;list-style:none;margin:0;padding:0 16px 12px;gap:10px}
.pcard{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;cursor:pointer;min-width:0}
.pcard:hover{background:var(--hover)}
.pcard .ph1{display:flex;gap:10px;align-items:center;min-width:0}
.pcard .ph1 a{font-weight:650;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.pcard .ph1 .lz{margin-left:auto}
.pcard .ph1 a:hover{color:var(--accent);text-decoration:underline}
.pcard .tg2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-2)}

.colsw{display:none;gap:4px;flex-wrap:wrap}

.bnav{display:none}

  .stats,.facts{grid-template-columns:repeat(2,minmax(0,1fr))}

}

    padding:4px max(4px,env(safe-area-inset-right,0px)) max(4px,env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}

  .content{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .drawer{padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}
  .nx{max-width:none}
}
@media (max-width:480px){.stats,.facts{grid-template-columns:minmax(0,1fr)}

function calcPhase(p,o){

}

const WORK=[9*60,18*60];
function dayInfo(k){
  const d0=fromKey(k),d1=addDays(d0,1),evs=[];
  D.cal.events.forEach(e=>{
    if(hiddenCals.has(e.calId))return;
    if(e.allDay){if(e.d0<=k&&k<=e.d1)evs.push({e:e,allDay:true,a:-1,b:-1})}
    else if(e.s<d1&&e.e>=d0&&!(+e.e===+d0&&e.e>e.s))evs.push({e:e,allDay:false,a:Math.max(0,Math.round((e.s-d0)/6e4)),b:Math.min(1440,Math.round((e.e-d0)/6e4))});
  });
  evs.sort((x,y)=>x.a-y.a||x.b-y.b);
  const busy=[];evs.filter(x=>!x.allDay&&x.b>x.a).map(x=>[x.a,x.b]).sort((a,b)=>a[0]-b[0]).forEach(x=>{const l=busy[busy.length-1];if(l&&x[0]<=l[1])l[1]=Math.max(l[1],x[1]);else busy.push([x[0],x[1]])});
  const free=[];let cur=WORK[0];
  for(const x of busy){if(x[1]<=WORK[0])continue;if(x[0]>=WORK[1])break;if(x[0]-cur>=30)free.push([cur,x[0]]);cur=Math.max(cur,x[1])}
  if(WORK[1]-cur>=30)free.push([cur,WORK[1]]);
  return {evs:evs,free:free,busyMin:busy.reduce((s,x)=>s+x[1]-x[0],0)};
}

const FOCUSABLE='button,a[href],input,select,textarea,[tabindex]';
function setHtml(el,h){
  if(!el||el._h===h)return false;
  const a=document.activeElement,inside=!!a&&a!==el&&el.contains(a);
  let k='',i=-1;
  if(inside){k=a.dataset.k||'';if(!k)i=Array.prototype.indexOf.call(el.querySelectorAll(FOCUSABLE),a)}
  el.innerHTML=h;el._h=h;
  if(inside){
    const n=k?Array.prototype.find.call(el.querySelectorAll('[data-k]'),x=>x.dataset.k===k):el.querySelectorAll(FOCUSABLE)[i];
    if(n&&!n.disabled)n.focus();
  }
  return true;
}

function askPlan(text){

function acceptPlan(rid){
  const r=runById(rid);if(!r||!r.plan)return;

}

function md(text){
  let h='',ul=false;
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  String(text).split(/\r?\n/).forEach(l=>{
    const li=/^\s*[-*]\s+(.*)$/.exec(l),hd=/^#{1,6}\s+(.*)$/.exec(l);
    if(li){if(!ul){h+='<ul>';ul=true}h+='<li>'+inl(li[1])+'</li>';return}
    if(ul){h+='</ul>';ul=false}
    if(hd)h+='<h3>'+inl(hd[1])+'</h3>';else if(l.trim())h+='<p>'+inl(l)+'</p>';
  });
  return h+(ul?'</ul>':'');
}

const CFD_ST=[['done','Zrobione','--s4'],['rev','Do odbioru','--s3'],['wip','W toku','--s2'],['todo','Do zrobienia','--s1']];
const WEEKS=()=>[7,6,5,4,3,2,1,0].map(i=>addK(D.todayKey,-7*i));

function nowCounts(p){const c=p.c;return {todo:c.todo,wip:c.wip+c.blocked,rev:c.rev,done:c.done,total:c.all}}
function hist(p){
  if(HC[p.id])return HC[p.id];
  const W=WEEKS(),out=W.map((w,i)=>{
    if(i===7)return nowCounts(p);
    let e=null;for(let j=D.history.length-1;j>=0;j--){if(D.history[j].date<=w){e=D.history[j];break}}
    if(!e)return null;const n=e.projects[p.id];if(!n)return {todo:0,wip:0,rev:0,done:0,total:0};
    const r={todo:+n.todo||0,wip:(+n.wip||0)+(+n.blocked||0),rev:+n.rev||0,done:+n.done||0};r.total=+n.total||(r.todo+r.wip+r.rev+r.done);return r});
  return HC[p.id]=out;
}

function findTask(ref,loose){

async function loadMat(pid,r){
  const k=pid+'|'+r.path+'#'+r.anchor;let d={ok:false,error:'Nie udało się wczytać pliku.'};

    if(res.status===401){location.assign('/wejscie');return}
    let j={};try{j=await res.json()}catch(e){}
    d=res.ok&&j.ok!==false&&typeof j.text==='string'?{ok:true,title:String(j.title||''),text:j.text}:{ok:false,error:String(j.error||(res.status===404?'Nie znaleziono pliku albo sekcji.':'Nie udało się wczytać pliku.'))};

}

async function copyText(text){
  let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true}catch(e){}
  if(!ok)try{const a=document.activeElement,t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(t);t.select();ok=document.execCommand('copy');t.remove();if(a&&a.focus)a.focus()}catch(e){}
  return ok;
}

  return {status:r.status,ok:r.ok&&j.ok!==false,error:j.error||'',id:j.id||'',data:j};
}
function enqueue(fn){
  pending++;
  queue=queue.then(fn).catch(()=>{offline=true}).then(()=>{pending--;if(!pending)return load(true)});
}
const failMsg=(r,fail)=>r.status===409?(r.error?r.error.replace(/\.$/,'')+'. Odświeżam.':CONFL):(r.error||fail);
function patchTask(id,ch){
  const t=D.tasks.find(x=>x.id===id);if(!t)return;
  ch=Object.assign({},ch);
  if('title' in ch){const v=cleanT(ch.title),o=cleanT(t.title);if(!v||v===o)delete ch.title;else ch.title=v.slice(0,Math.max(160,o.length))}
  ['blocked','channel'].forEach(k=>{if(k in ch)ch[k]=cleanT(ch[k]).slice(0,120)});
  if(ch.state&&ch.state!=='blocked'&&t.blocked&&!('blocked' in ch))ch.blocked='';
  Object.keys(ch).forEach(k=>{if(ch[k]===t[k]||(!ch[k]&&!t[k]))delete ch[k]});
  if(!Object.keys(ch).length){render(true);return}
  const ref=refOf(t),only=Object.keys(ch).length===1&&'state' in ch;
  Object.assign(t,ch);if('needsYou' in ch)t.needs=ch.needsYou?[ch.needsYou]:[];derive(D);
  if(DR&&DR.kind==='task'&&DR.id===id)DR.ref=refOf(t);
  render(true);
  if(!LIVE){say(PRV);return}
  enqueue(async()=>{
    const cur=D.tasks.indexOf(t)>=0?t:findTask(ref);
    if(!cur){say(CONFL);return}
    const r=only?await post('/api/task/state',{id:cur.id,title:ref.title,state:ch.state}):await post('/api/task/update',{id:cur.id,title:ref.title,changes:ch});
    if(!r.ok&&r.status!==401)say(failMsg(r,'Nie udało się zapisać zmiany.'));
  });
}
function applyField(t,f,v){
  if(f==='minutes'){const n=parseInt(v,10);patchTask(t.id,{minutes:isNaN(n)?0:Math.min(1440,Math.max(0,n))});return}
  if(f==='date'&&v&&!isDay(v)){render(true);return}
  const ch={};ch[f]=v;patchTask(t.id,ch);
}
function addTask(pid,dest,title){
  title=cleanT(title).slice(0,160);if(!title||!P(pid))return;
  if(!LIVE){
    const s=dest.stage?stageOf(dest.stage):null,c=dest.campaign?D.campaigns.find(x=>x.id===dest.campaign):null;
    const t={id:'tmp|'+(++tmpN),project:pid,kind:c?'publikacja':'zadanie',stage:s?s.id:'',group:s?s.title:c?c.name:INBOX,campaign:c?c.id:'',file:c?c.file:'ZADANIA.md',line:0,
      title:title,state:'todo',executor:'',machine:'',date:'',slot:'',minutes:0,needsYou:'',blocked:'',channel:'',runId:'',runBlock:''};
    D.tasks.push(t);derive(D);render(true);say(PRV);return}
  enqueue(async()=>{
    const body={project:pid,title:title};if(dest.stage)body.stage=dest.stage;if(dest.campaign)body.campaign=dest.campaign;
    const r=await post('/api/task/add',body);
    if(r.ok)say('Dodano: '+title);else if(r.status!==401)say(r.error||'Nie udało się dodać zadania.');
  });
}
function patchStage(id,date){
  const s=stageOf(id);if(!s)return;
  if(!isDay(date)){say('Podaj termin jako datę.');render(true);return}
  if(date===s.date)return;
  const title=s.title;s.date=date;derive(D);render(true);
  if(!LIVE){say(PRV);return}
  enqueue(async()=>{const r=await post('/api/stage/update',{id:id,title:title,date:date});if(!r.ok&&r.status!==401)say(failMsg(r,'Nie udało się zapisać terminu.'))});
}
function patchCamp(id,ch){
  const c=D.campaigns.find(x=>x.id===id);if(!c)return;
  if('result' in ch&&ch.result===(+c.result||0))delete ch.result;
  if('state' in ch&&ch.state===c.state)delete ch.state;
  if(!Object.keys(ch).length)return;
  Object.assign(c,ch);derive(D);render(true);
  if(!LIVE){say(PRV);return}
  enqueue(async()=>{const r=await post('/api/campaign/update',{id:id,name:c.name,changes:ch});if(!r.ok&&r.status!==401)say(failMsg(r,'Nie udało się zapisać kampanii.'))});
}
function setMeta(pid,ch){
  const p=P(pid);if(!p||!canMeta(p))return;
  if('phase' in ch&&ch.phase===p.phase&&p.phaseSource==='karta')return;
  if('phase' in ch)p.phaseIn=ch.phase,p.phaseSrcIn='karta';
  if('client' in ch)p.client=ch.client;
  if('threshold' in ch)p.threshold=ch.threshold;
  derive(D);render(true);
  if(!LIVE){say(PRV);return}
  enqueue(async()=>{const body=Object.assign({id:pid},ch),r=await post('/api/project/meta',body);
    if(!r.ok&&r.status!==401)say(r.status===404&&!r.error?'Serwer nie obsługuje jeszcze zmiany karty projektu.':failMsg(r,'Nie zapisano karty projektu.'))});
}
/* agenci: działania */
function agentPost(path,body,fail,done){
  enqueue(async()=>{const r=await post(path,body);if(r.ok){if(done)done(r)}else if(r.status!==401)say(failMsg(r,fail))});
}
function simRun(o,t){
  const r=Object.assign({id:'podglad-'+(++tmpN),state:'queued',auto:false,machine:D.agents.machine,project:'',projectName:'',taskId:'',file:'',queuedAt:isoL(new Date()),startedAt:null,endedAt:null,
    durationMs:null,activity:'',steps:[],result:'',error:'',turns:0,tokensIn:0,tokensOut:0,costUsd:0,model:'',keySource:'none',denials:[]},o);
  D.agents.runs.unshift(r);if(t)t.runId=r.id;
  say(PRV);render();
  const at=(ms,fn)=>setTimeout(()=>{if(runById(r.id)===r&&isAct(r)){fn();render()}},ms);
  const st=x=>{r.activity=x;r.steps.push({t:isoL(new Date()).slice(11),text:x})};
  at(1200,()=>{r.state='running';r.startedAt=isoL(new Date());st('Podgląd: start')});
  at(2600,()=>st('Podgląd: praca'));
  at(4200,()=>simEnd(r,'done'));
}
function simEnd(r,state){
  r.state=state;r.endedAt=isoL(new Date());r.durationMs=r.startedAt?Date.now()-tOf(r.startedAt):0;r.activity='';
  if(state==='done'){r.result=PRV+'.';D.agents.today.runs++}
  D.tasks.forEach(t=>{if(t.runId===r.id)t.runId=''});
}
function runTask(id){
  const t=D.tasks.find(x=>x.id===id);if(!t||!D.agents)return;
  const why=blockOf(t);
  if(why){say('Nie można uruchomić: '+why);return}
  if(!LIVE){simRun({kind:'task',tool:toolOf(t),project:t.project,projectName:projName(t.project),taskId:t.id,file:t.file,title:t.title},t);return}
  A.starting[t.id]=1;render();
  agentPost('/api/agent/run',{id:t.id,title:t.title},'Nie uruchomiono zadania.');
}
function stopRun(id){
  const r=runById(id);if(!r||!isAct(r))return;
  if(!LIVE){simEnd(r,'stopped');say(PRV);render();return}
  agentPost('/api/agent/stop',{id:id},'Nie zatrzymano.');
}
function runPm(){
  if(!D.agents||pmOn()||!D.agents.tools.claude.found)return;
  if(!LIVE){simRun({kind:'pm',tool:'claude',title:KIND.pm});return}
  A.busy.pm=true;render();agentPost('/api/agent/pm',{},'Raport PM nie ruszył.');
}
function runCheck(){
  if(!D.agents||A.busy.check||!D.agents.tools.claude.found)return;
  if(!LIVE){simRun({kind:'check',tool:'claude',title:KIND.check});return}
  A.busy.check=true;render();agentPost('/api/agent/check',{tool:'claude'},'Test nie ruszył.');
}
function setAutomat(){
  const a=D.agents;if(!a)return;
  a.automat=!a.automat;render();
  if(!LIVE){say(PRV);return}
  agentPost('/api/agent/automat',{enabled:a.automat},'Nie zmieniono Automatu.');
}
function openLogin(){
  if(!LIVE){say(PRV);return}
  A.busy.login=true;render();
  enqueue(async()=>{const r=await post('/api/agent/login',{tool:'claude'});A.busy.login=false;
    if(r.ok)say(r.data&&r.data.url?'Otwórz stronę logowania, zatwierdź konto i wklej kod w panelu.':'Otworzyłem Terminal. Zaloguj się w przeglądarce, potem kliknij „Sprawdź ponownie”.');else if(r.status!==401)say(r.error||'Nie otworzono logowania.')});
}
function submitLoginCode(code){
  code=String(code||'').trim();
  if(!code){say('Wklej kod ze strony logowania.');return}
  if(!LIVE){say(PRV);return}
  const fa=document.activeElement;if(fa&&fa.blur)fa.blur();
  A.busy.lc=true;render(true);
  enqueue(async()=>{const r=await post('/api/agent/login-code',{code:code});A.busy.lc=false;
    if(r.ok)say('Claude zalogowany. Agenci mogą pracować.');else if(r.status!==401)say(r.error||'Kod nie został przyjęty.')});
}
function recheckLogin(){
  if(!LIVE){say(PRV);return}
  A.busy.recheck=true;render();
  enqueue(async()=>{const r=await fetch('/api/agent/recheck',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});let j={};try{j=await r.json()}catch(e){}
    A.busy.recheck=false;say(j.loggedIn&&j.loggedIn.claude?'Claude zalogowany.':'Claude nadal niezalogowany.')});
}
async function copyCmd(){
  const cmd=loginCmd(),ok=await copyText(cmd);
  say(ok?'Skopiowano: '+cmd:'Skopiuj ręcznie: '+cmd);
}
function removeProject(id){
  A.confirm='';render(true);
  if(!LIVE){say(PRV);return}
  agentPost('/api/project/remove',{id:id},'Nie usunięto projektu.',()=>say('Usunięto z rejestru. Pliki zostały.'));
}
function addProject(){
  const pi=$('#ppath'),ni=$('#pname');if(!pi)return;
  const path=pi.value.trim(),name=ni.value.trim();
  if(!path){pi.focus();return}
  if(!LIVE){say(PRV);return}
  if(A.busy.add)return;A.busy.add=true;
  const body={path:path,files:$('#pfiles').checked};if(name)body.name=name;
  agentPost('/api/project/add',body,'Nie dodano projektu.',()=>{const a=$('#ppath'),b=$('#pname');if(a)a.value='';if(b)b.value='';say('Dodano projekt.')});
}
function agentAct(el){
  const a=el.dataset.ag,id=el.dataset.id||'';
  if(el.disabled||el.getAttribute('aria-disabled')==='true')return;
  if(a==='run')runTask(id);
  else if(a==='stop')stopRun(id);
  else if(a==='pm')runPm();
  else if(a==='check')runCheck();
  else if(a==='automat')setAutomat();
  else if(a==='copy')copyCmd();
  else if(a==='login')openLogin();
  else if(a==='recheck')recheckLogin();
  else if(a==='prm'){A.confirm=id;render(true);focusK('pn:'+id)}
  else if(a==='prm-no'){A.confirm='';render(true);focusK('pr:'+id)}
  else if(a==='prm-yes')removeProject(id);
  else if(a==='plan-go')acceptPlan(id);
}
const focusK=k=>{const n=Array.prototype.find.call(document.querySelectorAll('[data-k]'),x=>x.dataset.k===k);if(n)n.focus()};

/* ---------- wczytywanie ---------- */
const restSig=raw=>{const o=Object.assign({},raw);delete o.agents;delete o.generatedAt;return JSON.stringify(o)};
const idle=()=>{if(!pending){A.starting={};A.busy.pm=A.busy.check=A.busy.add=false}};
/* w trakcie edycji albo gdy reszta danych się nie zmieniła: tylko blok agentów */
function applyAgents(raw){
  D.agents=normAgents(raw.agents);D.generatedAt=raw.generatedAt||D.generatedAt;
  const m={};(raw.tasks||[]).forEach(z=>{m[z.id+'\n'+z.title]=z});
  D.tasks.forEach(t=>{const z=m[t.id+'\n'+t.title];if(z){t.runId=z.runId||'';t.runBlock=z.runBlock||''}});
  if(raw.pmNote)D.pmNote={date:raw.pmNote.date,text:String(raw.pmNote.text||'')};
  render();
}
async function load(force){
  clearTimeout(timer);
  const seq=++loadSeq;
  try{
    const r=await fetch('/api/data',{cache:'no-store'});
    if(r.status===401){location.assign('/wejscie');return}
    if(!r.ok)throw new Error(r.status);
    const raw=await r.json();
    if(seq!==loadSeq)return;
    const sig=restSig(raw),hold=force!==true&&(editing()||pending),was=offline;
    idle();offline=false;
    if(D&&(hold||(force!==true&&sig===A.sig&&Date.now()-A.fullAt<60000))){applyAgents(raw);if(was)renderTop()}
    else{D=normalize(raw);A.sig=sig;A.fullAt=Date.now();render(force===true)}
  }catch(e){
    if(seq!==loadSeq)return;
    offline=true;idle();
    if(D)render();else $('#view').innerHTML='<div class="banner bad">Brak połączenia z serwerem panelu. Uruchom: <code>python3 dashboard/server.py</code></div>';
  }
  timer=setTimeout(load,D&&D.cal.connecting?2000:anyActive()?3000:D&&(editing()||pending)?15000:60000);
}

/* ---------- zdarzenia ---------- */
document.addEventListener('click',async ev=>{
  if(!D)return;
  const qq=s=>ev.target.closest(s);let el;
  if(el=qq('#refresh')){if(LIVE){say('Odświeżam…');load(true)}else say('Podgląd: dane przykładowe są stałe.');return}
  if(el=qq('#theme')){PF.theme=PF.theme===''?'light':PF.theme==='light'?'dark':'';savePF();applyTheme();return}
  if(qq('[data-close]')){closeDrawer();return}
  if(el=qq('[data-copy]')){copyPost(el.dataset.copy);return}
  if(el=qq('[data-mat]')){openMat(el.dataset.mat);return}
  if(el=qq('[data-matcopy]')){copyMat();return}
  if(el=qq('[data-matclose]')){if(DR){const k=DR.mat;DR.mat='';renderDrawer(true);const t=findTask(DR.ref,true),i=t&&t.detail?t.detail.refs.findIndex(r=>matKey(t,r)===k):-1;if(i>=0)focusK('mat:'+i)}return}
  if(el=qq('[data-colsw]')){PF.col=el.dataset.colsw;savePF();render(true);focusK('colsw:'+PF.col);return}
  if(el=qq('[data-q]')){openDrawer('q',el.dataset.q);return}
  if(el=qq('[data-ag]')){agentAct(el);return}
  if(el=qq('[data-act]')){const a=ACT[el.dataset.act];if(a&&el.dataset.id)patchTask(el.dataset.id,a);return}
  if(el=qq('[data-run]')){openDrawer('run',el.dataset.run);return}
  if(el=qq('[data-task]')){openDrawer('task',el.dataset.task);return}
  if(el=qq('[data-state]')){if(DR&&DR.kind==='task')patchTask(DR.id,{state:el.dataset.state});return}
  if(el=qq('[data-dq]')){if(DR&&DR.kind==='task'){const v=el.dataset.dq;patchTask(DR.id,{date:v===''?'':addK(D.todayKey,+v)})}return}
  if(el=qq('[data-phase]')){if(!el.disabled)setMeta(el.dataset.pid,{phase:el.dataset.phase});return}
  if(el=qq('[data-toggle]')){const t=document.getElementById(el.dataset.toggle);if(t){t.hidden=!t.hidden;el.textContent=t.hidden?'Pokaż liczby w tabeli':'Ukryj tabelę'}return}
  if(el=qq('#bm')){PF.mine=!PF.mine;savePF();render(true);return}
  if(el=qq('[data-cal]')){const id=el.dataset.cal;if(hiddenCals.has(id))hiddenCals.delete(id);else hiddenCals.add(id);savePF();render(true);return}
  if(el=qq('[data-connect]')){
    if(!LIVE)return;
    try{await fetch('/api/calendar/connect',{method:'POST'});D.cal.connecting=true;render()}catch(e){offline=true;render()}
    clearTimeout(timer);timer=setTimeout(load,2000);return}
  const tr=qq('[data-go]');if(tr&&!qq('a,button')){location.hash=tr.dataset.go;return}
});
document.addEventListener('change',ev=>{
  if(!D)return;const el=ev.target;
  if(el.id==='mnav'){location.hash=el.value;return}
  if(el.dataset.psel){const m=A.psel[el.dataset.psel]||(A.psel[el.dataset.psel]={});m[el.dataset.pid]=el.checked;render(true);return}
  if(el.id==='bp'){PF.bp=el.value;savePF();render(true);return}
  if(el.id==='ms'){PF.ms=el.value;savePF();render(true);return}
  if(el.dataset.f&&DR&&DR.kind==='task'){const t=findTask(DR.ref,true);if(t)applyField(t,el.dataset.f,el.value);return}
  if(el.dataset.stage){patchStage(el.dataset.stage,el.value);return}
  if(el.dataset.camp){const id=el.dataset.cid;
    if(el.dataset.camp==='state')patchCamp(id,{state:el.value});
    else{const n=parseFloat(String(el.value).replace(',','.'));if(isNaN(n)||n<0||n>1e9){say('Wynik musi być liczbą od 0.');render(true);return}patchCamp(id,{result:n})}
    return}
  if(el.dataset.meta){const v=el.value;setMeta(el.dataset.pid,el.dataset.meta==='client'?{client:v==='tak'}:{threshold:v});return}
});
document.addEventListener('submit',ev=>{
  if(!D)return;const f=ev.target;ev.preventDefault();
  if(f.id==='padd'){addProject();return}
  if(f.dataset.lc){const i=f.querySelector('input');submitLoginCode(i?i.value:'');return}
  if(f.id==='plan'){const t=f.querySelector('textarea');askPlan(t?t.value:'');return}
  if(f.dataset.qa){const t=f.querySelector('textarea');answerQ(f.dataset.qa,+f.dataset.n,t?t.value:'');return}
  const ti=f.querySelector('[name="title"]');if(!ti)return;const v=ti.value;
  if(f.dataset.addp){const d=f.querySelector('[name="dest"]').value,dest=d.slice(0,2)==='s:'?{stage:d.slice(2)}:{};ti.value='';addTask(f.dataset.addp,dest,v);ti.focus()}
  else if(f.dataset.addc){ti.value='';addTask(f.dataset.pid,{campaign:f.dataset.addc},v);ti.focus()}
});
document.addEventListener('input',ev=>{
  if(ev.target.dataset&&ev.target.dataset.qd!=null){QD[ev.target.dataset.qd]=ev.target.value;return}
  if(ev.target.id==='q'&&D){q=ev.target.value.trim().toLowerCase();renderSide(route())}
});
document.addEventListener('mousemove',ev=>{
  const hit=ev.target.closest&&ev.target.closest('svg[data-chart] .hit');if(!hit)return;
  const svg=hit.closest('svg'),c=CHARTS[svg.dataset.chart];if(!c)return;
  const r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)*c.W/r.width,cx=svg.querySelector('.cx');let i;
  if(c.type==='x'){i=Math.max(0,Math.min(c.n-1,Math.round((px-c.ml)/c.iw*(c.n-1))));if(cx){cx.setAttribute('x1',c.x(i));cx.setAttribute('x2',c.x(i));cx.setAttribute('opacity','.5')}}
  else i=Math.max(0,Math.min(c.n-1,Math.floor((px-c.ml)/c.bw)));
  tipShow(c.html(i),ev);
});
document.addEventListener('mouseout',ev=>{
  const hit=ev.target.closest&&ev.target.closest('svg[data-chart] .hit');if(!hit)return;
  tipHide();const cx=hit.closest('svg').querySelector('.cx');if(cx)cx.setAttribute('opacity','0');
});
document.addEventListener('keydown',ev=>{
  const qt=ev.target.closest&&ev.target.closest('form[data-qa] textarea, form#plan textarea');
  if(qt&&ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();const f=qt.form;if(f.requestSubmit)f.requestSubmit();else f.dispatchEvent(new Event('submit',{cancelable:true,bubbles:true}));return}
  if(!D||ev.metaKey||ev.ctrlKey||ev.altKey)return;
  const a=document.activeElement,tg=a&&a.tagName,k=ev.key,inField=tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT';
  if(DR&&k==='Tab'){const box=$('#drawer');if(box){const f=Array.prototype.filter.call(box.querySelectorAll(FOCUSABLE),x=>!x.disabled&&x.offsetParent!==null);
    if(f.length){const i=f.indexOf(a);if(ev.shiftKey&&(i<=0)){ev.preventDefault();f[f.length-1].focus()}else if(!ev.shiftKey&&(i<0||i===f.length-1)){ev.preventDefault();f[0].focus()}}}return}
  if(inField){
    if(k==='Escape'){ev.preventDefault();
      if(a.id==='q'&&a.value){a.value='';q='';renderSide(route());return}
      a.blur();if(a.closest('#drawerHost'))render(true);return}
    if(k==='Enter'&&a.id==='q'){const n=$('#plist a');if(n){ev.preventDefault();location.hash=n.getAttribute('href');a.blur()}return}
    if(k==='Enter'&&!ev.shiftKey&&tg==='TEXTAREA'&&a.closest('#drawerHost')){ev.preventDefault();a.blur()}
    return;
  }
  if(k==='Escape'){if(DR){ev.preventDefault();closeDrawer()}return}
  if(DR){if(k==='r'&&DR.kind==='task'){ev.preventDefault();runTask(DR.id)}return}
  if(k==='/'){ev.preventDefault();const s=$('#q');if(s.offsetParent!==null)s.focus();else $('#mnav').focus();return}
  if(gWait&&Date.now()-gWait<1500){gWait=0;const m={p:'przeglad',w:'wskazniki',t:'tablica',d:'terminy',a:'agenci'}[k];if(m){ev.preventDefault();location.hash=m}return}
  if(k==='g'){gWait=Date.now();return}
});
window.addEventListener('hashchange',()=>{if(DR){DR=null;$('#drawerHost').innerHTML=''}A.confirm='';render(true);window.scrollTo(0,0)});
// powrót do aplikacji albo karty (telefon, Dock): dane od razu, bez czekania na licznik
let wakeAt=0;
const wake=()=>{if(!LIVE||document.visibilityState!=='visible'||Date.now()-wakeAt<3000)return;wakeAt=Date.now();clearTimeout(timer);load()};
document.addEventListener('visibilitychange',wake);
window.addEventListener('focus',wake);
window.addEventListener('pageshow',ev=>{if(ev.persisted)wake()});
window.addEventListener('online',wake);
if(LIVE)load();else{D=normalize(PREVIEW);render(true)}
})();
