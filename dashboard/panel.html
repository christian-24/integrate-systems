const tmLateN=()=>{try{return deadlines().filter(x=>x.kind!=='kalendarz'&&x.d<D.todayKey).length}catch(e){console.error(e);return 0}};

/* ---------- Blokady: drzewo zależności z po: (unlocks) ---------- */
/*bkGraph:start*/
/* model blokad bez zależności od reszty panelu (test: testy/test_blokady.py).
   tasks: otwarte zadania [{id,title,state,executor,you,date,prio,cost,kids:[id zadań, które czekają na to],waits:[tytuły],miss:[fragmenty po: bez zadania]}],
   today: 'RRRR-MM-DD'. Twoje: you (kto: ty albo czeka na Twoją zgodę lub odbiór) albo executor 'ty'.
   cost: dni pracy na zadanie (ułamek dnia z czas:, 0 = nie zajmuje dnia, np. publikacja); est: koszt przyjęty bez czas:
   (1 dzień, szacunek — pokazywany przy „ciasno”).
   Korzenie: nie czekają na nic, nie są zablokowane [!] i odblokowują co najmniej jedno zadanie.
   count: wszystkie zależne (także pośrednio, każde raz), direct: bezpośrednie (jak „wstrzymuje” w raporcie PM),
   next/late: najbliższy termin i liczba zależnych po terminie, chain: najdłuższy łańcuch zależnych (cykle zwinięte
   w jeden węzeł, czas liniowy, bez rekurencji).
   slack(korzeń): zapas każdej ścieżki osobno — dla zadania z terminem (korzeń albo zależny): dni do terminu (z dzisiejszym)
   minus dni pracy na najdłuższej drodze od korzenia do niego (z korzeniem i z nim włącznie); worst: najmniejszy zapas
   wśród terminów od dziś (unk: ile zadań na tej drodze nie ma czas:, n: ile ich jest); urg: najmniejszy zapas w ogóle
   (także po terminie), null bez terminów. tight: worst < 0 („ciasno”; inna miara niż „bez zapasu” etapu w raporcie PM).
   crit(korzeń): najpilniejsza ścieżka — na każdym poziomie
   dziecko, za którym jest zadanie o najmniejszym zapasie (także po terminie); remis: dłuższy łańcuch, wcześniejszy termin.
   early: poprzednicy z terminem późniejszym niż to zadanie (zła kolejność, jak `order` w raporcie PM).
   fix: zależności do poprawy (cykl, po: bez zadania, czeka na zadanie z takim problemem: via missing/cycle);
   zablokowane [!] są tylko w blocked. Kolejność (to, co widać w wierszu):
   1. po terminie (własny termin albo termin zależnego minął), najstarszy termin najpierw;
   2. dokładny zapas (ten sam, który pokazuje wiersz; własna data zadania też jest terminem); bez terminów na końcu;
   3. przy równym zapasie najbliższy termin; 4. liczba odblokowanych BEZPOŚREDNIO (direct = unlockCount w pm.py
   i w Dziś; „razem” jest tylko informacją); 5. priorytet projektu (rozstrzyga remis); 6. Twoje przed agentami; 7. tytuł.
   Zapas korzenia liczony po ścieżkach od korzenia = zapas całkowity metody ścieżki krytycznej (korzeń startuje dziś),
   także przy wspólnym następniku: inny poprzednik następnika nie zmniejsza zapasu korzenia (zmniejsza zapas swojej ścieżki). */
function bkGraph(tasks,today){
  const ix={};tasks.forEach(t=>{ix[t.id]=t});
  const km={};
  const kids=t=>{if(km[t.id])return km[t.id];const L=[],s={};(t.kids||[]).forEach(id=>{const x=ix[id];if(x&&x!==t&&!s[x.id]){s[x.id]=1;L.push(x)}});return km[t.id]=L};
  const pred={};tasks.forEach(t=>{kids(t).forEach(x=>{(pred[x.id]||(pred[x.id]=[])).push(t)})});
  const reachL=(L,next)=>{next=next||kids;const seen={},st=L.slice(),out=[];L.forEach(t=>{seen[t.id]=1});
    while(st.length){next(st.pop()).forEach(x=>{if(!seen[x.id]){seen[x.id]=1;out.push(x);st.push(x)}})}
    return out};
  /* silnie spójne składowe (Tarjan, iteracyjnie: długi łańcuch nie przepełni stosu): cykl = zadania w jednej składowej;
     składowe powstają od końca łańcucha (składowa osiągalna z innej ma mniejszy numer) */
  const scc={},comps=[],ind={},low={},onS={},S=[];let n=0;
  tasks.forEach(t0=>{if(ind[t0.id]!=null)return;
    const st=[[t0,0]];ind[t0.id]=low[t0.id]=n++;S.push(t0);onS[t0.id]=1;
    while(st.length){const fr=st[st.length-1],v=fr[0],K=kids(v);
      if(fr[1]<K.length){const w=K[fr[1]++];
        if(ind[w.id]==null){ind[w.id]=low[w.id]=n++;S.push(w);onS[w.id]=1;st.push([w,0])}
        else if(onS[w.id])low[v.id]=Math.min(low[v.id],ind[w.id]);
      }else{st.pop();
        if(st.length){const u=st[st.length-1][0];low[u.id]=Math.min(low[u.id],low[v.id])}
        if(low[v.id]===ind[v.id]){const c=[];let w;do{w=S.pop();onS[w.id]=0;scc[w.id]=comps.length;c.push(w)}while(w!==v);comps.push(c)}}}
  });
  const cch=comps.map(()=>0);
  comps.forEach((c,i)=>{let m=0;c.forEach(t=>kids(t).forEach(x=>{const j=scc[x.id];if(j!==i)m=Math.max(m,1+cch[j])}));cch[i]=c.length-1+m});
  const chain=t=>cch[scc[t.id]];
  const cyc=t=>kids(t).filter(x=>scc[x.id]===scc[t.id]);
  const memo={};
  /* ready: zależne, które ruszą od razu po tym zadaniu (to jedyne, na co czekają; bez [!] i bez brakującego po:);
     other: na co zależne czekają poza tym zadaniem (tytuły, bez powtórzeń) */
  const info=t=>{if(memo[t.id])return memo[t.id];
    const R=reachL([t]),k=kids(t);let next='',late=0;
    R.forEach(x=>{if(x.date){if(!next||x.date<next)next=x.date;if(x.date<today)late++}});
    const other=[];let ready=0;
    k.forEach(x=>{const ow=(x.waits||[]).filter(w=>w!==t.title);
      if(x.state!=='blocked'&&!ow.length&&(pred[x.id]||[]).length<=1)ready++;
      ow.forEach(w=>{if(other.indexOf(w)<0)other.push(w)});if(x.state==='blocked'&&other.indexOf('[!]')<0)other.push('[!]')});
    return memo[t.id]={count:R.length,direct:k.length,ready:ready,other:other,next:next,late:late,cycle:cyc(t)}};
  const days=d=>Math.round((new Date(d+'T00:00:00')-new Date(today+'T00:00:00'))/864e5);
  const cost=t=>typeof t.cost==='number'&&t.cost>=0?t.cost:1;
  /* najmniej 0,01 dnia na składową: zadanie bez pracy (publikacja) z terminem dziś też trzeba „zacząć” dziś;
     zadania w cyklu robi się po kolei: suma kosztów */
  const ccost=comps.map(c=>Math.max(0.01,c.reduce((a,t)=>a+cost(t),0)));
  const cest=comps.map(c=>c.some(t=>t.est)?1:0);
  /* najbliższy termin w składowej i dalej (programowanie dynamiczne po składowych: kolejność bez liczenia zasięgu
     każdego węzła osobno) */
  const cmin=comps.map(()=>'');
  comps.forEach((c,i)=>{let b='';c.forEach(t=>{if(t.date&&(!b||t.date<b))b=t.date;kids(t).forEach(x=>{const j=scc[x.id];if(j!==i&&cmin[j]&&(!b||cmin[j]<b))b=cmin[j]})});cmin[i]=b});
  const nextOf=t=>{let b='';kids(t).forEach(x=>{const v=cmin[scc[x.id]];if(v&&(!b||v<b))b=v});return b};
  const r2=v=>Math.round(v*100)/100;
  const slm={};
  const slack=r=>{if(slm[r.id])return slm[r.id];
    const rc=scc[r.id],dist={},sl={},bc={},unk={},nn={};let worst=null,urg=null;dist[rc]=ccost[rc];unk[rc]=cest[rc];nn[rc]=1;
    for(let i=rc;i>=0;i--){if(dist[i]==null)continue;
      comps[i].forEach(t=>kids(t).forEach(x=>{const j=scc[x.id];if(j!==i){const v=dist[i]+ccost[j];if(dist[j]==null||v>dist[j]){dist[j]=v;unk[j]=unk[i]+cest[j];nn[j]=nn[i]+1}}}))}
    for(let i=rc;i>=0;i--){if(dist[i]==null)continue;
      comps[i].forEach(x=>{if(!x.date)return;const d=days(x.date)+1,v=r2(d-dist[i]);sl[x.id]=v;if(urg==null||v<urg)urg=v;
        if(x.date>=today&&(!worst||v<worst.slack||(v===worst.slack&&x.date<worst.date)))worst={slack:v,steps:r2(dist[i]),days:d,id:x.id,title:x.title,date:x.date,unk:unk[i],n:nn[i]}})}
    for(let i=0;i<=rc;i++){if(dist[i]==null)continue;let b=Infinity;
      comps[i].forEach(x=>{if(sl[x.id]!=null)b=Math.min(b,sl[x.id]);kids(x).forEach(y=>{const j=scc[y.id];if(j!==i&&bc[j]!=null)b=Math.min(b,bc[j])})});bc[i]=b}
    return slm[r.id]={worst:worst,urg:urg,slackOf:id=>sl[id],best:id=>bc[scc[id]]}};
  const tight=t=>{const w=slack(t).worst;return w&&w.slack<0?{steps:w.steps,days:w.days,id:w.id,title:w.title,date:w.date,unk:w.unk,n:w.n}:null};

function bkMapSec(m,roots){
  if(!roots.length)return '';
  const col={},order=[],seen={};
  const walk=(n,d,path)=>{if(path[n.id]||d>8)return;if(!(n.id in col)||col[n.id]<d)col[n.id]=d;if(!seen[n.id]){seen[n.id]=1;order.push(n)}
    const p2=Object.assign({},path);p2[n.id]=1;m.kids(n).forEach(k=>walk(k,d+1,p2))};
  roots.forEach(r=>walk(r,0,{}));
  const L=order.slice(0,90),cols=[];L.forEach(n=>{(cols[col[n.id]]=cols[col[n.id]]||[]).push(n)});
  const W=210,H=62,GX=56,GY=12,pos={},par={};
  L.forEach(n=>m.kids(n).forEach(k=>{(par[k.id]=par[k.id]||[]).push(n.id)}));
  /* kolejność w kolumnie: zadanie obok tych, które je odblokowują (mniej krzyżujących się linii) */
  cols.forEach((c,ci)=>{if(!c)return;if(ci>0){const at=n=>{const ps=(par[n.id]||[]).filter(id=>pos[id]);return ps.length?ps.reduce((a,id)=>a+pos[id].y,0)/ps.length:1e9};
      c.sort((x,y)=>at(x)-at(y))}
    c.forEach((n,ri)=>{pos[n.id]={x:ci*(W+GX),y:ri*(H+GY)}})});
  const maxRows=Math.max(...cols.map(c=>c?c.length:0)),CW=cols.length*(W+GX)-GX,CH=maxRows*(H+GY)-GY;

    const x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2,cx=(x1+x2)/2;
    lines+='<path d="M'+x1+' '+y1+' C'+cx+' '+y1+' '+cx+' '+y2+' '+(x2-6)+' '+y2+'" marker-end="url(#bkm-ar)"/>'}));
  const who=n=>n.t.executor==='ty'||!n.t.executor?'Ty':(WHO[n.t.executor]||WHO['']).n;
  const box=n=>{const p=pos[n.id],t=n.t,mine=t.executor==='ty'||!t.executor,bl=t.state==='blocked',dn=m.kids(n).length;
    return '<button class="bkm-n'+(mine?' me':' ag')+(bl?' bl':'')+(col[n.id]===0?' root':'')+'" data-task="'+esc(t.id)+'" style="left:'+p.x+'px;top:'+p.y+'px;width:'+W+'px;height:'+H+'px" title="'+esc(t.title)+'">'+
      '<b>'+esc(shortT(t.title,58))+'</b><span>'+esc(who(n))+(isDay(t.date)?' · '+esc(dd(t.date)):'')+(bl?' · zablokowane':'')+(dn?' · → '+dn:'')+'</span></button>'};
  const more=order.length>L.length?'<p class="note">Pokazano '+L.length+' z '+order.length+' zadań. Wybierz projekt, żeby zobaczyć resztę.</p>':'';
  return '<p class="bk-mapd">Od lewej: zrób najpierw → co to odblokowuje.</p><div class="bkm-leg"><span class="bkm-k me"></span>Twoje <span class="bkm-k ag"></span>agent <span class="bkm-k bl"></span>zablokowane</div>'+
    '<div class="bkm-scroll"><div class="bkm-c" style="width:'+CW+'px;height:'+CH+'px">'+
    '<svg class="bkm-l" width="'+CW+'" height="'+CH+'" aria-hidden="true"><defs><marker id="bkm-ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z"/></marker></defs>'+lines+'</svg>'+
    L.map(box).join('')+'</div></div>'+more;

function bkHomes(m,root,drawn){

  while(q.length){const [n,d]=q.shift();if(d+1>=max)continue;
    m.kids(n).forEach(x=>{if(home[x.id])return;
      const g=drawn&&drawn[x.id];
      if(g&&g.root!==root.id){home[x.id]={parent:n,depth:d+1,other:g};return}
      home[x.id]={parent:n,depth:d+1};q.push([x,d+1])})}
  if(drawn)Object.keys(home).forEach(id=>{if(!home[id].other&&!drawn[id])drawn[id]={root:root.id,parent:home[id].parent,homes:home}});
  return home;
}

function bkFixGroups(m,fix){
  const G={},order=[];
  const add=(key,head,x,w)=>{if(!G[key]){G[key]={head:head,L:[],w:w};order.push(key)}if(G[key].L.indexOf(x)<0)G[key].L.push(x)};

    if(w.kind==='missing')add('m\n'+w.text.toLowerCase(),'Brakuje zadania „'+w.text+'” (warunek nie pasuje do żadnego zadania projektu)',x,w);
    else if(w.kind==='cycle')add('c\n'+w.comp,'Zależność w kółko: '+m.comp(w.comp).map(y=>'„'+y.title+'”').join(', '),x,w);

/* przejście do sekcji albo do zadania w drzewie: najpierw rozwija zwiniętą sekcję (sec albo sama sekcja) i gałęzie na drodze
   do zadania (data-bkpath), potem przewija i podświetla na chwilę. Fokus: sekcja (nazwa z h2) albo tytuł zadania */
function bkJump(id,path,sec){
  const o=A.bkOpen||(A.bkOpen={}),S=A.bkSec||(A.bkSec={});let ch=false;
  if(path&&path.length)path.forEach(k=>{if(o[k]!==true){o[k]=true;ch=true}});
  const sid=/^bk-/.test(id)&&BK_SECS.indexOf(id.slice(3))>=0?id.slice(3):'',s=sid||sec||'';
  if(s&&!bkSecOpen(s)){S[s]=true;ch=true}
  if(ch)render(true);
  let n=document.getElementById(id);
  /* cel w innej, zwiniętej sekcji (np. „jest też pod” w Zablokowanych): rozwiń zwinięte sekcje i szukaj jeszcze raz */
  if(!n){const z=BK_SECS.filter(x=>!bkSecOpen(x));if(z.length){z.forEach(x=>{S[x]=true});render(true);n=document.getElementById(id)}}
  if(!n){say('Nie znaleziono tego zadania na stronie. Użyj „Rozwiń wszystko”.');return}
  n.scrollIntoView({block:sid?'start':'center',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
  const b=sid?n:(n.querySelector('.bk-t')||n);if(b.focus)b.focus({preventScroll:true});
  n.classList.add('bk-hit');setTimeout(()=>n.classList.remove('bk-hit'),1600);
}

function burnChart(p){

    '<p class="wk-verd">'+(left<0?'<b class="wk-bad">Termin minął: zostało '+rest+'</b>':ok?'<b class="wk-ok">Zdąży: zostało '+rest+' do '+dd(s.date)+'</b>':'<b class="wk-bad">Nie zdąży: zostało '+rest+' do '+dd(s.date)+'</b>')+'</p>'+

/* /api/data resources: liczby i listy sprawdzone, reszta odrzucona */
function normRes(r){
  if(!r||typeof r!=='object')return null;
  const n=v=>Number.isFinite(+v)&&v!==null&&v!==''?+v:null,o=(x,k)=>x&&typeof x==='object'?Object.fromEntries(k.map(y=>[y,n(x[y])||0])):null;
  const m=o(r.memory,['total','available','swapTotal','swapFree']),d=o(r.disk,['total','used','free']);
  return {memory:m&&m.total?m:null,disk:d&&d.total?d:null,cpus:n(r.cpus)||1,uptime:n(r.uptime),at:n(r.at)||Date.now()/1e3,sizesAt:n(r.sizesAt),
    load:Array.isArray(r.load)?r.load.slice(0,3).map(x=>+x||0):null,
    folders:Array.isArray(r.folders)?r.folders.filter(f=>f&&typeof f.label==='string').map(f=>({label:f.label,path:String(f.path||''),size:n(f.size)||0,files:n(f.files)||0})):null,
    projects:Array.isArray(r.projects)?r.projects.filter(p=>p&&typeof p.id==='string').map(p=>({id:p.id,name:String(p.name||p.id),size:n(p.size)||0,git:n(p.git)||0,files:n(p.files)||0})):null};
}
/* zasoby serwera: pamięć, swap, dysk (pasek z procentem), obciążenie, foldery i projekty po rozmiarze */
const gb=n=>{n=+n||0;return n>=1073741824?(n/1073741824).toFixed(1).replace('.',',')+' GB':n>=1048576?Math.round(n/1048576)+' MB':Math.max(0,Math.round(n/1024))+' kB'};
function resBar(label,used,total,hint){
  const pct=total?Math.min(100,Math.round(used/total*100)):0,col=pct>=90?'--l-red':pct>=75?'--bar-warn':'--bar-done';
  return '<div class="rs-row" title="'+esc(hint||'')+'"><span class="rs-l">'+label+'</span><span class="track" role="img" aria-label="'+label+': '+pct+'% zajęte"><i style="width:'+pct+'%;background:var('+col+')"></i></span>'+
    '<span class="num rs-v"><b>'+gb(used)+'</b> z '+gb(total)+' · '+pct+'%</span></div>';
}
function resPanel(){
  const r=D.resources;
  if(!r)return '<section class="panel" id="zasoby"><h2>Zasoby</h2><p class="empty" role="status">Zasoby widać w panelu na serwerze w chmurze.</p></section>';
  const m=r.memory,d=r.disk,up=r.uptime;
  let h='<section class="panel" id="zasoby"><h2>Zasoby <small>stan z '+esc(whenT(new Date(r.at*1000).toISOString()))+'</small></h2><div class="pad rs">';
  if(m)h+=resBar('Pamięć RAM',m.total-m.available,m.total,'Zajęta pamięć (bez pamięci podręcznej, którą system zwalnia sam). Wolne: '+gb(m.available));
  if(m&&m.swapTotal)h+=resBar('Swap',m.swapTotal-m.swapFree,m.swapTotal,'Pamięć wymiany na dysku: używana, gdy brakuje RAM');
  if(d)h+=resBar('Dysk',d.used,d.total,'Wolne: '+gb(d.free));
  const ex=[];
  if(r.load)ex.push('obciążenie '+r.load.map(x=>x.toFixed(2).replace('.',',')).join(' · ')+' <span class="muted">(1, 5, 15 min; '+r.cpus+' rdzenie)</span>');
  if(up!=null)ex.push('działa od '+(up>=86400?Math.floor(up/86400)+' d ':'')+Math.floor(up%86400/3600)+' h');
  if(ex.length)h+='<p class="rs-ex">'+ex.join(' · ')+'</p>';
  h+='</div>';
  if(!r.folders)return h+'<p class="note ds-pad" role="status">Liczę rozmiary folderów…</p></section>';
  const row=(n,sz,x)=>'<tr><td>'+n+'</td><td class="num">'+gb(sz)+'</td><td class="num muted">'+x+'</td></tr>';
  h+='<div class="tw"><table><thead><tr><th>Folder</th><th class="num">Rozmiar</th><th class="num">Pliki</th></tr></thead><tbody>'+
    r.folders.map(f=>row(esc(f.label)+' <span class="muted"><code>'+esc(f.path)+'</code></span>',f.size,fmtN(f.files))).join('')+'</tbody></table></div>';
  if(r.projects&&r.projects.length)h+='<div class="tw"><table><thead><tr><th>Projekt</th><th class="num">Pliki projektu</th><th class="num">Historia git</th></tr></thead><tbody>'+
    r.projects.map(p=>row('<a href="'+phref(p)+'">'+esc(p.name)+'</a>',p.size,p.git?gb(p.git):'—')).join('')+'</tbody></table></div>';
  return h+'<p class="note ds-pad">Rozmiary folderów liczone co 10 minut'+(r.sizesAt?', ostatnio '+esc(whenT(new Date(r.sizesAt*1000).toISOString())):'')+'. Pliki projektu obejmują rozmowy, filmy i zdjęcia z karty.</p></section>';
}

function logoutAll(){

  if(!LIVE){say(PRV);render(true);return}
  if(A.busy.lo)return;A.busy.lo=true;render(true);

/* kotwica pozycji listy Braki (cel linków z komórek tabeli i kart): prx-b-<projekt>-<klucz> */
const prxB=(pid,k)=>'prx-b-'+String(pid).replace(/[^\w-]/g,'_')+'-'+String(k).replace(/[^\w-]/g,'_');
const PRX_CRIT={karta:1,zadania:1};
const prxOpen=(k,def)=>A.prxDet&&k in A.prxDet?A.prxDet[k]:def;
/* komórka macierzy: kropka stanu + zwykły tekst; z brakami link do pozycji listy Braki */
function docCell(d,pid){
  if(!d)return '<span class="muted">–</span>';
  const tip=esc((d.gaps||[]).join('; ')),n=(d.gaps||[]).length;
  if(d.status==='ok')return '<span class="prx-c prx-ok"><i class="dot ok" aria-hidden="true"></i>jest</span>';
  const t=d.status==='missing'?'<i class="dot '+(PRX_CRIT[d.key]?'bad':'off')+'" aria-hidden="true"></i>brak pliku'
    :'<i class="dot warn" aria-hidden="true"></i>'+n+' '+pl(n,'brak','braki','braków');
  if(pid==null)return '<span class="prx-c" title="'+tip+'">'+t+'</span>';
  const b=prxB(pid,d.key);
  return '<a class="prx-c" href="#'+b+'" data-prxgo="'+b+'" title="'+tip+'">'+t+'</a>';
}
/* skok z komórki do pozycji listy Braki: rozwija nadrzędne <details>, przewija i ustawia fokus */
function prxGo(b){
  const n=document.getElementById(b);if(!n)return;
  for(let e=n.parentElement;e;e=e.parentElement)if(e.tagName==='DETAILS'&&!e.open)e.open=true;
  n.setAttribute('tabindex','-1');n.scrollIntoView({block:'center'});n.focus({preventScroll:true});

const refOf=t=>({id:t.id,project:t.project,file:t.file,title:t.title,line:t.line});
function findTask(ref,loose){
  let t=D.tasks.find(x=>x.id===ref.id&&x.title===ref.title);if(t)return t;
  const c=D.tasks.filter(x=>x.project===ref.project&&x.file===ref.file&&x.title===ref.title);
  if(c.length){const ln=ref.line||1e9;return c.sort((a,b)=>Math.abs(a.line-ln)-Math.abs(b.line-ln))[0]}
  return loose?(D.tasks.find(x=>x.id===ref.id)||null):null;
}
const opt=(pairs,v)=>pairs.map(p=>'<option value="'+esc(p[0])+'"'+(p[0]===v?' selected':'')+'>'+esc(p[1])+'</option>').join('');

function taskHtml(t){

  if(!d.film&&st==='error')return can?'Panel nie ponowi nagrania sam. Kliknij „Nagraj film” albo „Do poprawy”.':'Panel nie ponowi nagrania sam. Kliknij „Do poprawy”.';

  const r=d.rec||{},fi=d.filmInfo&&typeof d.filmInfo==='object'?d.filmInfo:null,F=D.film||{},kind=(fi&&fi.kind)||'pokaz';
  const old=(isDay(day)&&day<D.todayKey)||d.filmManual||(t&&t.kind==='publikacja'&&t.state==='done');
  const q=filmQueued(t&&t.project,day);
  if(r.state==='running'||(q&&q.run))return ['blue','nagrywa się film'];
  if(fi&&fi.error)return ['red','błąd w filmie'];       /* scenariusz z błędem się nie nagra, choć stoi w kolejce */
  if(r.state==='queued'||q)return q&&q.why?filmStuckT():['grey','film w kolejce'];
  if(r.state==='error')return ['red',d.film?'nowa wersja nie nagrała się':'błąd nagrania'];

    if(!b.music)out.push({text:'2–3 podkłady muzyczne na licencji do mediów społecznościowych: bez nich każdy film jest cichy.',short:'bez muzyki',kind:'muzyka'});
    if(!b.logo)out.push({text:'Logo marki (png z przezroczystym tłem): bez niego filmy nie mają znaku marki.',short:'bez logo',kind:'logo'});
    (Array.isArray(b.pending)?b.pending:[]).forEach(x=>out.push({text:'Potwierdź tekst: '+String(x.card).toLowerCase()+' marki, '+x.what+'. Do tego czasu filmy wychodzą z tekstem tymczasowym.',short:'wezwanie tymczasowe',kind:'marka'}));
    (Array.isArray(b.gaps)?b.gaps:[]).forEach(x=>out.push({text:x,short:/kr[oó]j/i.test(x)?'krój zastępczy':''}));
    (Array.isArray(b.warnings)?b.warnings:[]).forEach(x=>out.push({text:x+': filmy się nagrywają, ale to pole nic nie zmienia.',short:''}));
  }
  const T=(s.templates||[]).filter(t=>!t.error&&Array.isArray(t.needs)&&t.needs.length);

/* „Wyróżnij zaznaczone słowo”: zaznaczenie (albo słowo pod kursorem) w gwiazdkach, poprzednie wyróżnienie znika */
function stuHighlight(el){
  const k=el.dataset.stuhl||'',form=el.closest('form'),i=form&&form.querySelector('[data-fval="'+CSS.escape(k)+'"]');
  if(!i)return;
  let v=i.value,a=i.selectionStart==null?0:i.selectionStart,b=i.selectionEnd==null?a:i.selectionEnd;
  const before=v.slice(0,a).split('*').length-1,inside=v.slice(a,b).split('*').length-1;
  v=v.replace(/\*/g,'');a-=before;b-=before+inside;
  const W=/[^\s.,:;!?„”"()]/;   /* zawsze całe słowa: zaznaczenie w środku słowa obejmuje całe słowo */
  while(a>0&&W.test(v[a-1]))a--;while(b<v.length&&W.test(v[b]))b++;
  while(a<b&&v[a]===' ')a++;while(b>a&&v[b-1]===' ')b--;
  if(a===b){say('Zaznacz słowo w polu, które ma być w kolorze marki.');i.focus();return}
  v=v.slice(0,a)+'*'+v.slice(a,b)+'*'+v.slice(b);
  if(v.length>(+i.maxLength||90)){say('Tekst byłby za długi.');return}
  i.value=v;(A.fVal||(A.fVal={}))[k]=v;
  const pv=form.querySelector('[data-stuprev="'+CSS.escape(k)+'"]');if(pv)pv.innerHTML=stuPrev(v,stuAcc(form.dataset.fset||''));
  i.focus();i.setSelectionRange(a,b+2);
}

/* stan posta na osi tygodnia: [kolor, stan, grupa]; ten sam w karcie (mCard) i w liczniku nad osią (mkTodo).
   grupa: late (dzień minął, nieopublikowany), review (do obejrzenia), err (błąd), prep (agent przygotowuje), done (opublikowany), '' (reszta) */
function mkState(t,day,fs){
  const d=PD[t.project+'|'+day];
  if(t.state!=='done'&&isDay(day)&&day<D.todayKey)return ['red','nie opublikowano','late'];
  if(LIVE&&d&&d.ok){
    if(t.state==='done')return ['green','opublikowany','done'];
    const f=fs||filmState(d,t,day);
    if((d.scenario||d.film)&&f[0]!=='green')return [f[0],f[1],f[0]==='red'?'err':''];
    return ['purple','gotowy do przeglądu','review'];
  }
  if(LIVE&&d&&!d.ok&&D.tasks.some(x=>prepDay(x)===day&&x.project===t.project&&x.state!=='done'))return ['blue','agent przygotowuje','prep'];
  return ['grey','czeka na przygotowanie',''];
}

  let h='';try{h=decodeURIComponent((location.hash||'').slice(1))}catch(e){}
  h=h||'przeglad';
  const qi=h.indexOf('?');if(qi>=0){const qs=h.slice(qi+1),v=h.slice(0,qi);h=v;const m=/(?:^|&)p=([^&]*)/.exec(qs);
    if(m&&D){const id=m[1],ok=id==='all'||id===''||!!P(id);if(ok){if(v==='tablica'||v==='terminy')PF.bp=id||'all';else if(v==='blokady')PF.bk=id==='all'?'':id;else if(v==='wskazniki')PF.ms=id||'all'}}}
  if(h.slice(0,2)==='p-'&&D){const rest=h.slice(2);let p=P(rest),tab='tablica';
    if(!p){const m=/^(.*)-(tablica|wskazniki|etapy|ksiega|marketing)$/.exec(rest);if(m){p=P(m[1]);tab=m[2]}}
    if(p)return {v:'projekt',p:p,tab:tab}}
  return {v:VIEWS.indexOf(h)>=0?h:'przeglad'};
}

   parametr znika z adresu (replaceState, bez hashchange), żeby odświeżenie nie otwierało szuflady ponownie */
function deepLink(){
  const h=location.hash||'',m=/[?&](z|u)=([^&]*)/.exec(h);if(!m)return;
  let id='';try{id=decodeURIComponent(m[2])}catch(e){}
  const rest=h.replace(/([?&])(z|u)=[^&]*&?/,'$1').replace(/[?&]$/,'');
  try{history.replaceState(null,'',location.pathname+location.search+rest)}catch(e){}
  const ok=m[1]==='z'?!!D.tasks.find(x=>x.id===id):!!runById(id);
  if(ok)openDrawer(m[1]==='z'?'task':'run',id);
  else say(m[1]==='z'?'Zadania z powiadomienia już nie ma na liście (zmieniło się albo zostało zamknięte).':'Tego uruchomienia już nie ma na liście.');
}

const CONFL='Plik zmienił się w międzyczasie. Odświeżam.';
const ACT={ok:{needsYou:''},hold:{state:'blocked',blocked:'brak zgody',needsYou:''},accept:{state:'done',needsYou:''},done:{state:'done'}};
const cleanT=s=>String(s==null?'':s).replace(/\|/g,'/').replace(/\s+/g,' ').trim();
async function post(path,body){
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===401){location.assign('/wejscie');return {status:401,ok:false,error:'',id:''}}
  let j={};try{j=await r.json()}catch(e){}
  return {status:r.status,ok:r.ok&&j.ok!==false,error:j.error||'',id:j.id||'',data:j};
}
function enqueue(fn){
  pending++;
  queue=queue.then(fn).catch(()=>{offline=true}).then(()=>{pending--;if(!pending)return load(true)});
}
const failMsg=(r,fail)=>r.status===409?(r.error?r.error.replace(/\.$/,'')+'. Odświeżam.':CONFL):(r.error||fail);
function patchTask(id,ch){
  const t=D.tasks.find(x=>x.id===id);if(!t)return;
  ch=Object.assign({},ch);
  if('title' in ch){const v=cleanT(ch.title),o=cleanT(t.title);if(!v||v===o)delete ch.title;else ch.title=v.slice(0,Math.max(160,o.length))}
  ['blocked','channel'].forEach(k=>{if(k in ch)ch[k]=cleanT(ch[k]).slice(0,120)});
  if(ch.state&&ch.state!=='blocked'&&t.blocked&&!('blocked' in ch))ch.blocked='';
  Object.keys(ch).forEach(k=>{if(ch[k]===t[k]||(!ch[k]&&!t[k]))delete ch[k]});
  if(!Object.keys(ch).length){render(true);return}
  const ref=refOf(t),only=Object.keys(ch).length===1&&'state' in ch;
  Object.assign(t,ch);if('needsYou' in ch)t.needs=ch.needsYou?[ch.needsYou]:[];derive(D);
  if(DR&&DR.kind==='task'&&DR.id===id)DR.ref=refOf(t);
  render(true);
  if(!LIVE){say(PRV);return}
  enqueue(async()=>{
    const cur=D.tasks.indexOf(t)>=0?t:findTask(ref);
    if(!cur){say(CONFL);return}
    const r=only?await post('/api/task/state',{id:cur.id,title:ref.title,state:ch.state}):await post('/api/task/update',{id:cur.id,title:ref.title,changes:ch});
    if(!r.ok&&r.status!==401)say(failMsg(r,'Nie udało się zapisać zmiany.'));
  });
}
function applyField(t,f,v){
  if(f==='minutes'){const n=parseInt(v,10);patchTask(t.id,{minutes:isNaN(n)?0:Math.min(1440,Math.max(0,n))});return}
  if(f==='date'&&v&&!isDay(v)){render(true);return}
  const ch={};ch[f]=v;patchTask(t.id,ch);
}

/* Zrobione z wynikiem i liczbą: najpierw wynik:, potem pola (blokada, wymaga przy odbiorze), na końcu stan z count
   (POST /api/task/state {state:"done", count:n}: serwer dopisuje wiersz w Wynikach i wnioskach kampanii) */
function finishTask(t,result,count,extra){
  result=cleanT(result).slice(0,300);
  const ref=refOf(t),pre=Object.assign({},extra||{}),hasN=Number.isInteger(count)&&count>=0,nm=t.counter;
  if(t.blocked)pre.blocked='';
  if(result)t.detail.result=result;
  Object.assign(t,pre,{state:'done'});if('needsYou' in pre)t.needs=pre.needsYou?[pre.needsYou]:[];
  if(hasN&&nm){const c=campOf(t);if(c){c.counters[nm]=(c.counters[nm]||0)+count;if(String(c.counterMetric||c.metric||'').trim().toLowerCase()===nm)c.result=Math.max(+c.result||0,c.counters[nm])}}
  if(DR)DR.form='';derive(D);render(true);
  if(!LIVE){say(PRV);return}
  enqueue(async()=>{
    if(result){const a=await detailPost(ref,'wynik',result);if(!a.ok){if(a.status!==401)say(failMsg(a,'Nie zapisano wyniku.'));return}}
    if(Object.keys(pre).length){const u=await post('/api/task/update',{id:ref.id,title:ref.title,changes:pre});if(!u.ok){if(u.status!==401)say(failMsg(u,'Nie zamknięto zadania.'));return}}
    const body={id:ref.id,title:ref.title,state:'done'};if(hasN)body.count=count;
    const b=await post('/api/task/state',body);
    if(!b.ok){if(b.status!==401)say(failMsg(b,'Nie zamknięto zadania.'));return}
    const ci=b.data&&typeof b.data.campaign==='string'?b.data.campaign:'',cc=ci?D.campaigns.find(x=>x.id===ci):null,cf=cc?'kampanii „'+cc.name+'”':ci;
    say((result?'Zapisano wynik i zamknięto zadanie.':'Zamknięto zadanie.')+(hasN&&nm?' '+cap(nm)+': '+count+(cf?' w '+cf:'')+'.':''));
  });
}
/* „Zamknij” przy „Wygląda na zrobione”: stan zrobione i notatka z czasem kontroli (POST /api/task/close-checked) */
function closeChecked(id){
  const t=D.tasks.find(x=>x.id===id);if(!t||!isChecked(t))return;
  const ref=refOf(t),c=t.check,m=/^(\d{4}-\d\d-\d\d)(?:[T ](\d\d:\d\d))?/.exec(c.at||'');
  t.state='done';t.detail.notes.push('zamknięte na podstawie kontroli serwera'+(m?' z '+m[1]+(m[2]?' '+m[2]:''):''));
  derive(D);render(true);
  if(!LIVE){say(PRV);return}
  enqueue(async()=>{
    const r=await post('/api/task/close-checked',{id:ref.id,title:ref.title});
    if(r.ok){say('Zamknięto: '+shortT(ref.title,60)+' ('+c.key+' ok).');return}
    if(r.status===401)return;
    /* starszy serwer bez tego żądania: sam stan, bez notatki */
    if(r.status===404&&!r.error){const b=await post('/api/task/state',{id:ref.id,title:ref.title,state:'done'});
      say(b.ok?'Zamknięto zadanie. Serwer nie obsługuje jeszcze notatki o kontroli.':failMsg(b,'Nie zamknięto zadania.'));return}
    say(failMsg(r,'Nie zamknięto zadania.'));
  });
}

function applyAgents(raw){
  FX=null;
  D.agents=normAgents(raw.agents);D.activity=normActivity(raw.activity);D.generatedAt=raw.generatedAt||D.generatedAt;D.stale=raw.stale&&typeof raw.stale==='object'?raw.stale:null;

  D.tasks.forEach(t=>{const z=m[t.id+'\n'+t.title];if(z){t.runId=z.runId||'';t.runBlock=z.runBlock||''}});

/* brak połączenia (fetch, status, JSON) to „offline”; błąd przy rysowaniu już nie: licznik odświeżania ustawia się zawsze */
async function load(force){
  clearTimeout(timer);
  const seq=++loadSeq;let arm=true;
  try{
    let raw;
    try{
      const r=await fetch('/api/data',{cache:'no-store'});
      if(r.status===401){arm=false;location.assign('/wejscie');return}
      if(!r.ok){const e=new Error(r.status);e.status=r.status;throw e}
      raw=await r.json();
    }catch(e){
      if(seq!==loadSeq){arm=false;return}
      /* 5xx: serwer działa, ale nie zbudował danych (inny komunikat niż brak sieci) */
      offline=true;srvErr=e&&e.status>=500?e.status:0;idle();
      if(D)render();else $('#view').innerHTML='<div class="banner bad">'+offBanner()+'</div>';
      return;
    }
    if(seq!==loadSeq){arm=false;return}
    if(newVersion(raw.panelVersion)){arm=false;return}
    const sig=restSig(raw),hold=force!==true&&(editing()||pending),was=offline;
    idle();offline=false;srvErr=0;
    if(D&&(hold||(force!==true&&sig===A.sig&&Date.now()-A.fullAt<60000))){applyAgents(raw);if(was)renderTop()}
    else{D=normalize(raw);D.stale=raw.stale&&typeof raw.stale==='object'?raw.stale:null;A.sig=sig;A.fullAt=Date.now();render(force===true)}
    if(ED.cur){edChat();const c=ED.cur,k=c.pid+'|'+c.day,pd=PD[k];
      if(pd&&pd.rec&&(pd.rec.state==='running'||pd.rec.state==='queued'||D.tasks.some(t=>t.project===c.pid&&t.title.indexOf('Popraw post na '+c.day)===0&&t.state!=='done'))){delete PD[k];loadPost(c.pid,c.day)}}
  }catch(e){console.error(e)}
  finally{
    if(arm){let busy=0;try{busy=D?nwBusy():0}catch(e){}
      timer=setTimeout(load,D&&D.cal&&D.cal.connecting?2000:busy===2?3000:D&&(editing()||pending)?15000:busy===1?20000:60000)}
  }
}

function wkChartAt(svg,i,py){const c=CHARTS[svg.dataset.chart];if(!c)return;i=Math.max(0,Math.min(c.n-1,i));svg.dataset.i=i;
  const r=svg.getBoundingClientRect(),k=r.width/c.W,cx=svg.querySelector('.cx'),px=c.type==='x'?c.x(i):c.ml+c.bw*(i+.5);
  if(c.type==='x'&&cx){cx.setAttribute('x1',px);cx.setAttribute('x2',px);cx.setAttribute('opacity','.5')}
  tipShow(c.html(i),{x:r.left+px*k,y:py!=null?py:r.top+r.height/3})}

function wkChartEv(ev){const hit=ev.target.closest&&ev.target.closest('svg[data-chart] .hit');if(!hit)return false;

  const r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)*c.W/r.width;

document.addEventListener('keydown',ev=>{
  const qt=ev.target.closest&&ev.target.closest('form[data-qa] textarea, form#plan textarea, form[data-dform] textarea[data-fv="fix"], form[data-chat] textarea, form[data-edfix] textarea');
  if(qt&&ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();const f=qt.form;if(f.requestSubmit)f.requestSubmit();else f.dispatchEvent(new Event('submit',{cancelable:true,bubbles:true}));return}
  if(!D||ev.metaKey||ev.ctrlKey||ev.altKey)return;
  const a=document.activeElement,tg=a&&a.tagName,k=ev.key,inField=tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT';
  if(DR&&k==='Tab'){const box=$('#drawer');if(box){const f=Array.prototype.filter.call(box.querySelectorAll(FOCUSABLE),x=>!x.disabled&&x.offsetParent!==null);
    if(f.length){const i=f.indexOf(a);if(ev.shiftKey&&(i<=0)){ev.preventDefault();f[f.length-1].focus()}else if(!ev.shiftKey&&(i<0||i===f.length-1)){ev.preventDefault();f[0].focus()}}}return}
  if(inField){
    if(k==='Escape'){ev.preventDefault();
      if(a.id==='q'&&a.value){a.value='';q='';renderSide(route());return}
      a.blur();if(a.closest('#drawerHost'))render(true);return}
    if(k==='Enter'&&a.id==='q'){const n=$('#plist a');if(n){ev.preventDefault();location.hash=n.getAttribute('href');a.blur()}return}
    if(k==='Enter'&&!ev.shiftKey&&tg==='TEXTAREA'&&a.closest('#drawerHost')){ev.preventDefault();a.blur()}
    return;
  }
  if(k==='Escape'&&ED.cur){ev.preventDefault();closeEditor();return}
  if(k==='Escape'){if(DR){ev.preventDefault();closeDrawer();return}
    if(A.bnMore){ev.preventDefault();A.bnMore=false;renderSide(route());focusK('bnmore');return}
    /* potwierdzenie w treści strony (wylogowanie, usunięcie projektu): Esc = Anuluj, fokus wraca na przycisk, który je otworzył */
    if(A.lo||A.confirm){ev.preventDefault();const f=A.lo?'lo':'pr:'+A.confirm;A.lo=false;A.confirm='';render(true);focusK(f)}
    return}
  /* wiersz tabeli i karta z data-go (Przegląd, Wskaźniki): Enter otwiera */
  if(k==='Enter'&&a&&a.matches&&a.matches('[data-go]')){ev.preventDefault();location.hash=a.dataset.go;return}
  if(DR){if(k==='r'&&DR.kind==='task'){ev.preventDefault();runTask(DR.id)}return}
  /* Blokady: strzałki w drzewie — góra/dół: poprzednie/następne widoczne zadanie, prawo: rozwiń, lewo: zwiń albo do rodzica */
  if(/^Arrow(Up|Down|Left|Right)$/.test(k)&&a&&a.closest&&a.closest('.bk-tree')&&a.closest('.bk-node')&&(a.classList.contains('bk-t')||a.classList.contains('bk-tog'))){
    const li=a.closest('.bk-node'),tg=li.querySelector(':scope>.bk-row>.bk-tog'),ex=!!tg&&tg.getAttribute('aria-expanded')==='true';
    if(k==='ArrowRight'){if(tg&&!ex){ev.preventDefault();tg.click()}return}
    if(k==='ArrowLeft'){ev.preventDefault();if(ex){tg.click();return}const par=li.parentElement.closest('.bk-node'),pt=par&&par.querySelector(':scope>.bk-row .bk-t');if(pt)pt.focus();return}
    const L=Array.prototype.filter.call(document.querySelectorAll('.bk-tree .bk-t'),x=>x.offsetParent!==null),me=li.querySelector(':scope>.bk-row .bk-t');
    const n=L[L.indexOf(me)+(k==='ArrowDown'?1:-1)];if(n){ev.preventDefault();n.focus()}return}
  /* Tablica: strzałki między kartami — góra/dół w kolumnie, lewo/prawo do sąsiedniej widocznej kolumny, Home/End: pierwsza/ostatnia w kolumnie */
  if(/^(Arrow(Up|Down|Left|Right)|Home|End)$/.test(k)&&a&&a.classList&&a.classList.contains('card')&&a.closest('.board')){
    const vis=x=>x.offsetParent!==null,col=a.closest('.col'),cards=c=>Array.prototype.filter.call(c.querySelectorAll('.card'),vis);
    const mine=cards(col),i=mine.indexOf(a);let n=null;
    if(k==='ArrowUp')n=mine[i-1];else if(k==='ArrowDown')n=mine[i+1];else if(k==='Home')n=mine[0];else if(k==='End')n=mine[mine.length-1];
    else{const cols=Array.prototype.filter.call(a.closest('.board').querySelectorAll('.col'),vis),j=cols.indexOf(col),st=k==='ArrowLeft'?-1:1;
      for(let c=j+st;c>=0&&c<cols.length;c+=st){const L=cards(cols[c]);if(L.length){n=L[Math.min(Math.max(i,0),L.length-1)];break}}}
    ev.preventDefault();if(n)n.focus();return}
  if(k==='/'){ev.preventDefault();const s=$('#q');if(s.offsetParent!==null)s.focus();else $('#mnav').focus();return}
  if(gWait&&Date.now()-gWait<1500){gWait=0;const m={p:'przeglad',w:'wskazniki',t:'tablica',d:'terminy',a:'agenci',b:'blokady'}[k];if(m){ev.preventDefault();location.hash=m}return}
  if(k==='g'){gWait=Date.now();return}
});
document.addEventListener('toggle',ev=>{const el=ev.target;if(el.dataset&&el.dataset.prxdet){(A.prxDet||(A.prxDet={}))[el.dataset.prxdet]=el.open;return}if(el.dataset&&el.dataset.agdet){(A.agDet||(A.agDet={}))[el.dataset.agdet]=el.open;return}if(el.dataset&&el.dataset.tmdet){(A.tmDet||(A.tmDet={}))[el.dataset.tmdet]=el.open;return}if(el.classList&&el.classList.contains('bk-how')){A.bkHow=el.open;return}if(el.id==='stubox'){A.stuOpen=el.open;return}if(el.id==='stuall'){A.stuAll=el.open;return}if(el.id==='mkpast'){A.mkPast=el.open;return}
  /* Przegląd: „Proponuję” w notatce PM, wstrzymane i backlog na telefonie; stan w PF.more (pamiętany na urządzeniu) */
  if(el.dataset&&el.dataset.pvdet){if(!!PF.more[el.dataset.pvdet]!==el.open){PF.more[el.dataset.pvdet]=el.open;savePF()}return}if(el.dataset&&el.dataset.stuproj!=null){(A.stuProj||(A.stuProj={}))[el.dataset.stuproj]=el.open;return}if(el.dataset&&el.dataset.stutpl!=null){(A.stuTpl||(A.stuTpl={}))[el.dataset.stutpl]=el.open;return}if(el.dataset&&el.dataset.stud!=null){A.stuDet=el.open;return}if(!DR)return;if(el.id==='dmore')DR.more=el.open;else if(el.id==='dchat')DR.chat=el.open},true);
/* obrót telefonu albo zmiana szerokości okna: głębokość drzewa Blokad, zwinięcie Teraz i limity od razu, nie przy następnym odczycie */
try{const mq=matchMedia('(max-width:620px)'),fn=()=>render(true);if(mq.addEventListener)mq.addEventListener('change',fn);else if(mq.addListener)mq.addListener(fn)}catch(e){}
window.addEventListener('hashchange',()=>{if(DR){DR=null;$('#drawerHost').innerHTML=''}A.confirm='';A.lo=false;A.mconf='';A.bnMore=false;
  const a=document.activeElement,lost=!a||a===document.body||!document.contains(a)||!!(a.closest&&a.closest('#view,#bnsheet'));
  render(true);window.scrollTo(0,0);
  /* Marketing: przy wejściu jedno przewinięcie do dzisiejszego dnia, gdy jest poniżej pierwszego ekranu (nie przy celu z mkDay) */
  if(route().v==='marketing'&&!A.mweek&&!A.mkGo){const n=$('#view .tl-day.tl-now');if(n&&n.getBoundingClientRect().top>innerHeight-60)n.scrollIntoView({block:'start'})}
  A.mkGo='';
  /* fokus po zmianie widoku: na h1 nowego widoku (link z menu bocznego i dolnego paska zostaje, bo nie zniknął) */
  if(A.tySec&&route().v==='ty'){const k=A.tySec;A.tySec='';dsGoSec(k);return}
  if(lost){const h=$('#view h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}});
// powrót do aplikacji albo karty (telefon, Dock): dane od razu, bez czekania na licznik
let wakeAt=0;
const wake=()=>{if(!LIVE||document.visibilityState!=='visible'||Date.now()-wakeAt<3000)return;wakeAt=Date.now();clearTimeout(timer);load()};
document.addEventListener('visibilitychange',wake);
window.addEventListener('focus',wake);
window.addEventListener('pageshow',ev=>{if(ev.persisted)wake()});
window.addEventListener('online',wake);
if(LIVE)load();else{D=normalize(PREVIEW);render(true)}
})();
</script>
