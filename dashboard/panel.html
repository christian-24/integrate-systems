  const sec=b=>'<section class="panel tm-grp" id="'+id+'" tabindex="-1" aria-labelledby="'+id+'-h">'+b+'</section>';
  if(g.id==='later'&&!n&&!g.raw)return sec(tmSecHead(g,false,false));
  const open=g.id==='late'||tmSecOpen(g.id,g.L);
  const head=tmSecHead(g,open,g.id!=='late');
  if(!open)return sec(head);
  if(!n)return sec(head+'<div id="'+id+'-b">'+dsEmpty(g.raw?'Brak pozycji dla wybranych filtrów.':g.empty)+'</div>');
  /* „Później”: domyślnie bez wydarzeń z kalendarza */
  const evN=g.id==='later'?g.L.filter(x=>x.kind==='kalendarz').length:0,V0=g.id==='later'&&!PF.tmLaterEv?g.L.filter(x=>x.kind!=='kalendarz'):g.L;
  /* grupy bez podziału na dni (Po terminie, Dziś, Jutro): najpierw Twoje, zadania agentów niżej w „Agenci” (na telefonie zwinięte) */
  const splitA=!g.days&&g.id!=='later',AG=[],V=splitA?V0.filter(x=>!tmAgentRow(x)).concat(V0.filter(tmAgentRow)):V0;
  /* długie grupy: pierwsze 8 wierszy (Po terminie: 5; w grupach z dniami cięcie na granicy dnia) */
  const cutN=g.cutN||TM_CUT,more=!!(A.tmMore&&A.tmMore[g.id]);let C=V;
  if(g.cut&&V.length>cutN){
    if(g.days){C=[];let i=0;while(i<V.length){const d=V[i].d,day=V.filter(x=>x.d===d);if(C.length&&C.length+day.length>cutN)break;C=C.concat(day);i+=day.length}}
    else C=V.slice(0,cutN)}
  const S=more?V:C;
  let b;
  if(g.days){const ds=[];S.forEach(x=>{if(ds.indexOf(x.d)<0)ds.push(x.d)});
    b=ds.map(d=>'<h3 class="tm-dh">'+ddl(d)+' <span class="num">('+V.filter(x=>x.d===d).length+')</span></h3><ul class="rows">'+tmRows(S.filter(x=>x.d===d),o)+'</ul>').join('')}
  else b=S.length?'<ul class="rows">'+tmRows(S,o)+'</ul>':'';
  if(C.length<V.length)b+=dsMoreBtn('data-tmmore="'+g.id+'"','tmm:'+g.id,more,V.length,id+'-b');
  if(AG.length){const ao=tmDet('ag:'+g.id,!narrow);
    b+='<details class="tm-agd" data-tmdet="ag:'+g.id+'"'+(ao?' open':'')+'><summary>Agenci <span class="num">'+AG.length+'</span></summary><ul class="rows">'+tmRows(AG,o)+'</ul></details>'}
  /* zablokowane zadania nie mają terminu w tej sekcji, ale są ryzykiem jak na Przeglądzie: jeden wiersz z odsyłaczem */
  if(evN)b+='<p class="nw-more"><button class="linkbtn" data-tmlaterev="1" data-k="tmlev" aria-expanded="'+!!PF.tmLaterEv+'">'+(PF.tmLaterEv?'Ukryj wydarzenia z kalendarza':'Pokaż też '+evN+' '+pl(evN,'wydarzenie','wydarzenia','wydarzeń')+' z kalendarza')+'</button></p>';
  return sec(head+'<div id="'+id+'-b">'+b+'</div>');
}

/* ---------- Blokady: drzewo zależności z po: (unlocks) ---------- */
/*bkGraph:start*/
/* model blokad bez zależności od reszty panelu (test: testy/test_blokady.py).
   tasks: otwarte zadania [{id,title,state,executor,you,date,prio,cost,kids:[id zadań, które czekają na to],waits:[tytuły],miss:[fragmenty po: bez zadania]}],
   today: 'RRRR-MM-DD'. Twoje: you (kto: ty albo czeka na Twoją zgodę lub odbiór) albo executor 'ty'.
   cost: dni pracy na zadanie (ułamek dnia z czas:, 0 = nie zajmuje dnia, np. publikacja); est: koszt przyjęty bez czas:
   (1 dzień, szacunek — pokazywany przy „ciasno”).
   Korzenie: nie czekają na nic, nie są zablokowane [!] i odblokowują co najmniej jedno zadanie.
   count: wszystkie zależne (także pośrednio, każde raz), direct: bezpośrednie (jak „wstrzymuje” w raporcie PM),
   next/late: najbliższy termin i liczba zależnych po terminie, chain: najdłuższy łańcuch zależnych (cykle zwinięte
   w jeden węzeł, czas liniowy, bez rekurencji).
   slack(korzeń): zapas każdej ścieżki osobno — dla zadania z terminem (korzeń albo zależny): dni do terminu (z dzisiejszym)
   minus dni pracy na najdłuższej drodze od korzenia do niego (z korzeniem i z nim włącznie); worst: najmniejszy zapas
   wśród terminów od dziś (unk: ile zadań na tej drodze nie ma czas:, n: ile ich jest); urg: najmniejszy zapas w ogóle
   (także po terminie), null bez terminów. tight: worst < 0 („ciasno”; inna miara niż „bez zapasu” etapu w raporcie PM).
   crit(korzeń): najpilniejsza ścieżka — na każdym poziomie
   dziecko, za którym jest zadanie o najmniejszym zapasie (także po terminie); remis: dłuższy łańcuch, wcześniejszy termin.
   early: poprzednicy z terminem późniejszym niż to zadanie (zła kolejność, jak `order` w raporcie PM).
   fix: zależności do poprawy (cykl, po: bez zadania, czeka na zadanie z takim problemem: via missing/cycle);
   zablokowane [!] są tylko w blocked. Kolejność (to, co widać w wierszu):
   1. po terminie (własny termin albo termin zależnego minął), najstarszy termin najpierw;
   2. dokładny zapas (ten sam, który pokazuje wiersz; własna data zadania też jest terminem); bez terminów na końcu;
   3. przy równym zapasie najbliższy termin; 4. liczba odblokowanych BEZPOŚREDNIO (direct = unlockCount w pm.py
   i w Dziś; „razem” jest tylko informacją); 5. priorytet projektu (rozstrzyga remis); 6. Twoje przed agentami; 7. tytuł.
   Zapas korzenia liczony po ścieżkach od korzenia = zapas całkowity metody ścieżki krytycznej (korzeń startuje dziś),
   także przy wspólnym następniku: inny poprzednik następnika nie zmniejsza zapasu korzenia (zmniejsza zapas swojej ścieżki). */
function bkGraph(tasks,today){
  const ix={};tasks.forEach(t=>{ix[t.id]=t});
  const km={};
  const kids=t=>{if(km[t.id])return km[t.id];const L=[],s={};(t.kids||[]).forEach(id=>{const x=ix[id];if(x&&x!==t&&!s[x.id]){s[x.id]=1;L.push(x)}});return km[t.id]=L};
  const pred={};tasks.forEach(t=>{kids(t).forEach(x=>{(pred[x.id]||(pred[x.id]=[])).push(t)})});
  const reachL=(L,next)=>{next=next||kids;const seen={},st=L.slice(),out=[];L.forEach(t=>{seen[t.id]=1});
    while(st.length){next(st.pop()).forEach(x=>{if(!seen[x.id]){seen[x.id]=1;out.push(x);st.push(x)}})}
    return out};
  /* silnie spójne składowe (Tarjan, iteracyjnie: długi łańcuch nie przepełni stosu): cykl = zadania w jednej składowej;
     składowe powstają od końca łańcucha (składowa osiągalna z innej ma mniejszy numer) */
  const scc={},comps=[],ind={},low={},onS={},S=[];let n=0;
  tasks.forEach(t0=>{if(ind[t0.id]!=null)return;
    const st=[[t0,0]];ind[t0.id]=low[t0.id]=n++;S.push(t0);onS[t0.id]=1;
    while(st.length){const fr=st[st.length-1],v=fr[0],K=kids(v);
      if(fr[1]<K.length){const w=K[fr[1]++];
        if(ind[w.id]==null){ind[w.id]=low[w.id]=n++;S.push(w);onS[w.id]=1;st.push([w,0])}
        else if(onS[w.id])low[v.id]=Math.min(low[v.id],ind[w.id]);
      }else{st.pop();
        if(st.length){const u=st[st.length-1][0];low[u.id]=Math.min(low[u.id],low[v.id])}
        if(low[v.id]===ind[v.id]){const c=[];let w;do{w=S.pop();onS[w.id]=0;scc[w.id]=comps.length;c.push(w)}while(w!==v);comps.push(c)}}}
  });
  const cch=comps.map(()=>0);
  comps.forEach((c,i)=>{let m=0;c.forEach(t=>kids(t).forEach(x=>{const j=scc[x.id];if(j!==i)m=Math.max(m,1+cch[j])}));cch[i]=c.length-1+m});
  const chain=t=>cch[scc[t.id]];
  const cyc=t=>kids(t).filter(x=>scc[x.id]===scc[t.id]);
  const memo={};
  /* ready: zależne, które ruszą od razu po tym zadaniu (to jedyne, na co czekają; bez [!] i bez brakującego po:);
     other: na co zależne czekają poza tym zadaniem (tytuły, bez powtórzeń) */
  const info=t=>{if(memo[t.id])return memo[t.id];
    const R=reachL([t]),k=kids(t);let next='',late=0;
    R.forEach(x=>{if(x.date){if(!next||x.date<next)next=x.date;if(x.date<today)late++}});
    const other=[];let ready=0;
    k.forEach(x=>{const ow=(x.waits||[]).filter(w=>w!==t.title);
      if(x.state!=='blocked'&&!ow.length&&(pred[x.id]||[]).length<=1)ready++;
      ow.forEach(w=>{if(other.indexOf(w)<0)other.push(w)});if(x.state==='blocked'&&other.indexOf('[!]')<0)other.push('[!]')});
    return memo[t.id]={count:R.length,direct:k.length,ready:ready,other:other,next:next,late:late,cycle:cyc(t)}};
  const days=d=>Math.round((new Date(d+'T00:00:00')-new Date(today+'T00:00:00'))/864e5);
  const cost=t=>typeof t.cost==='number'&&t.cost>=0?t.cost:1;
  /* najmniej 0,01 dnia na składową: zadanie bez pracy (publikacja) z terminem dziś też trzeba „zacząć” dziś;
     zadania w cyklu robi się po kolei: suma kosztów */
  const ccost=comps.map(c=>Math.max(0.01,c.reduce((a,t)=>a+cost(t),0)));
  const cest=comps.map(c=>c.some(t=>t.est)?1:0);
  /* najbliższy termin w składowej i dalej (programowanie dynamiczne po składowych: kolejność bez liczenia zasięgu
     każdego węzła osobno) */
  const cmin=comps.map(()=>'');
  comps.forEach((c,i)=>{let b='';c.forEach(t=>{if(t.date&&(!b||t.date<b))b=t.date;kids(t).forEach(x=>{const j=scc[x.id];if(j!==i&&cmin[j]&&(!b||cmin[j]<b))b=cmin[j]})});cmin[i]=b});
  const nextOf=t=>{let b='';kids(t).forEach(x=>{const v=cmin[scc[x.id]];if(v&&(!b||v<b))b=v});return b};
  const r2=v=>Math.round(v*100)/100;
  const slm={};
  const slack=r=>{if(slm[r.id])return slm[r.id];
    const rc=scc[r.id],dist={},sl={},bc={},unk={},nn={};let worst=null,urg=null;dist[rc]=ccost[rc];unk[rc]=cest[rc];nn[rc]=1;
    for(let i=rc;i>=0;i--){if(dist[i]==null)continue;
      comps[i].forEach(t=>kids(t).forEach(x=>{const j=scc[x.id];if(j!==i){const v=dist[i]+ccost[j];if(dist[j]==null||v>dist[j]){dist[j]=v;unk[j]=unk[i]+cest[j];nn[j]=nn[i]+1}}}))}
    for(let i=rc;i>=0;i--){if(dist[i]==null)continue;
      comps[i].forEach(x=>{if(!x.date)return;const d=days(x.date)+1,v=r2(d-dist[i]);sl[x.id]=v;if(urg==null||v<urg)urg=v;
        if(x.date>=today&&(!worst||v<worst.slack||(v===worst.slack&&x.date<worst.date)))worst={slack:v,steps:r2(dist[i]),days:d,id:x.id,title:x.title,date:x.date,unk:unk[i],n:nn[i]}})}
    for(let i=0;i<=rc;i++){if(dist[i]==null)continue;let b=Infinity;
      comps[i].forEach(x=>{if(sl[x.id]!=null)b=Math.min(b,sl[x.id]);kids(x).forEach(y=>{const j=scc[y.id];if(j!==i&&bc[j]!=null)b=Math.min(b,bc[j])})});bc[i]=b}
    return slm[r.id]={worst:worst,urg:urg,slackOf:id=>sl[id],best:id=>bc[scc[id]]}};
  const tight=t=>{const w=slack(t).worst;return w&&w.slack<0?{steps:w.steps,days:w.days,id:w.id,title:w.title,date:w.date,unk:w.unk,n:w.n}:null};
  const crit=(r,max)=>{const out={},s=slack(r);let x=r,g=0;max=max||5;
    while(x&&g++<max){out[x.id]=1;const k=kids(x).filter(y=>!out[y.id]);if(!k.length)break;
      x=k.slice().sort((a,b)=>(s.best(a.id)-s.best(b.id))||(chain(b)-chain(a))||((a.date||'9999').localeCompare(b.date||'9999')))[0]}
    return out};
  const early=t=>t.date?(pred[t.id]||[]).filter(p=>p.date&&p.date>t.date):[];
  const mine=t=>!!t.you||t.executor==='ty';
  /* data zadania (kiedy:) to termin, jak w STANDARD.md i w raporcie PM („po terminie”): w zapasie i w kolejności tak samo.
     dl: najbliższy termin — własny albo zadań, które czekają (po terminie: najstarszy) */
  const dlm={};
  const dl=t=>{if(dlm[t.id]!=null)return dlm[t.id];const n=nextOf(t),o=t.date||'';return dlm[t.id]=!n?o:!o?n:o<n?o:n};
  /* po terminie: własny termin albo termin któregoś zależnego już minął */
  const late=t=>!!dl(t)&&dl(t)<today;
  /* pilność w dniach: -1 po terminie albo ciasno, 0 trzeba zacząć dziś, 1 jutro…; bez terminów na końcu */
  const urgB=t=>{const u=slack(t).urg;return u==null?1e9:Math.max(-1,Math.floor(u+1e-9))};
  const urgX=t=>{const u=slack(t).urg;return u==null?1e9:u};
  /* grupa na stronie (nagłówek zamiast znacznika w każdym wierszu): late, tight (zapas < 0), today (< 1 dnia), soon, none */
  const grp=t=>late(t)?'late':slack(t).urg==null?'none':urgX(t)<-1e-9?'tight':urgX(t)<1-1e-9?'today':'soon';
  /* kolejność = to, co widać: po terminie najpierw (najstarszy termin), potem dokładny zapas (ten sam, który pokazuje
     wiersz), przy równym zapasie bliższy termin, więcej odblokowanych bezpośrednio, priorytet projektu, Twoje, tytuł */
  const by=(a,b)=>(late(b)-late(a))||(late(a)&&late(b)?(dl(a)).localeCompare(dl(b)):0)||(urgX(a)-urgX(b))||(dl(a)||'9999').localeCompare(dl(b)||'9999')||(kids(b).length-kids(a).length)||
    ((a.prio||3)-(b.prio||3))||(mine(b)-mine(a))||String(a.title).localeCompare(String(b.title));
  const ks={};
  const kidsS=t=>ks[t.id]||(ks[t.id]=kids(t).slice().sort(by));
  const roots=tasks.filter(t=>!t.waits.length&&t.state!=='blocked'&&kids(t).length).sort(by);
  const blocked=tasks.filter(t=>t.state==='blocked').sort(by);
  /* zadania z waits, do których nie prowadzi żaden korzeń ani zablokowane: cykl albo po: bez zadania wyżej w łańcuchu */
  const cov={};roots.concat(blocked).concat(reachL(roots.concat(blocked))).forEach(t=>{cov[t.id]=1});
  const bad=t=>(t.miss||[]).length?'missing':cyc(t).length?'cycle':'';
  const fix=[];
  tasks.forEach(t=>{if(t.state==='blocked')return;const why=[];
    (t.miss||[]).forEach(f=>why.push({kind:'missing',text:f}));
    const c=cyc(t);if(c.length)why.push({kind:'cycle',text:c.map(x=>x.title).join('; '),comp:scc[t.id]});
    if(!why.length&&t.waits.length&&!cov[t.id]){
      const up=reachL([t],x=>pred[x.id]||[]),src=up.find(bad);
      why.push({kind:'orphan',text:t.waits.join('; '),via:src?bad(src):'',src:src?src.title:''})}
    if(why.length)fix.push({t:t,why:why})});
  fix.sort((a,b)=>by(a.t,b.t));
  return {roots:roots,blocked:blocked,fix:fix,info:info,chain:chain,tight:tight,slack:slack,crit:crit,early:early,mine:mine,urg:urgB,urgX:urgX,dl:dl,grp:grp,late:late,
    kids:kidsS,reach:L=>reachL(L).length,reachL:L=>reachL(L),byId:id=>ix[id]||null,comp:i=>comps[i]||[]};
}
/*bkGraph:end*/
const BK_DEPTH=5,BK_OPEN=2;
/*bkModel:start*/
/* model z zadań panelu (liczony raz na stan danych, w facts()). kids z unlocksL (id z serwera; bez id: po tytule
   w tym samym pliku, tylko gdy tytuł jest jeden), miss: brakujące poprzedniki z derive (t.missing, to samo
   dopasowanie po: co na serwerze); Twoje: needsMe (kto: ty, zgoda, odbiór); cost: czas: Twojego zadania
   w dniach pojemności (dayMinutes), zadania agenta w dniach pracy agenta (BK_AG_MIN); publikacja 0 (wysyła ją
   publikator o czasie), zadanie agenta, nad którym agent właśnie pracuje, 0; bez czas: Twoje 1 dzień, agenta pół dnia
   (BK_AG_EST; est: szacunek, pokazywany przy „może być ciasno”) */
const BK_AG_MIN=480,BK_AG_EST=0.5;
function bkModel(){
  const f=facts();if(f.bk)return f.bk;
  const nodes=[],dm=D.dayMinutes||120;
  let busy={};try{busy=typeof bkWork==='function'?bkWork():{}}catch(e){busy={}}

  const capN=hot.length>1&&(hotMin>dm||hotMin+hotUnk*dm>dm)?'<p>Twoje zadania do zaczęcia dziś: '+hot.length+(hotMin?', razem '+dur(hotMin)+(hotUnk?' i '+hotUnk+' bez szacowanego czasu':''):', bez szacowanego czasu')+'; pojemność dnia '+dur(dm)+'. Zapas każdej ścieżki liczony jest osobno, więc razem jest go mniej.</p>':'';
  const warn=bkLoginNote(roots)+capN;
  h+=sec('roots','Do zrobienia najpierw',mine?rs.length+' z '+roots.length:roots.length,'',()=>{
    /* nagłówek grupy: śródtytuł h3, pilność znacznikiem .lz przy liczbie; legenda ścieżki po prawej przy pierwszym */
    /* telefon: pierwsze 5 korzeni, reszta po „Pokaż wszystkie” (PF.more) */
    const cutR=nwNarrow()?dsCut('bk-roots',rs,5,'bks-roots'):{L:rs,more:''};
    const rootsH=cutR.L.map((n,i)=>bkTree(m,n,drawn,{first:i===0})).join('');
    const crit=rootsH.indexOf(' bk-crit"')>=0;
    const lg=crit?'<span class="bk-lg" title="Najpilniejsza ścieżka: droga do zadania z najmniejszym zapasem do terminu"><i class="bk-cdot" aria-hidden="true"></i>najpilniejsza ścieżka<span class="bk-sr">: droga do zadania z najmniejszym zapasem do terminu</span></span>':'';
    return (warn?'<div class="over bk-cap" role="note">'+warn+'</div>':'')+
      (rs.length?(lg?'<p class="bk-lgp">'+lg+'</p>':'')+'<ul class="bk-tree" data-bktree="1">'+rootsH+'</ul>'+cutR.more+(A.bkAll&&anyKids?'<div class="bk-all2">'+bkAllBtn('bkall2')+'</div>':''):
      roots.length?'<p class="empty">Brak Twoich zadań w tej sekcji. <button class="linkbtn" data-bkmine="0" data-k="bkmine:e">Pokaż wszystkie</button></p>':
      '<p class="empty">Żadne zadanie nie wstrzymuje innych. <a class="navlk" href="#ty">Twoje zadania na dziś: Dla Ciebie →</a></p>')});
  {const mp=bkMapSec(m,roots.concat(blocked));if(mp){const mn=(mp.match(/class="bkm-n/g)||[]).length;h+=sec('map','Mapa zależności',mn,'',()=>mp)}}
  /* w sekcji „Zablokowane” bez pigułki „zablokowane” w wierszu (nagłówek już to mówi) */
  if(blocked.length)h+=sec('blocked','Zablokowane',blocked.length,'',()=>{A.bkNoBlk=1;try{return ''+
    '<ul class="bk-tree" data-bktree="1">'+blocked.map(n=>inUrg[n.id]?'<li class="bk-node bk-rep"><div class="bk-row"><span class="bk-tg0" aria-hidden="true"></span><div class="bk-main"><button class="lk bk-t" data-task="'+esc(n.t.id)+'">'+esc(n.t.title)+'</button><div class="bk-meta"><span>jest wyżej w „Nie ruszą na czas”</span><button class="linkbtn bk-jump" data-bkjump="bk-urgent" data-k="bkbu:'+esc(n.id)+'" aria-label="'+esc('Pokaż: '+n.t.title)+'">Pokaż</button></div></div></div></li>':bkTree(m,n,drawn,{flat:1,why:'<div class="bk-why'+(n.t.blocked?'':' none')+'">'+(n.t.blocked?'powód: '+esc(n.t.blocked):'bez podanego powodu')+' <button class="btn sec sm bk-unb" data-task="'+esc(n.t.id)+'" data-k="bkunb:'+esc(n.id)+'" aria-label="'+esc('Usuń przeszkodę: '+n.t.title)+'">Usuń przeszkodę</button></div>'+
      (n.miss&&n.miss.length?'<div class="bk-why">'+esc(n.miss.map(x=>BKWHY.missing({text:x})).join('; '))+'</div>'+n.miss.map(x=>bkFixAct(n.t,x)).join(''):'')+bkWaitL(n.t)})).join('')+'</ul>'}finally{A.bkNoBlk=0}});
  if(fix.length){const fm=mixed(fix.map(x=>x.t));
    /* zadanie pokazane już w „Nie ruszą na czas”: jeden wiersz z „Pokaż” (przyczyna i naprawa są tam) */
    const fixRow=(x,g)=>inUrg[x.t.id]?'<li class="bk-node bk-rep"><div class="bk-row"><span class="bk-tg0" aria-hidden="true"></span><div class="bk-main"><button class="lk bk-t" data-task="'+esc(x.t.t.id)+'">'+esc(x.t.t.title)+'</button><div class="bk-meta"><span>jest wyżej w „Nie ruszą na czas”</span><button class="linkbtn bk-jump" data-bkjump="bk-urgent" data-k="bkfu:'+esc(x.t.id+'|'+g.head)+'" aria-label="'+esc('Pokaż: '+x.t.t.title)+'">Pokaż</button></div></div></div></li>':
      bkFlat(m,x.t,!PF.bk,g.w.kind==='missing'?bkFixAct(x.t.t,g.w.text)+(bkSoon(x.t.t)?'<div class="bk-why">'+bkDueLz(x.t.t)+'</div>':''):(bkSoon(x.t.t)?'<div class="bk-why">'+bkDueLz(x.t.t)+'</div>':''),fm);
    h+=sec('fix','Zależności do poprawy',fix.length,fixSoon?'<span class="lz red">'+fixSoon+' z terminem do jutra</span>':'',()=>
      '<p class="bk-intro">Te zadania nie ruszą, dopóki warunek „po” nie wskaże istniejącego zadania. Usuń warunek, dodaj brakujące zadanie albo otwórz zadanie (tytuł).</p>'+
      bkFixGroups(m,fix).map(g=>'<h3 class="bk-gh">'+esc(g.head)+' <small class="num">'+g.L.length+'</small>'+(g.soon.length?' <span class="lz red">'+bkDue(g.soon[0].t.t)+(g.soon.length>1?' (i '+(g.soon.length-1)+' '+pl(g.soon.length-1,'inne','inne','innych')+')':'')+'</span>':'')+'</h3>'+
        (g.w.kind==='missing'&&g.L.length>1?'<p class="bk-intro">Każde z tych zadań ma ten warunek. Poprawka przy jednym zadaniu nie zmienia pozostałych.</p>':'')+
        '<ul class="bk-tree">'+g.L.map(x=>fixRow(x,g)).join('')+'</ul>').join(''))}
  /* na końcu: Twoje zadania, które wstrzymują inne, ale same czekają (domyślnie zwinięte) */
  if(youWait.length)h+=sec('youw','Twoje zadania czekające na inne',youWait.length,'',()=>
    '<ul class="bk-tree">'+youWait.map(n=>bkFlat(m,n,!PF.bk,n.t.state==='blocked'?'<div class="bk-why">zablokowane'+(n.t.blocked?': '+esc(n.t.blocked):'')+'</div>':bkWaitL(n.t),false)).join('')+'</ul>');
  h+='<div class="bk-howw">'+'<details class="ds-det bk-how"'+(A.bkHow?' open':'')+'><summary>Jak liczona jest kolejność</summary><p>Od góry: najpierw to, co jest po terminie, potem to, co ma najmniej czasu w zapasie do najbliższego terminu. Przy równym zapasie decyduje bliższy termin, potem liczba zadań, które ruszą po nim, a na końcu priorytet projektu.</p></details>'+'</div>';
  return h;
}
/* przejście do sekcji albo do zadania w drzewie: najpierw rozwija zwiniętą sekcję (sec albo sama sekcja) i gałęzie na drodze
   do zadania (data-bkpath), potem przewija i podświetla na chwilę. Fokus: sekcja (nazwa z h2) albo tytuł zadania */
function bkJump(id,path,sec){
  const o=A.bkOpen||(A.bkOpen={}),S=A.bkSec||(A.bkSec={});let ch=false;
  if(path&&path.length)path.forEach(k=>{if(o[k]!==true){o[k]=true;ch=true}});
  const sid=/^bk-/.test(id)&&BK_SECS.indexOf(id.slice(3))>=0?id.slice(3):'',s=sid||sec||'';
  if(s&&!bkSecOpen(s)){S[s]=true;ch=true}
  if(ch)render(true);
  let n=document.getElementById(id);
  /* cel w innej, zwiniętej sekcji (np. „jest też pod” w Zablokowanych): rozwiń zwinięte sekcje i szukaj jeszcze raz */
  if(!n){const z=BK_SECS.filter(x=>!bkSecOpen(x));if(z.length){z.forEach(x=>{S[x]=true});render(true);n=document.getElementById(id)}}
  if(!n){say('Nie znaleziono tego zadania na stronie.');return}
  n.scrollIntoView({block:sid?'start':'center',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
  const b=sid?n:(n.querySelector('.bk-t')||n);if(b.focus)b.focus({preventScroll:true});
  n.classList.add('bk-hit');setTimeout(()=>n.classList.remove('bk-hit'),1600);
}

/* Teraz → Marketing: zakres 7 dni z dniem posta i przewinięcie do tego dnia (post po terminie: sekcja „Po terminie”) */
function mkDay(day){
  if(!isDay(day)){location.hash='marketing';return}
  A.mweek=day<D.todayKey?0:Math.floor(diff(day,D.todayKey)/7);
  if(location.hash==='#marketing')render(true);else{A.mkGo=day;location.hash='marketing'}
  let n=0;const find=()=>{const el=document.querySelector('.tl-day[data-day="'+day+'"]');
    if(el){el.setAttribute('tabindex','-1');el.scrollIntoView({block:'start'});el.focus({preventScroll:true});el.classList.add('mk-hit');setTimeout(()=>el.classList.remove('mk-hit'),1600)}
    else if(n++<15)setTimeout(find,60)};
  setTimeout(find,30);
}

/* ---------- strona projektu ----------
   Nagłówek zwarty na każdej zakładce: nazwa, stan i jedna linia (faza · postęp · bieżący etap). Na zakładce Plan ta linia

   Pod zakładkami jedno zdanie, co jest na zakładce (PTD); Marketing ma własne zdanie w mktView. */
const PTD={plan:'Co czeka w projekcie przez 7 dni: Twoje sprawy, publikacje i praca agentów.',tablica:'Zadania projektu według stanu. Kliknij zadanie, aby zobaczyć szczegóły.',
  wskazniki:'Postęp projektu i tempo pracy.',etapy:'Etapy projektu na osi czasu i ich terminy.',
  ksiega:'Księga to dokumenty, które każdy projekt powinien mieć. Poniżej widać, czego brakuje.'};

  let body='';
  if(tab==='plan')body=planView(p)+driveBox(p);

  else if(tab==='wskazniki')body=metrics([p],p);

  const det=[c.done+' z '+c.all+' zadań'].concat(c.wip+c.blocked?['w toku '+(c.wip+c.blocked)]:[],c.rev?['czeka na odbiór '+c.rev]:[]).join(' · ');
  const ov='<div class="stepper" role="group" aria-label="Faza projektu">'+PHASES.map((x,i)=>'<button data-phase="'+x[0]+'" data-pid="'+esc(p.id)+'" class="'+(i<pi?'done':i===pi?'cur':'')+'"'+(cm?'':' disabled')+' aria-pressed="'+(i===pi)+'" title="'+(cm?'Ustaw fazę: '+x[1]:'Projekty przykładowe: bez zmiany fazy')+'"><b>'+x[1]+'</b><span class="sr-only">, </span>'+(i<pi?'zakończona':i===pi?'teraz':'')+'</button>').join('')+'</div>'+
    (cm?'<p class="note">Kliknij fazę, aby ją zmienić.</p>':'')+

    '<div class="fact"><span class="l">Postęp</span><span class="v num">'+(c.all?pct+'%':'—')+'</span><span class="d num">'+det+'</span></div>'+
    '<div class="fact"><span class="l">Bieżący etap</span><span class="v">'+(s?esc(s.title):'—')+'</span><span class="d">'+(s?(isDay(s.date)?ddl(s.date)+' · '+rel(s.date):'bez terminu'):'brak etapów')+'</span></div>'+

/* ---------- Plan projektu: najbliższe 7 dni i rozmowa o projekcie ----------
   Dzień: Twoje zadania (po terminie trafiają na dziś), filmy do nagrania (dzień przed publikacją, najwcześniej dziś),
   publikacje i zadania agentów. Kliknięcie otwiera zadanie. */
/* rodzaj sprawy szarym tekstem; kolorowy znacznik tylko dla stanu „po terminie” */
const PPK={late:['red','Po terminie'],you:['','Ty'],rec:['','Nagranie'],pub:['','Publikacja'],agent:['','Agent']};
const PPO={late:0,you:1,rec:2,pub:3,agent:4};
/* „Decyzje”: decyzje projektu (zgody, odbiory, pytania) z tym samym wierszem i przyciskiem co w Przeglądzie */
function planDec(p){
  const ys=youState(),of=x=>(x.q?x.q.p.id:x.t.project)===p.id&&(x.q||x.need);
  return ys.youToday.concat(ys.youWeek,ys.youLater).filter(of);
}
function planView(p){
  const T=D.todayKey,end=addK(T,6),day={},isAg=t=>t.executor==='claude'||t.executor==='codex';
  const dec=planDec(p),decT={};dec.forEach(x=>{if(x.t)decT[x.t.id]=1});
  const put=(k,kind,t)=>{(day[k]||(day[k]=[])).push({kind:kind,t:t})};
  D.tasks.filter(t=>t.project===p.id&&t.state!=='done'&&!decT[t.id]).forEach(t=>{
    const d=isDay(t.date)?t.date.slice(0,10):'';
    if(!d)return;
    if(t.kind==='publikacja'){
      if(d<T){put(T,'late',t);return}
      if(d<=end)put(d,'pub',t);
      if(mkIsFilm(t)){const fd=PD[t.project+'|'+d],r=addK(d,-1)<T?T:addK(d,-1);if(!(fd&&fd.ok&&fd.film)&&r<=end)put(r,'rec',t)}
      return}
    if(d>end)return;
    put(d<T?T:d,isAg(t)?'agent':d<T?'late':'you',t);
  });
  const chan=t=>esc(String(t.channel||'').split(/,\s*/).filter(Boolean).map(c=>PUBN[c.toLowerCase()]||cap(c)).join(' · '));
  const meta=x=>{const t=x.t,d=t.date.slice(0,10);
    if(x.kind==='rec')return 'publikacja '+(d===T?'dziś':ddl(d));
    if(x.kind==='pub')return chan(t);
    if(x.kind==='late')return (t.kind==='publikacja'?'publikacja ':'termin ')+ddl(d);
    if(x.kind==='agent')return t.state==='doing'?'w toku':t.state==='blocked'?'zablokowane':WHO[t.executor]?WHO[t.executor].n:'';
    return t.minutes?t.minutes+' min':''};
  const name=x=>x.kind==='rec'||x.kind==='pub'?cap(x.t.title.replace(/^Opublikuj\s+/,'')):x.t.title;
  /* publikacja z kanałem i datą: stan i akcja jak na karcie w Marketingu (mkState, mkAct) */
  const pubSA=x=>{const t=x.t,d=isDay(t.date)?t.date.slice(0,10):'';if(x.kind!=='pub'||!t.channel||!d)return null;
    const k=t.project+'|'+d;if(PD[k]===undefined&&LIVE){PD[k]=null;loadPost(t.project,d)}
    const st=mkState(t,d);return {st:st,act:mkAct(t,d,st,'')}};
  /* publikacja z kanałem i datą: wiersz otwiera edytor posta z podglądem; reszta: szczegóły zadania */
  const ppOpen=x=>{const t=x.t,d=isDay(t.date)?t.date.slice(0,10):'';return (x.kind==='pub'||x.kind==='rec')&&t.channel&&d?'data-medit="'+esc(t.project+'|'+d+'|'+t.id)+'"':'data-task="'+esc(t.id)+'"'};
  /* minuty Twoich zadań w dniu; ponad limit dnia (dayMinutes) na czerwono */
  /* suma przy dniu tylko, gdy minuty ma więcej niż jedno zadanie albo dzień jest ponad limit (inaczej ta sama liczba dwa razy) */
  const cap0=D.dayMinutes||120,mine=k=>day[k].filter(x=>(x.kind==='you'||(x.kind==='late'&&x.t.executor==='ty'))&&+x.t.minutes>0);
  const mins=k=>{const L=mine(k),m=L.reduce((s,x)=>s+(+x.t.minutes),0);return L.length>1||m>cap0?m:0};
  /* ryzyka projektu: etapy po terminie („Zmień termin”) i zagrożone („Sprawdź etap”), jak w Przeglądzie */
  const rk=p.stagesL.filter(s=>!s.done&&(s.st==='late'||s.st==='risk'));
  const ks=Object.keys(day).sort();
  let h='';
  if(dec.length)h+='<section class="panel" id="pdec"><h2>Decyzje <small class="num">'+dec.length+'</small></h2><ul class="rows">'+dec.map(x=>todayRow(x,{prio:false})).join('')+'</ul></section>';
  if(false&&rk.length)h+='<section class="panel" id="prisk"><h2>Ryzyka <small class="num">'+rk.length+'</small></h2><ul class="rows">'+rk.map(s=>'<li><div><a class="lk t" href="'+phref(p,'etapy')+'">'+esc(s.title)+'</a><div class="s">'+lz(s.st)+
      '<span class="num">'+(isDay(s.date)?'termin '+ddl(s.date)+' · ':'')+'otwarte: '+s.open+' z '+s.total+'</span></div></div>'+
      '<div class="r"><a class="btn sec sm" href="'+phref(p,'etapy')+'" aria-label="'+esc((s.st==='late'?'Zmień termin etapu: ':'Sprawdź etap: ')+s.title)+'">'+(s.st==='late'?'Zmień termin':'Sprawdź etap')+'</a></div></li>').join('')+'</ul></section>';
  h+='<section class="panel" id="pplan"><h2>Najbliższe 7 dni</h2>';
  if(!ks.length)h+='<p class="empty">'+(dec.length?'Poza sprawami wyżej na 7 dni nic nie zaplanowano.':'Na najbliższe 7 dni nic nie zaplanowano.')+'</p>';
  else h+='<div class="pad pp">'+ks.map(k=>{const m=mins(k);

async function loadPChat(pid){

/* ---------- wskaźniki (nowe klasy z prefiksem wk-) ---------- */
/* kolory stanów jak w progCell i na Tablicy: zrobione, do odbioru, w toku; do zrobienia jako tło */
const CFD_ST=[['done','Zrobione','--bar-done'],['rev','Do odbioru','--bar-rev'],['wip','W toku','--bar-wip'],['todo','Do zrobienia','--line-2']];
const WEEKS=()=>[7,6,5,4,3,2,1,0].map(i=>addK(D.todayKey,-7*i));
const histReady=()=>D.history.length>0&&D.history[0].date<=addK(D.todayKey,-14);
/* dzień, od którego będzie dość historii: wykresy po 14 dniach (histReady), tempo po 28 (H[3] w kpis i compareTable) */
function wkFrom(days){return addK(D.history.length?D.history[0].date:D.todayKey,days)}
const wkThr=L=>histReady()&&!!sumHist(L)[3];
/* podziałka osi Y: najwyżej ok. 5 linii (1, 2, 5 × 10^n) */
function wkStep(max){const r=Math.max(1,max/5),e=Math.pow(10,Math.floor(Math.log10(r))),f=r/e;return Math.max(1,(f<=1?1:f<=2?2:f<=5?5:10)*e)}
const wkAx=(i,last)=>(last-i)%2?' class="wk-ax2"':'';
const wkOpen=id=>!!(A.tgl&&A.tgl[id]);
/* by: id nagłówka, który nazywa przełączany wykres (aria-describedby; „Pokaż” z nazwą dla czytnika) */
function wkTog(id,show,hide,by){const o=wkOpen(id);return '<button class="linkbtn" data-toggle="'+id+'" data-show="'+show+'" data-hide="'+hide+'" aria-expanded="'+o+'" aria-controls="'+id+'"'+(by?' aria-describedby="'+by+'"':'')+'>'+(o?hide:show)+'</button>'}
function wkTable(id,head,rows){const k='t-'+id;
  return wkTog(k,'Pokaż liczby w tabeli','Ukryj tabelę')+'<div class="tw" id="'+k+'"'+(wkOpen(k)?'':' hidden')+'><table class="dt"><thead><tr>'+head.map((h,j)=>'<th'+(j?' class="num"':'')+'>'+h+'</th>').join('')+'</tr></thead><tbody>'+
    rows.map(r=>'<tr>'+r.map((v,j)=>'<td'+(j?' class="num"':'')+'>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
/* nazwa projektu: część przed „ (” i nawias osobno (w drugim wierszu) */
function wkNm(p){const n=String(p.name||''),i=n.indexOf(' (');return i>0?[n.slice(0,i),n.slice(i+1)]:[n,'']}
const wkNmH=p=>{const n=wkNm(p);return esc(n[0])+(n[1]?'<span class="wk-sub">'+esc(n[1])+'</span>':'')};
function nowCounts(p){const c=p.c;return {todo:c.todo,wip:c.wip+c.blocked,rev:c.rev,done:c.done,total:c.all}}
function hist(p){
  if(HC[p.id])return HC[p.id];
  const W=WEEKS(),out=W.map((w,i)=>{
    if(i===7)return nowCounts(p);
    let e=null;for(let j=D.history.length-1;j>=0;j--){if(D.history[j].date<=w){e=D.history[j];break}}
    if(!e)return null;const n=e.projects[p.id];if(!n)return {todo:0,wip:0,rev:0,done:0,total:0};
    const r={todo:+n.todo||0,wip:(+n.wip||0)+(+n.blocked||0),rev:+n.rev||0,done:+n.done||0};r.total=+n.total||(r.todo+r.wip+r.rev+r.done);return r});
  return HC[p.id]=out;
}
function sumHist(L){return WEEKS().map((_,i)=>{const hs=L.map(p=>hist(p)[i]);if(hs.every(h=>!h))return null;const r={total:0,done:0,wip:0,rev:0,todo:0};hs.forEach(h=>{if(h)for(const k in r)r[k]+=h[k]});return r})}
const CHARTS={};
const sw=v=>'<i style="background:var('+v+')"></i>';
const pv=p=>'--c'+(p.ci+1);
/* podpowiedź wykresu: zakotwiczona przy punkcie; a = {x,y} (współrzędne okna), prostokąt punktu albo zdarzenie */
function tipShow(html,a){const t=$('#tip');t.innerHTML=html;t.hidden=false;const w=t.offsetWidth,h=t.offsetHeight;
  const ax=a.clientX!=null?a.clientX:a.width!=null?a.left+a.width/2:a.x,ay=a.clientY!=null?a.clientY:a.height!=null?a.top:a.y;
  let x=ax+14,y=ay+14;if(x+w>innerWidth-8)x=ax-w-14;if(y+h>innerHeight-8)y=ay-h-14;t.style.left=Math.max(4,x)+'px';t.style.top=Math.max(4,y)+'px'}
function tipHide(){$('#tip').hidden=true}
/* po terminie: zadania (także publikacje, jak w Terminach) i etapy */
const lateOf=L=>{const ids=L.map(p=>p.id);return D.tasks.filter(t=>ids.indexOf(t.project)>=0&&isLate(t)).length+D.stages.filter(s=>ids.indexOf(s.project)>=0&&s.st==='late').length};
/* kafle wskaźników; „Po terminie” z lateOf, tak samo jak w porównaniu projektów */
/* kafle wskaźników (portfel i projekt, decyzja 23): najwyżej 4 — Po terminie, W toku, Postęp, Twój czas.
   Etapy, tempo i kampanie są w zwiniętym „Więcej wykresów” (wkMore) */
function kpis(L,one){
  const H=sumHist(L),n=H[7],o=H[3],ready=histReady();
  const pct=n.total?100*n.done/n.total:0,dp=o&&o.total?Math.round(pct-100*o.done/o.total):null;
  const late=lateOf(L),ids=L.map(p=>p.id);
  const hT=one?phref(one,'etapy'):'#terminy',hB=one?phref(one,'tablica'):'#tablica';
  const nil='<span class="v num wk-nil" aria-label="brak danych">—</span>';
  /* odbiory czekają na właściciela: kafel prowadzi do Dla Ciebie z filtrem Odbiory */
  const wipA=n.rev?' href="#ty" data-tyfgo="od" title="Do odbioru: otwiera Dla Ciebie z filtrem Odbiory"':' href="'+hB+'"';
  return '<div class="kgrid">'+
   '<a class="stat'+(late?' red':'')+'" href="'+hT+'"><span class="l">Po terminie</span><span class="v num">'+late+'</span><span class="d">zadania i etapy</span></a>'+
   '<a class="stat"'+wipA+'><span class="l">W toku</span><span class="v num">'+(n.wip+n.rev)+'</span><span class="d num">'+(n.rev?n.wip+' w pracy · '+n.rev+' do odbioru':pl(n.wip,'zadanie','zadania','zadań')+' w pracy')+'</span></a>'+
   '<div class="stat"><span class="l">Postęp</span>'+(n.total?'<span class="v num">'+Math.round(pct)+'%</span>':nil)+'<span class="d num">'+n.done+' z '+n.total+' zadań'+(dp!=null&&ready?' · '+(dp>=0?'+':'−')+Math.abs(dp)+' '+pl(Math.abs(dp),'punkt procentowy','punkty procentowe','punktów procentowych')+' w 4 tygodnie':'')+'</span></div>'+
   wkLoad(ids)+'</div>';
}
/* obciążenie właściciela: minuty Twoich spraw na 7 kolejnych dni wobec pojemności dnia (dayMinutes); dziś z zaległymi,
   jak w Przeglądzie → Dziś. Sprawy bez czasu (zgody, odbiory, pytania bez pola czas:) nie mają minut */
function wkLoad(ids){
  const ys=youState(),cap=D.dayMinutes||120,T=D.todayKey,K=[0,1,2,3,4,5,6].map(i=>addK(T,i)),M=K.map(()=>0);
  const inP=x=>ids.indexOf(x.q?x.q.p.id:x.t.project)>=0;
  ys.youToday.filter(inP).forEach(x=>{M[0]+=x.min});
  ys.youWeek.concat(ys.youLater).filter(inP).forEach(x=>{const i=K.indexOf(x.d);if(i>0)M[i]+=x.min});
  const over=M.filter(m=>m>cap).length,max=Math.max(cap,...M);
  const tip=K.map((k,i)=>ddl(k)+': '+M[i]+' min').join('; ');
  return '<a class="stat'+(M[0]>cap?' red':'')+'" href="#ty" title="'+esc(tip+' · limit '+cap+' min na dzień')+'"><span class="l">Twój czas dziś</span><span class="v num">'+M[0]+' <small class="wk-u">z '+cap+' min</small></span>'+
    '<span class="wk-load" aria-hidden="true">'+M.map(m=>'<span class="wk-lb'+(m>cap?' wk-hi':'')+'" style="height:'+Math.max(2,Math.round(22*m/max))+'px"></span>').join('')+'</span>'+
    '<span class="d num">'+(over?'7 dni: ponad limit w '+over+' '+pl(over,'dniu','dniach','dniach'):'7 dni: w limicie')+'</span><span class="sr-only">'+esc(tip)+'</span></a>';
}
function lineChart(id,L){
  const nar=nwNarrow(),W=WEEKS(),Wd=620,Hh=250,ml=nar?46:38,mr=nar?10:150,mt=12,mb=26,iw=Wd-ml-mr,ih=Hh-mt-mb;
  const x=i=>ml+iw*i/7,y=v=>mt+ih-ih*v/100;

  if(L.length>1)series.unshift({p:null,v:sumHist(L).map(h=>h&&h.total?100*h.done/h.total:null)});
  let g='';[0,25,50,75,100].forEach(v=>{g+='<line class="gl" x1="'+ml+'" x2="'+(ml+iw)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(ml-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'%</text>'});
  W.forEach((d,i)=>{g+='<text'+wkAx(i,7)+' x="'+x(i)+'" y="'+(Hh-6)+'" text-anchor="middle">'+dd(d)+'</text>'});
  let lines='';const labs=[];
  series.forEach(s=>{const c=s.p?'var('+pv(s.p)+')':'var(--ink)';let d='',pen=false;
    s.v.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+x(i)+','+y(v);pen=true});
    if(series.length===1&&s.p){const st=s.v.findIndex(v=>v!=null);let a='M'+x(st)+','+y(0);s.v.forEach((v,i)=>{if(v!=null)a+='L'+x(i)+','+y(v)});a+='L'+x(7)+','+y(0)+'Z';lines+='<path d="'+a+'" fill="'+c+'" opacity=".12"/>'}

    lines+='<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="'+(s.p?2.5:3)+'"'+(s.p||series.length<2?'':' stroke-dasharray="7 4"')+' stroke-linejoin="round" stroke-linecap="round"/>';
    const lv=s.v[7];if(lv!=null){lines+='<circle cx="'+x(7)+'" cy="'+y(lv)+'" r="4" fill="'+c+'" stroke="var(--surface)" stroke-width="2"/>';labs.push({y:y(lv),t:(s.p?s.p.name:'Razem')+' '+Math.round(lv)+'%'})}});
  labs.sort((a,b)=>a.y-b.y);for(let i=1;i<labs.length;i++)if(labs[i].y-labs[i-1].y<15)labs[i].y=labs[i-1].y+15;
  const lt=labs.map(l=>'<text class="lb" x="'+(ml+iw+10)+'" y="'+(l.y+4)+'">'+esc(l.t.length>22?l.t.slice(0,21)+'…':l.t)+'</text>').join('');
  const nm=s=>s.p?sw(pv(s.p))+esc(s.p.name):'<i style="background:var(--ink)"></i>Razem';
  CHARTS[id]={type:'x',x:x,ml:ml,iw:iw,W:Wd,n:8,html:i=>'<b>Tydzień do '+dd(W[i])+'</b>'+series.map(s=>'<div class="r"><span>'+nm(s)+'</span><span class="num">'+(s.v[i]==null?'—':Math.round(s.v[i])+'%')+'</span></div>').join('')};
  /* legenda zawsze, z wartością na końcu (na telefonie zastępuje etykiety przy liniach) */
  const leg='<div class="leg">'+series.map(s=>'<span>'+nm(s)+(s.v[7]!=null?' <b class="num">'+Math.round(s.v[7])+'%</b>':'')+'</span>').join('')+'</div>';
  const s0=series[0],fv=s0?s0.v.find(v=>v!=null):null,lv0=s0?s0.v[7]:null;

    wkTable(id,['Tydzień do'].concat(series.map(s=>s.p?esc(s.p.name):'Razem')),W.map((d,i)=>[dd(d)].concat(series.map(s=>s.v[i]==null?'—':Math.round(s.v[i])+'%'))));
}
function barChart(id,L){
  const nar=nwNarrow(),W=WEEKS(),Wd=600,Hh=250,ml=nar?40:30,mr=10,mt=24,mb=26,iw=Wd-ml-mr,ih=Hh-mt-mb;

  const tot=wk.map(i=>act.reduce((a,p)=>a+val(p,i),0)),mx=Math.max(2,...tot),st=wkStep(mx),top=Math.ceil(mx/st)*st;
  const y=v=>mt+ih-ih*v/top,bw=iw/wk.length;
  let g='';for(let v=0;v<=top;v+=st){g+='<line class="gl" x1="'+ml+'" x2="'+(ml+iw)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(ml-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>'}
  let bars='';

      if(j===segs.length-1){const r=Math.min(4,h/2);bars+='<path d="M'+bx+','+y0+'V'+(y1+r)+'Q'+bx+','+y1+' '+(bx+r)+','+y1+'H'+(bx+w-r)+'Q'+(bx+w)+','+y1+' '+(bx+w)+','+(y1+r)+'V'+y0+'Z" fill="'+c+'" stroke="var(--surface)" stroke-width="2"/>'}

      base+=sg.v});
    if(k===wk.length-1)bars+='<text class="lb" x="'+(bx+w/2)+'" y="'+(y(tot[k])-6)+'" text-anchor="middle">'+tot[k]+'</text>';
    bars+='<text'+wkAx(k,wk.length-1)+' x="'+(bx+w/2)+'" y="'+(Hh-6)+'" text-anchor="middle">'+dd(W[i])+'</text>'});
  CHARTS[id]={type:'band',ml:ml,bw:bw,W:Wd,n:wk.length,html:k=>{const i=wk[k];return '<b>Tydzień do '+dd(W[i])+'</b>'+(act.length?act.map(p=>'<div class="r"><span>'+sw(pv(p))+esc(p.name)+'</span><span class="num">'+val(p,i)+'</span></div>').join(''):'<div>0</div>')+(multi?'<div class="r"><span>Razem</span><span class="num">'+tot[k]+'</span></div>':'')}};
  const leg=multi?'<div class="leg">'+act.map(p=>'<span>'+sw(pv(p))+esc(p.name)+'</span>').join('')+'</div>':'';
  const one1=act.length===1;
  return leg+'<svg viewBox="0 0 '+Wd+' '+Hh+'" data-chart="'+id+'" tabindex="0" role="img" aria-label="Zakończone zadania w '+wk.length+' tygodniach, w ostatnim tygodniu '+tot[tot.length-1]+'">'+g+bars+'<rect class="hit" x="'+ml+'" y="'+mt+'" width="'+iw+'" height="'+ih+'" fill="transparent"/></svg>'+
    wkTable(id,['Tydzień do'].concat(act.map(p=>esc(p.name))).concat(one1?[]:['Razem']),wk.map((i,k)=>[dd(W[i])].concat(act.map(p=>val(p,i))).concat(one1?[]:[tot[k]])));
}
function cfdChart(id,L){
  const nar=nwNarrow(),W=WEEKS(),H=sumHist(L),Wd=nar?600:900,Hh=250,ml=nar?40:30,mr=nar?10:118,mt=12,mb=26,iw=Wd-ml-mr,ih=Hh-mt-mb;
  const idx=[];H.forEach((h,i)=>{if(h)idx.push(i)});
  const max=Math.max(1,...idx.map(i=>H[i].total)),step=wkStep(max),top=Math.ceil(max/step)*step;

  let g='';for(let v=0;v<=top;v+=step){g+='<line class="gl" x1="'+ml+'" x2="'+(ml+iw)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(ml-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>'}
  W.forEach((d,i)=>{g+='<text'+wkAx(i,7)+' x="'+x(i)+'" y="'+(Hh-6)+'" text-anchor="middle">'+dd(d)+'</text>'});
  let base=idx.map(()=>0),areas='';const labs=[];
  CFD_ST.forEach(([k,n,v])=>{const lo=base.slice(),hi=base.map((b,j)=>b+H[idx[j]][k]);
    areas+='<path d="M'+hi.map((h,j)=>x(idx[j])+','+y(h)).join('L')+'L'+lo.map((l,j)=>x(idx[j])+','+y(l)).reverse().join('L')+'Z" fill="var('+v+')" stroke="var(--surface)" stroke-width="2" stroke-linejoin="round"/>';
    const last=idx.length-1;if(H[7][k])labs.push({y:y((lo[last]+hi[last])/2),t:n+' '+H[7][k]});base=hi});
  labs.sort((a,b)=>b.y-a.y);for(let i=1;i<labs.length;i++)if(labs[i-1].y-labs[i].y<16)labs[i].y=labs[i-1].y-16;

/* „Ile zostało w etapie”: linia planu od początku do terminu, linia „zostało” do dziś. Etap po terminie: oś sięga dziś,

/* linia „zostało” z dat zamknięcia zadań etapu (stateSince); bez kompletu dat: ''. Ustawia burnSteps.ok */
function burnSteps(s,n,x,y,today){
  const T=D.tasks.filter(t=>t.stage===s.id&&t.kind!=='publikacja'),dn=T.filter(t=>t.state==='done');
  burnSteps.ok=T.length===n&&dn.every(t=>isDay(t.stateSince));if(!burnSteps.ok||!dn.length)return '';
  const ds=dn.map(t=>Math.min(today,Math.max(0,diff(String(t.stateSince).slice(0,10),s.start)))).sort((a,b)=>a-b);
  let left=n,o='';ds.forEach(i=>{o+='L'+x(i)+','+y(left);left--;o+='L'+x(i)+','+y(left)});return o;
}
function burnChart(p){
  const s=p.stagesL.find(x=>!x.done&&isDay(x.date));
  if(!s)return '<p class="cap">Brak etapu w toku z terminem.</p>';
  const n=s.total,open=s.open;
  if(!n)return '<p class="cap">Etap „'+esc(s.title)+'” nie ma zadań.</p>';
  const fut=isDay(s.start)&&s.start>D.todayKey;
  const dl=Math.max(1,diff(s.date,s.start)),late=!fut&&D.todayKey>s.date,days=late?Math.max(dl,diff(D.todayKey,s.start)):dl;
  const today=Math.min(days,Math.max(0,diff(D.todayKey,s.start)));
  /* sekcja na całą szerokość: szerszy viewBox, żeby tekst nie rósł ponad 12–15 px */
  const Wd=nwNarrow()?600:900,Hh=240,ml=36,mr=24,mt=30,mb=30,iw=Wd-ml-mr,ih=Hh-mt-mb,x=i=>ml+iw*i/days,y=v=>mt+ih-ih*v/Math.max(1,n);
  let g='';for(let v=0;v<=n;v+=wkStep(n)){g+='<line class="gl" x1="'+ml+'" x2="'+(ml+iw)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(ml-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>'}
  const xs=[[0,'start'],[days,'end']];
  if(late){if(x(days)-x(dl)>90)xs.splice(1,0,[dl,'middle'])}else if(days>=4)xs.splice(1,0,[Math.round(days/2),'middle']);
  xs.forEach(([i,an])=>{g+='<text x="'+x(i)+'" y="'+(Hh-6)+'" text-anchor="'+an+'">'+dd(addK(s.start,i))+'</text>'});
  if(late)g+='<line x1="'+x(dl)+'" x2="'+x(dl)+'" y1="'+mt+'" y2="'+(mt+ih)+'" stroke="var(--l-red)" stroke-width="1.5"/><text x="'+(x(dl)-6)+'" y="'+(mt-10)+'" text-anchor="end">termin '+dd(s.date)+'</text>';
  const ideal='<path d="M'+x(0)+','+y(n)+'L'+x(dl)+','+y(0)+'" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>';
  /* etap w przyszłości: tylko linia planu, bez linii „Zostało zadań” i bez werdyktu o tempie */
  const tx=x(today),right=tx>Wd-200;
  const real=fut?'':'<path d="M'+x(0)+','+y(n)+burnSteps(s,n,x,y,today)+'L'+tx+','+y(open)+'" stroke="var(--c1)" stroke-width="2" fill="none"/><circle cx="'+tx+'" cy="'+y(open)+'" r="4" fill="var(--c1)" stroke="var(--surface)" stroke-width="2"/>'+
    /* etykieta „dziś” nad punktem; przy etapie po terminie między kreską terminu a punktem albo nad linią, gdy brak miejsca */
    '<text class="wk-today" x="'+(right?tx:Math.max(tx+10,ml+24))+'" y="'+Math.max(mt+16,y(open)-14)+'" text-anchor="'+(right?'end':'start')+'"'+(late&&right&&tx-x(dl)<130?' dy="-16"':'')+'>dziś: '+open+' z '+n+'</text>';
  const left=diff(s.date,D.todayKey),pace=today?(n-open)/today:0,need=left>0?open/left:open,ok=left>=0&&pace>=need;
  const t='„'+esc(s.title)+'”',rest=open+' z '+n;
  const verd=fut?'':left<0?'po terminie':ok?'zdąży':'nie zdąży';
  const al='Etap '+t+': zostało '+rest+', termin '+dd(s.date)+(verd?', '+verd:', zaczyna się '+dd(s.start));
  const leg='<div class="leg">'+(fut?'':'<span><i style="background:var(--c1)"></i>Zostało zadań</span>')+'<span><i class="wk-dash"></i>Plan</span></div>';
  const zad=v=>fmt1(v)+' '+(Math.round(v*10)===10?'zadanie':'zadania');
  const cap=fut?'<p class="wk-verd">Etap zaczyna się '+dd(s.start)+', zostało '+rest+' zadań.</p><p class="cap">Etap '+t+' do '+dd(s.date)+'.</p>':
    '<p class="wk-verd">'+(left<0?'<b class="wk-bad">Po terminie ('+dd(s.date)+'): zostało '+rest+'</b>':ok?'<b class="wk-ok">Zdąży: zostało '+rest+' do '+dd(s.date)+'</b>':'<b class="wk-bad">Nie zdąży: zostało '+rest+' do '+dd(s.date)+'</b>')+'</p>'+
    '<p class="cap">Etap '+t+'.'+' Tempo etapu: '+zad(7*pace)+' tygodniowo'+(left<0?'.':', potrzeba '+zad(7*need)+'.')+'</p>';
  return cap+leg+'<svg viewBox="0 0 '+Wd+' '+Hh+'" role="img" aria-label="'+al+'">'+g+ideal+real+'</svg>';
}

/* rodzaj uruchomienia w wierszu (krótko); pełna nazwa KIND w szufladzie */
const KSH={task:'Zadanie',pm:'Raport PM',check:'Test',plan:'Plan dnia',grafika:'Grafika'};
/* stan w wierszu listy krótko, pełna etykieta w title i w szufladzie */
const RSS={login:'logowanie',limit:'limit',timeout:'za długo',unknown:'nieznany'};

/* krótki wynik zakończonego uruchomienia: pierwsza linia błędu albo wyniku, bez powtarzania etykiety stanu */
function runShort(r){

/* wiersz uruchomienia: tytuł pierwszy, stan i czas po prawej (telefon: pod tytułem); g = scalone kolejne o tym samym tytule i stanie */
function runRow(r,g){

  m.push(pn?esc(pn):KSH[r.kind]||KIND[r.kind]);m.push(TOOL[r.tool]);if(r.auto)m.push('samodzielnie');
  if(r.state==='running'&&r.activity)m.push(nwStep(r.activity));else if(!isAct(r)){const w=runShort(r);if(w)m.push(w)}

/* grupa uruchomień: kolejne o tym samym tytule i stanie w jednym wierszu „Tytuł ×N” */
function runGroup(id,name,R,coll){

    (open?'<ul class="rows runs ag-runs" id="ag-g-'+id+'">'+M.map(g=>g.length>1?runRow(g[0],g):runRow(g[0])).join('')+'</ul>':'');

/* /api/data resources: liczby i listy sprawdzone, reszta odrzucona */
function normRes(r){

/* ---------- szuflada zadania ---------- */
const refOf=t=>({id:t.id,project:t.project,file:t.file,title:t.title,line:t.line});
function findTask(ref,loose){
  let t=D.tasks.find(x=>x.id===ref.id&&x.title===ref.title);if(t)return t;
  const c=D.tasks.filter(x=>x.project===ref.project&&x.file===ref.file&&x.title===ref.title);
  if(c.length){const ln=ref.line||1e9;return c.sort((a,b)=>Math.abs(a.line-ln)-Math.abs(b.line-ln))[0]}
  return loose?(D.tasks.find(x=>x.id===ref.id)||null):null;
}
const opt=(pairs,v)=>pairs.map(p=>'<option value="'+esc(p[0])+'"'+(p[0]===v?' selected':'')+'>'+esc(p[1])+'</option>').join('');

  if(!D.agents)return '';

  if(r){const d=fmtDur(runDur(r)),ls=r.steps.length?r.steps[r.steps.length-1]:null;
    return '<div class="abox"><div>'+TOOL[r.tool]+': '+lzR(r.state)+(d?' <span class="muted">· '+d+'</span>':'')+'</div>'+((r.activity||ls)?'<p class="act">'+(ls?esc(ls.t)+' · ':'')+nwStep(r.activity||ls.text)+'</p>':'')+
      '<div class="row"><button class="btn sec sm" data-ag="stop" data-id="'+esc(r.id)+'" data-k="stop">Zatrzymaj</button><button class="btn sec sm" data-run="'+esc(r.id)+'" data-k="open">Podgląd uruchomienia</button></div></div>'}
  const why=blockOf(t),last=lastRunOf(t);
  return '<div class="abox"><div class="row"><button class="btn sm" data-ag="run" data-id="'+esc(t.id)+'" data-k="run"'+(!why?'':A.starting[t.id]?' aria-disabled="true"':' disabled')+' title="Skrót: r">Uruchom agenta: '+TOOL[toolOf(t)]+'</button>'+(why?'<span class="rsn">'+esc(why)+'</span>':'')+'</div>'+

}

  return m.length?'<p class="dmeta">'+m.join(' · ')+'</p>':'';

  let h='<details class="dbox chat dr-chat"'+(c.messages.length||c.pending||(DR&&DR.chat)?' open':'')+' id="dchat"><summary>Zapytaj Claude o to zadanie</summary>';
  if(c.messages.length)h+='<div class="cms">'+c.messages.map(m=>'<div class="cm '+(m.role==='ty'?'me':'ai')+'"><b>'+(m.role==='ty'?'Ty':'Claude')+'</b>'+chatText(m.text)+'</div>').join('')+'</div>';
  if(c.pending)h+='<p class="note">Claude czyta zadanie i pliki… (do ok. 2 min)</p>';
  if(c.error)h+='<p class="warn">'+esc(c.error)+'</p>';
  h+='<form class="dform" data-chat="'+esc(t.id)+'"><textarea class="fi" rows="2" maxlength="2000" data-cq aria-label="Pytanie o zadanie" placeholder="Np. po co to zadanie? Co dokładnie mam wpisać? Czy można je pominąć?"></textarea>'+

  return h;
}

function resFiles(t){
  const d=t.detail;if(!d)return [];
  const txt=[d.result,d.left].filter(Boolean).join('\n'),out=[],seen={};
  d.refs.forEach(r=>{seen[r.path+'#'+r.anchor]=1});
  const re=/(^|[\s(„"'`:])((?:[\w.\-]+\/)*[\w\-][\w.\-]*\.(?:md|txt))(?:#([\w\-]+))?(?=$|[\s),.;:"'`”])/gi;
  let m;

    if(/(^|\/)\.\.(\/|$)/.test(path)||/^ZADANIA\.md$/i.test(path)||seen[k])continue;

async function uploadPostImage(el){
  const file=el.files&&el.files[0];if(!file)return;
  const parts=String(el.dataset.postimg||'').split('|'),pid=parts[0],day=parts[1],param=parts[2];

      {method:'POST',headers:{'Content-Type':file.type==='image/png'?'image/png':'image/jpeg'},body:file});
    if(r.status===401){location.assign('/wejscie');return}
    data=await r.json().catch(()=>({}));ok=r.ok&&data.ok!==false;msg=data.error||''}catch(e){msg='brak połączenia'}
  A.imgUp='';A.fEdit=null;A.fVal={};delete PD[pid+'|'+day];renderDrawer(true);render(true);load();
  say(ok?(data.recording?'Plik w filmie. Nagrywam film od nowa.':'Plik w filmie. '+(data.note||'Film nagra panel na serwerze w ciągu kilku minut.')):'Nie wgrano pliku'+(msg?': '+msg:'')+'.');

/* „Wyróżnij zaznaczone słowo”: zaznaczenie (albo słowo pod kursorem) w gwiazdkach, poprzednie wyróżnienie znika */
function stuHighlight(el){
  const k=el.dataset.stuhl||'',form=el.closest('form'),i=form&&form.querySelector('[data-fval="'+CSS.escape(k)+'"]');
  if(!i)return;
  let v=i.value,a=i.selectionStart==null?0:i.selectionStart,b=i.selectionEnd==null?a:i.selectionEnd;
  const before=v.slice(0,a).split('*').length-1,inside=v.slice(a,b).split('*').length-1;
  v=v.replace(/\*/g,'');a-=before;b-=before+inside;
  const W=/[^\s.,:;!?„”"()]/;   /* zawsze całe słowa: zaznaczenie w środku słowa obejmuje całe słowo */
  while(a>0&&W.test(v[a-1]))a--;while(b<v.length&&W.test(v[b]))b++;
  while(a<b&&v[a]===' ')a++;while(b>a&&v[b-1]===' ')b--;
  if(a===b){say('Zaznacz słowo w polu, które ma być w kolorze marki.');i.focus();return}
  v=v.slice(0,a)+'*'+v.slice(a,b)+'*'+v.slice(b);
  if(v.length>(+i.maxLength||90)){say('Tekst byłby za długi.');return}
  i.value=v;(A.fVal||(A.fVal={}))[k]=v;
  const pv=form.querySelector('[data-stuprev="'+CSS.escape(k)+'"]');if(pv)pv.innerHTML=stuPrev(v,stuAcc(form.dataset.fset||''));
  i.focus();i.setSelectionRange(a,b+2);
}

const mkIsFilm=t=>{const d=PD[t.project+'|'+String(t.date).slice(0,10)];return !!(d&&d.ok&&(d.scenario||d.film))||/film/i.test(t.title)||/reels|tiktok|youtube/i.test(t.channel||'')};

    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);

  const rec=t=>{const r=addK(t.date.slice(0,10),-1);return r<T?T:r},G={};
  L.forEach(t=>{const r=rec(t);(G[r]||(G[r]=[])).push(t)});

/* stan posta: [kolor, stan, grupa]; ten sam w karcie (mCard), w liczniku (mkTodo) i na stronie projektu (mktView).
   grupa: late (po terminie), ok (czeka na zgodę), review (do obejrzenia), err (błąd), prep (agent przygotowuje), done (opublikowane), '' (reszta) */
function mkState(t,day,fs){
  const d=PD[t.project+'|'+day];
  if(t.state!=='done'&&isDay(day)&&day<D.todayKey)return ['red','po terminie','late'];
  if(t.state==='done')return ['green','opublikowane','done'];
  if(t.needsYou==='zgoda')return ['purple','czeka na zgodę','ok'];
  if(LIVE&&d&&d.ok){
    const f=fs||filmState(d,t,day);
    if((d.scenario||d.film)&&f[0]!=='green')return [f[0],f[1],f[0]==='red'?'err':''];
    return ['purple','do obejrzenia','review'];
  }
  const pr=D.tasks.find(x=>prepDay(x)===day&&x.project===t.project&&x.state!=='done');
  if(pr)return ['blue','agent przygotuje'+(isDay(pr.date)?' do '+ddl(pr.date):''),'prep'];
  /* bez zadania przygotowania: wykonawca publikacji przygotowuje post przed dniem publikacji */
  const by=isDay(day)?' do '+ddl(addK(day,-1)):'';
  if(t.executor&&t.executor!=='ty'&&WHO[t.executor])return ['blue','przygotuje '+WHO[t.executor].n+by,'prep'];
  if(t.executor==='ty')return ['grey','przygotowujesz Ty'+by,''];
  return ['grey','nikt nie przygotowuje',''];
}

  'sp-tt':['TikTok','na TikToku','TikTok'],'sp-gen':['Post','','']};
/* zakładki platform według kanałów i formy posta, zawsze w tej kolejności: Instagram (zdjęcie albo film), Facebook
   (Reels tylko z filmem), LinkedIn, TikTok (film). Film to także scenariusz, którego nagranie jeszcze trwa.
   Bez pola kanał: sekcje post.md. Post jeszcze nieprzygotowany: wszystkie kanały (formy jeszcze nie znamy).
   Nic nie pasuje: jedna zakładka „Post”. */
function pvPlats(t,d){
  const ok=!!(d&&d.ok),film=!ok||!!(d.film||d.scenario),media=film||!!(d.image||(d.photos||[]).length);
  let ch=chList(t);
  if(!ch.length)ch=Object.keys(ok&&d.sections||{}).map(n=>CHAL[n.toLowerCase()]||n.toLowerCase());

  if(ch.includes('linkedin'))L.push('sp-li');

function pvLi(c,d){
  const w=spWho(c.pid);
  return '<article class="sp sp-li" aria-label="Podgląd: LinkedIn"><div class="sp-hd">'+av(w.p,'sm')+'<span class="sp-nm"><b>'+esc(w.name)+'</b><small>Teraz · Wszyscy</small></span><span class="sp-dot3" aria-hidden="true">···</span></div>'+
    '<p class="sp-tx">'+pvCut(spCap(d,'sp-li'),LI_MORE,'więcej')+'</p>'+spOne(c,d,'sp-rfb')+'<div class="sp-bar"><span>Poleć</span><span>Skomentuj</span><span>Wyślij dalej</span><span>Wyślij</span></div></article>';
}
function pvTt(c,d){
  const w=spWho(c.pid),src='/api/post/film?'+postQ(c.pid,c.day)+'&v='+(d.film?d.film.at||0:0);
  return '<article class="sp sp-tt" aria-label="Podgląd: TikTok">'+(d.film?'<video class="sp-mm" src="'+esc(src)+'" muted loop playsinline autoplay preload="metadata"></video>':'<span class="sp-empty sp-tt-empty">Filmu jeszcze nie ma</span>')+
    '<div class="sp-side">'+av(w.p,'sm')+spIco('heart')+spIco('talk')+spIco('mark')+spIco('send')+'</div>'+
    '<div class="sp-cap"><b>@'+esc(w.user)+'</b><p>'+pvCut(spCap(d,'sp-tt'),TT_MORE,'więcej')+'</p></div></article>';
}
/* zakładka „Post” (kanał bez podglądu, np. newsletter): grafika albo film i opis */
function pvGen(c,d){
  return '<article class="sp sp-gen" aria-label="Podgląd posta">'+spOne(c,d,'sp-rfb')+'<p class="sp-tx sp-gtx">'+esc(spCap(d,'sp-gen')).replace(/\n/g,'<br>')+'</p></article>';
}
const PVF={'sp-ig':pvIg,'sp-fb':pvFb,'sp-li':pvLi,'sp-tt':pvTt,'sp-gen':pvGen};
/* ---------- edytor posta (pełny ekran): zakładki platform; pod zakładką podgląd posta na tej platformie, obok edycja
   (opis, grafika albo film ze scenami, poprawki przez agenta). Jedna akcja w nagłówku zależna od zakładki, reszta w „⋯”. ---------- */
const ED={cur:null,srt:null,at:null,scene:-1,tab:'',v:0,more:false,slide:0};
const edFmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function edHost(){let h=document.getElementById('edHost');if(!h){h=document.createElement('div');h.id='edHost';document.body.appendChild(h)}return h}
function openEditor(key){
  const parts=key.split('|'),pid=parts[0],day=parts[1],tid=parts.slice(2).join('|');ED.cur={pid:pid,day:day,tid:tid};ED.srt=null;ED.at=null;ED.scene=-1;ED.v=0;
  const d=PD[pid+'|'+day];ED.tab='';ED.more=false;ED.slide=0;
  edHost().innerHTML=edShell();document.body.classList.add('ed-open');
  if(!d||d===null){PD[pid+'|'+day]=null;loadPost(pid,day)}else edFill();
  edSrt();const b=document.querySelector('#ed [data-edclose]');if(b)b.focus();
}
function closeEditor(){ED.cur=null;edHost().innerHTML='';document.body.classList.remove('ed-open');render(true)}
function edShell(){
  const c=ED.cur,t=D.tasks.find(x=>x.id===c.tid)||{title:'Post',channel:''};
  return '<div class="ed" id="ed" role="dialog" aria-modal="true" aria-labelledby="ed-t">'+
    '<header class="ed-h"><button type="button" class="btn sec sm" data-edclose>← Wróć</button><div class="ed-tt"><b id="ed-t">'+esc(t.title.replace(/^Opublikuj\s+/,''))+'</b><span class="muted" id="ed-meta"></span></div><div class="ed-acts" id="ed-acts"></div><p class="ed-next" id="ed-next" aria-live="polite"></p></header>'+
    '<div class="ed-tabs" role="tablist" aria-label="Platforma" id="ed-tabs"></div>'+
    '<div class="ed-b"><section class="ed-l" aria-label="Podgląd"><div id="ed-view" class="ed-view"><p class="muted">Wczytuję post…</p></div><p class="ed-st" id="ed-st"></p></section>'+
    '<aside class="ed-r" aria-label="Edycja"><section class="ed-blk" id="ed-txt"></section><section class="ed-blk" id="ed-med"></section>'+
    /* miejsce na sekcję „Grafika (Codex)”: wstawia ją jedna funkcja innego zadania, tutaj nic się nie generuje */
    '<section class="ed-blk ed-slot" id="ed-gfx-codex"></section>'+
    '<section class="ed-blk"><h3>Co poprawić?</h3><div class="ed-chat" id="ed-chat" aria-live="polite"></div>'+
    '<form class="ed-f" data-edfix><div class="ed-at" id="ed-at"></div><textarea class="fi" rows="3" maxlength="1000" data-edq aria-label="Co poprawić" placeholder="Np. w tym miejscu wolniej i większy napis; w opisie na LinkedIn krócej; zamiast komody pokaż sofę"></textarea>'+
    '<div class="row"><button class="btn sec sm">Wyślij do poprawy</button></div></form></section>'+
    '<div id="ed-plan"></div></aside></div></div>';
}
/* tekst posta dla kanału publikacji (sekcja post.md o nazwie kanału), inaczej pierwsza sekcja poza Alt */
function edMainSec(t,S){const ch=String(t.channel||'').split(/,\s*/).map(c=>(PUBN[c.toLowerCase()]||c).toLowerCase());
  const ks=Object.keys(S).filter(n=>n!=='Alt'&&S[n]);return ks.find(n=>ch.includes(n.toLowerCase()))||ks[0]||''}
/* kanały, które panel publikuje sam (Graph API) dla zakładki: Facebook (i Reels z filmem) albo Instagram,
   gdy konto jest połączone; Instagram z polem instagram: w karcie idzie przez rozszerzenie (igCan) */
function edApi(t,k,d){
  if(!LIVE||!D.publish||!t)return [];
  const ch=chList(t),film=!!(d&&d.film);
  if(k==='sp-fb')return [ch.includes('facebook')||!ch.includes('reels')?'facebook':'',ch.includes('reels')&&film?'reels':''].filter(c=>c&&chanOk(t,c));
  if(k==='sp-ig')return ch.includes('instagram')&&!igCan(t)&&chanOk(t,'instagram')?['instagram']:[];
  return [];
}
/* jedyna akcja w nagłówku: zgoda → Zatwierdź; potem „Udostępnij na …” dla otwartej zakładki; opublikowane → brak */
function edPrimary(t,d,k){
  if(!t||t.state==='done')return null;
  if(t.needsYou==='zgoda')return {n:'Zatwierdź',attr:'data-act="ok" data-id="'+esc(t.id)+'"'};
  if(!d||!d.ok||!SPN[k])return null;
  if(k==='sp-ig'&&IGS[t.id]&&IGS[t.id].busy)return {n:'Przygotowuję…',attr:'disabled'};
  return {n:k==='sp-gen'?'Kopiuj opis i pobierz pliki':'Udostępnij '+SPN[k][1],attr:'data-edgo="'+k+'"'};
}
function edMenu(t,d){
  const c=ED.cur,ok=!!(d&&d.ok),src=ok&&SPN[ED.tab]?edSecOf(d,ED.tab)[1]:'',b=(attr,n)=>'<button type="button" class="linkbtn" '+attr+'>'+n+'</button>',L=[];
  L.push(t.state==='done'?b('data-edpub="todo"','Oznacz jako nieopublikowane'):b('data-edpub="done"','Oznacz jako opublikowane'));
  if(ok&&src&&(d.sections||{})[src])L.push(b('data-copy="'+esc(c.pid+'|'+c.day+'|'+src)+'"','Kopiuj opis'));
  if(ok&&(d.film||d.image||(d.photos||[]).length))L.push(b('data-edget','Pobierz pliki'));
  if(t.needsYou==='zgoda'&&t.state!=='done')L.push(b('data-act="hold" data-id="'+esc(t.id)+'"','Wstrzymaj'));
  L.push(b('data-task="'+esc(t.id)+'" data-edclose2','Szczegóły zadania'));
  return '<details class="ed-mn"><summary aria-label="Więcej działań" title="Więcej działań"><span aria-hidden="true">⋯</span></summary><div class="ed-mnl">'+L.join('')+'</div></details>';
}
/* nagłówek: dzień i godzina, kanały, stan; akcja główna i menu „⋯”; jedno zdanie, co dalej */
function edActs(){
  if(!ED.cur)return;const c=ED.cur,t=D.tasks.find(x=>x.id===c.tid),m=document.getElementById('ed-meta'),a=document.getElementById('ed-acts');if(!m||!a)return;
  const put=(el,x)=>{if(el&&el.dataset.h!==x){el.innerHTML=x;el.dataset.h=x}};   /* bez przebudowy, gdy bez zmian (fokus, otwarte menu) */
  if(!t){put(m,esc(projName(c.pid)+' · '+ddl(c.day)));put(a,'');return}
  const d=PD[c.pid+'|'+c.day],st=mkState(t,c.day),sc=parseSched(t.detail&&t.detail.scheduled);
  put(m,esc(projName(c.pid))+' · '+esc(ddl(c.day))+(sc?', '+esc(sc.time):'')+(t.channel?' · '+mkChan(t):'')+' <span class="lz '+st[0]+'">'+esc(st[1])+'</span>');
  const pr=edPrimary(t,d,ED.tab);
  if(pr&&canShare()&&d&&d.ok)shareFile(c.pid,c.day,d);          /* telefon: plik gotowy przed kliknięciem */
  put(a,(pr?'<button type="button" class="btn sm" '+pr.attr+'>'+esc(pr.n)+'</button>':'')+edMenu(t,d));
  const nx=t.state==='done'?'':sc?'Panel opublikuje post '+ddl(sc.day)+', '+sc.time+'.':
    t.needsYou==='zgoda'?'Obejrzyj post i zatwierdź. Potem go udostępnisz.':d&&d.ok?'Po publikacji oznacz post w menu ⋯.':'';
  put(document.getElementById('ed-next'),nx?esc(nx):'');
  const pl=document.getElementById('ed-plan');
  if(pl){const want=chList(t);
    put(pl,t.state!=='done'&&d&&d.ok&&LIVE&&D.publish&&PUBCH.some(([x])=>want.includes(x))?'<details class="ed-pl"'+(A.edPl?' open':'')+'><summary>Publikacja automatyczna</summary>'+pubPlanBox(t,c.day,d)+'</details>':'')}
}
function edFill(){
  if(!ED.cur)return;const c=ED.cur,d=PD[c.pid+'|'+c.day],v=document.getElementById('ed-view');if(!v)return;
  const t=D.tasks.find(x=>x.id===c.tid)||{channel:''},tabs=pvPlats(t,d);
  if(!tabs.some(x=>x[0]===ED.tab))ED.tab=tabs[0][0];
  const tb=document.getElementById('ed-tabs'),th=tabs.map(([k,n])=>'<button type="button" role="tab" class="seg" data-edtab="'+k+'" aria-selected="'+(ED.tab===k)+'">'+n+'</button>').join('');
  if(tb.dataset.h!==th){tb.innerHTML=th;tb.dataset.h=th}
  tb.hidden=tabs[0][0]==='sp-gen';
  edActs();
  const st=document.getElementById('ed-st');
  if(!d||!d.ok){delete v.dataset.sp;v.innerHTML='<p class="muted">'+(d?'Agent jeszcze nie przygotował tego posta.':'Wczytuję post…')+'</p>';if(st)st.innerHTML='';edSide(d);edChat();return}
  const x=PVF[ED.tab](c,d);
  if(v.dataset.sp!==x){v.innerHTML=x;v.dataset.sp=x;const vid=v.querySelector('video');if(vid)edBindVideo(vid)}   /* bez przeładowania filmu, gdy nic się nie zmieniło */
  const r=d.rec||{},run=r.state==='running'||r.state==='queued';
  if(st)st.innerHTML=run?'Nagrywam nową wersję filmu… (2–4 min)':r.state==='error'?'<span class="warn">Ostatnie nagranie nie wyszło: '+esc(r.error||'')+'</span>':'';
  edSide(d);cxFill();edChat();
}
/* sekcja post.md edytowana na zakładce (własna platformy) i ta, z której opis jest teraz brany */
function edSecOf(d,k){
  const S=d.sections||{},src=(SPCHAIN[k]||[]).find(n=>S[n])||'';
  const own=k==='sp-gen'?src||'Facebook':SPN[k][2];
  return [own,src||own];
}
const EDLIM={'sp-ig':2200,'sp-tt':2200,'sp-li':3000};
function edEdit(d){
  const k=ED.tab,[own,src]=edSecOf(d,k),S=d.sections||{},text=S[own]||S[src]||'',shared=own!==src&&!S[own]&&!!S[src],lim=EDLIM[k];
  return '<h3><label for="ed-ta">'+(k==='sp-gen'?'Opis':'Opis: '+esc(SPN[k][0]))+'</label></h3>'+
    (shared?'<p class="note">Teraz wspólny z: '+esc(src)+'. Po zapisaniu '+esc(SPN[k][0])+' dostanie własny opis.</p>':'')+
    '<textarea class="fi ed-ta" id="ed-ta" rows="8" maxlength="5000" data-edtxt data-sec="'+esc(own)+'" data-old="'+esc(S[own]||'')+'"'+(lim?' data-lim="'+lim+'"':'')+'>'+esc(text)+'</textarea>'+
    '<div class="row"><button type="button" class="btn sec sm" data-edsave disabled>Zapisz opis</button><span class="muted ed-cnt" id="ed-cnt">'+text.length+(lim?' / '+lim:'')+' znaków</span></div>';
}
function edMedia(d){
  const c=ED.cur,k=c.pid+'|'+c.day;
  if(d.film||d.scenario)return '<h3>Film</h3><p class="note">'+(d.film?esc(d.film.name)+' · '+(d.film.size/1048576).toFixed(1).replace('.',',')+' MB':'Filmu jeszcze nie ma.')+'</p>'+
    '<ol class="ed-sc" id="ed-sc" aria-label="Sceny filmu"></ol><p class="note" id="ed-hint" hidden>Kliknij scenę, a potem napisz w „Co poprawić?”, co w niej zmienić.</p>'+
    '<div class="row"><label class="btn sec sm fup">'+(A.film===c.tid?'Wysyłam…':d.film?'Zmień film':'Dodaj film')+'<input type="file" accept="video/mp4,video/quicktime" data-film="'+esc(k)+'" data-id="'+esc(c.tid)+'" hidden></label></div>';
  return '<h3>Grafika</h3>'+(d.image?'':'<p class="note">Post nie ma grafiki.</p>')+
    '<div class="row"><label class="btn sec sm fup">'+(A.gfx?'Wysyłam…':d.image?'Zmień grafikę':'Dodaj grafikę')+'<input type="file" accept="image/png,image/jpeg" data-edimg="'+esc(k)+'" hidden></label></div>';
}
function edSide(d){
  const tx=document.getElementById('ed-txt'),md=document.getElementById('ed-med');if(!tx||!md)return;
  const put=(el,x)=>{if(el.dataset.h!==x){el.innerHTML=x;el.dataset.h=x}};
  if(!d||!d.ok){put(tx,'');put(md,'');return}
  const ta=tx.querySelector('textarea');
  if(!(ta&&ta.value!==ta.defaultValue&&ta.dataset.tab===ED.tab)){put(tx,edEdit(d));const n=tx.querySelector('textarea');if(n)n.dataset.tab=ED.tab}   /* nie nadpisuj niezapisanej zmiany */
  put(md,edMedia(d));
  edScenes();
}
function edInput(ta){
  const b=document.querySelector('#ed-txt [data-edsave]'),n=document.getElementById('ed-cnt'),lim=+ta.dataset.lim||0;
  if(b)b.disabled=ta.value===ta.defaultValue;
  if(n){n.textContent=ta.value.length+(lim?' / '+lim:'')+' znaków';n.classList.toggle('warn',!!lim&&ta.value.length>lim)}
}
async function edSaveText(){
  const c=ED.cur,ta=document.querySelector('#ed-txt textarea');if(!c||!ta)return;
  if(!LIVE){say(PRV);return}
  if(ta.value===ta.defaultValue){say('Bez zmian.');return}
  const sec=ta.dataset.sec,x=await post('/api/post/tekst',{project:c.pid,date:c.day,section:sec,text:ta.value,old:ta.dataset.old});
  if(x.status===401)return;
  if(x.ok){ta.defaultValue=ta.value;say('Opis zapisany.');delete PD[c.pid+'|'+c.day];await loadPost(c.pid,c.day);return}
  if(x.status===409){await loadPost(c.pid,c.day);const d=PD[c.pid+'|'+c.day],n=document.querySelector('#ed-txt textarea');
    if(n&&d&&d.ok)n.dataset.old=(d.sections||{})[sec]||'';say('Opis zmienił się w międzyczasie (np. poprawił go agent). Twoja wersja jest w polu: zapisz ją ponownie albo odśwież.',12000);return}
  say(failMsg(x,'Nie zapisano opisu.'));
}
async function edImgUp(el){
  const file=el.files&&el.files[0];if(!file)return;const [pid,day]=el.dataset.edimg.split('|');
  if(!LIVE){say(PRV);return}
  if(!/^image\/(png|jpeg)$/.test(file.type)){say('Grafika: plik PNG albo JPG.');return}
  if(file.size>15*1048576){say('Grafika: najwyżej 15 MB.');return}
  A.gfx=true;edFill();say('Wysyłam grafikę…');
  let ok=false,msg='';
  try{const r=await fetch('/api/post/grafika?project='+encodeURIComponent(pid)+'&date='+encodeURIComponent(day),{method:'POST',headers:{'Content-Type':file.type},body:file});
    if(r.status===401){location.assign('/wejscie');return}
    const j=await r.json().catch(()=>({}));ok=r.ok&&j.ok!==false;msg=j.error||''}catch(e){msg='brak połączenia'}
  A.gfx=false;delete SF[pid+'|'+day];delete PD[pid+'|'+day];await loadPost(pid,day);
  say(ok?'Grafika zmieniona.':'Nie zapisano grafiki'+(msg?': '+msg:'')+'.');
}
/* „Udostępnij na …”: publikacja przez API (z potwierdzeniem), Instagram przez rozszerzenie, inaczej strona tworzenia posta
   w nowej karcie, opis w schowku i pliki pobrane; publikuje właściciel na platformie */
const SPURL={'sp-ig':()=>'https://www.instagram.com/','sp-fb':(d,tx,t)=>d.film&&chList(t).includes('reels')?'https://business.facebook.com/latest/reels_composer':'https://business.facebook.com/latest/composer',
  'sp-li':(d,tx)=>'https://www.linkedin.com/feed/?shareActive=true&text='+encodeURIComponent(tx),'sp-tt':()=>'https://www.tiktok.com/tiktokstudio/upload','sp-gen':()=>''};
function edGo(k){
  const c=ED.cur,t=c&&D.tasks.find(x=>x.id===c.tid),d=c&&PD[c.pid+'|'+c.day];if(!t||!d||!d.ok||!SPN[k])return;
  if(!LIVE){say(PRV);return}
  const api=edApi(t,k,d);
  if(api.length){
    if(!confirm('Opublikować teraz '+SPN[k][1]+'? Panel wyśle post od razu przez połączone konto ('+api.map(x=>PUBN[x]).join(', ')+').'))return;
    enqueue(async()=>{const x=await post('/api/publikacja/plan',{id:t.id,title:t.title,channels:api,now:true});
      say(x.ok?'Publikuję '+SPN[k][1]+'. Wynik przyjdzie w powiadomieniu i pojawi się w zadaniu.':failMsg(x,'Nie opublikowano.'))});
    return}
  if(k==='sp-ig'&&igCan(t)){igShare(t.id);return}
  edManual(t,d,k);
}
async function edManual(t,d,k){
  const c=ED.cur,text=spCap(d,k),done=()=>edMark(t.id,'done');
  /* telefon: systemowe udostępnianie z plikiem (aplikacja platformy); opis też w schowku */
  if(canShare()&&matchMedia('(pointer:coarse)').matches){const f=SF[c.pid+'|'+c.day],data={text:text};if(f&&navigator.canShare({files:[f]}))data.files=[f];
    copyText(text);
    try{await navigator.share(data);sayBtn('Gotowe. Opis jest też w schowku.','Oznacz jako opublikowane',done,15000)}
    catch(e){if(e&&e.name!=='AbortError')say('Nie udało się udostępnić: '+(e.message||e))}
    return}
  const url=SPURL[k](d,text,t),p=text?copyText(text):Promise.resolve(false);
  if(url)window.open(url,'_blank','noopener');
  const ok=await p,n=edGet(c,d);
  sayBtn((ok?'Opis skopiowany':text?'Nie skopiowano opisu (skopiuj go z pola Opis)':'Post nie ma opisu')+(n?', pliki pobrane':'')+(url?' — wklej i dodaj.':'.'),'Oznacz jako opublikowane',done,15000);
}
/* pliki posta do pobrania: film albo grafika i zdjęcia; liczba plików */
function edGet(c,d){
  const q=postQ(c.pid,c.day),base=d.folder||'post',L=[];
  if(d.film)L.push(['/api/post/film?'+q,base+(/\.mov$/i.test(d.film.name)?'.mov':'.mp4')]);
  else{if(d.image)L.push(['/api/post/grafika?'+q,base+'.png']);
    (d.photos||[]).forEach(n=>L.push(['/api/media/plik?project='+encodeURIComponent(c.pid)+'&path='+encodeURIComponent('posty/'+d.folder+'/'+n),n]))}
  L.forEach(([u,n],i)=>setTimeout(()=>{const a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove()},i*400));
  return L.length;
}
/* oznaczenie publikacji (zadanie w pliku kampanii [x] albo [ ]) z „Cofnij” w komunikacie */
function edMark(id,st){
  const t=D.tasks.find(x=>x.id===id);if(!t)return;if(!LIVE){say(PRV);return}
  if(st==='done'&&(needsResult(t)||needsCount(t))){if(ED.cur)closeEditor();openForm(t.id,'done');return}
  if(t.state===st)return;
  const prev=t.state,ref=refOf(t);
  patchTask(t.id,{state:st});
  sayUndo(st==='done'?'Oznaczono jako opublikowane.':'Oznaczono jako nieopublikowane.',()=>{const x=findTask(ref,true);if(x)patchTask(x.id,{state:prev})});
}
function edBindVideo(vid){
  const upd=()=>{const t=vid.currentTime,i=ED.srt?ED.srt.findIndex(x=>t>=x.a&&t<x.b):-1;if(i!==ED.scene){ED.scene=i;document.querySelectorAll('#ed-sc li').forEach((li,n)=>li.classList.toggle('on',n===i))}};
  vid.addEventListener('timeupdate',upd);
  vid.addEventListener('pause',()=>{ED.at=vid.currentTime;upd();edAt()});
  vid.addEventListener('play',()=>{ED.at=null;edAt()});
}
async function edSrt(){
  const c=ED.cur;if(!c)return;
  try{const r=await fetch('/api/post/napisy?'+postQ(c.pid,c.day),{cache:'no-store'});if(r.ok){const tx=await r.text();

function apCards(){

  AS.messages.forEach((m,mi)=>{if(m.role==='claude')last=mi;if(m.role!=='claude'||!m.cards)return;const at=String(m.at||'');
    (m.cards.pokaz||[]).forEach((c,i)=>{const prev=ses[c.id];ses[c.id]={c:c.typ?c:(prev&&prev.c.typ?prev.c:c),at:at,n:mi*100-i,mi:mi,gone:false}});
    (m.cards.usun||[]).forEach(id=>{if(ses[id])ses[id].gone=true})});

  const pins=AS.lib.przypiete,out=[],seen={};

  Object.keys(ses).filter(id=>!ses[id].gone&&!hid(id)&&pins.indexOf(id)<0).sort((a,b)=>ses[b].n-ses[a].n).forEach(id=>add(id,false));
  pins.forEach(id=>add(id,true));

  if(hasN&&nm){const c=campOf(t);if(c){c.counters[nm]=(c.counters[nm]||0)+count;if(String(c.counterMetric||c.metric||'').trim().toLowerCase()===nm)c.result=Math.max(+c.result||0,c.counters[nm])}}

    const b=await post('/api/task/state',body);

/* częste odświeżanie (co 3 s): agenci, aktywność i uruchomienia bez pełnego przeliczenia. FX (facts) trzyma modele
   zależne od aktywności (Blokady: bkWork, bkModel, bkPanelDoes; Teraz: nw_*), więc zerujemy go — inaczej do 60 s
   Blokady pokazywałyby stare „nagrywa się film” i licznik „Twoje wstrzymują” */
function applyAgents(raw){
  FX=null;
  D.agents=normAgents(raw.agents);D.activity=normActivity(raw.activity);D.generatedAt=raw.generatedAt||D.generatedAt;D.stale=raw.stale&&typeof raw.stale==='object'?raw.stale:null;
  const m={};(raw.tasks||[]).forEach(z=>{m[z.id+'\n'+z.title]=z});
  D.tasks.forEach(t=>{const z=m[t.id+'\n'+t.title];if(z){t.runId=z.runId||'';t.runBlock=z.runBlock||''}});
  if(raw.pmNote)D.pmNote={date:raw.pmNote.date,text:String(raw.pmNote.text||''),at:typeof raw.pmNote.at==='string'?raw.pmNote.at:''};
  render();
}

let VER='';
function newVersion(v){
  v=typeof v==='string'?v:'';
  if(!v)return false;
  if(!VER){VER=v;return false}
  if(v===VER)return false;
  if(editing()||pending||(DR&&DR.form)){if(!A.verSaid){A.verSaid=1;say('Jest nowa wersja panelu. Przeładuje się, gdy skończysz edycję.')}return false}
  location.reload();return true;
}
/* brak połączenia (fetch, status, JSON) to „offline”; błąd przy rysowaniu już nie: licznik odświeżania ustawia się zawsze */
async function load(force){
  clearTimeout(timer);
  const seq=++loadSeq;let arm=true;
  try{
    let raw;
    try{
      const r=await fetch('/api/data',{cache:'no-store'});
      if(r.status===401){arm=false;location.assign('/wejscie');return}
      if(!r.ok){const e=new Error(r.status);e.status=r.status;throw e}
      raw=await r.json();
    }catch(e){
      if(seq!==loadSeq){arm=false;return}
      /* 5xx: serwer działa, ale nie zbudował danych (inny komunikat niż brak sieci) */
      offline=true;srvErr=e&&e.status>=500?e.status:0;idle();
      if(D)render();else $('#view').innerHTML='<div class="banner bad">'+offBanner()+'</div>';
      return;
    }
    if(seq!==loadSeq){arm=false;return}
    if(newVersion(raw.panelVersion)){arm=false;return}
    const sig=restSig(raw),hold=force!==true&&(editing()||pending),was=offline;
    idle();offline=false;srvErr=0;
    if(D&&(hold||(force!==true&&sig===A.sig&&Date.now()-A.fullAt<60000))){applyAgents(raw);if(was)renderTop()}
    else{D=normalize(raw);D.stale=raw.stale&&typeof raw.stale==='object'?raw.stale:null;A.sig=sig;A.fullAt=Date.now();render(force===true)}
    if(ED.cur){edChat();const c=ED.cur,k=c.pid+'|'+c.day,pd=PD[k];
      if(pd&&pd.rec&&(pd.rec.state==='running'||pd.rec.state==='queued'||D.tasks.some(t=>t.project===c.pid&&t.title.indexOf('Popraw post na '+c.day)===0&&t.state!=='done'))){delete PD[k];loadPost(c.pid,c.day)}}
  }catch(e){console.error(e)}
  finally{
    if(arm){let busy=0;try{busy=D?nwBusy():0}catch(e){}
      timer=setTimeout(load,D&&D.cal&&D.cal.connecting?2000:busy===2?3000:D&&(editing()||pending)?15000:busy===1?20000:60000)}
  }
}

  const ti=f.querySelector('[name="title"]');if(!ti)return;const v=ti.value;
  if(f.dataset.addp){const d=f.querySelector('[name="dest"]').value,dest=d.slice(0,2)==='s:'?{stage:d.slice(2)}:{};ti.value='';addTask(f.dataset.addp,dest,v);ti.focus()}
  else if(f.dataset.addc){ti.value='';addTask(f.dataset.pid,{campaign:f.dataset.addc},v);ti.focus()}
});

  /* Projekty, formularz „Nowy projekt”: wartości przetrwają przerysowanie widoku; aria-invalid znika przy wpisywaniu */
