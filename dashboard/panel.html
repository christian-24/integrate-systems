<title>Panel projektów</title>
<style>
/* Pulpit projektów: panel boczny (widoki + lista projektów z wyszukiwarką), obszar główny, szuflada szczegółów.
   Wygląd według ksiega/pulpit-projektow.html, dane z /api/data. Kontrakt: dashboard/PULPIT.md. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --sunk:#f0f2f5; --hover:#eef1f6; --line:#dde1e7; --line-2:#c9ced8;
  --ink:#1d2433; --ink-2:#465163; --ink-3:#5a6577; --accent:#2563c9; --accent-ink:#ffffff; --accent-soft:#e3ecfb;
  --l-grey-bg:#e4e7ec; --l-grey:#3b4454; --l-blue-bg:#dbe7fd; --l-blue:#1d4fa8; --l-green-bg:#d9f5e1; --l-green:#176a32;
  --l-yellow-bg:#fff0bf; --l-yellow:#6e4d00; --l-red-bg:#ffe1de; --l-red:#a8281a; --l-purple-bg:#ebe3ff; --l-purple:#5636b8;
  --bar-done:#2a8a4a; --bar-rev:#7c5cd6; --bar-wip:#2563c9; --bar-warn:#b07d00;
  --c1:#2a78d6; --c2:#eb6834; --c3:#138a60; --c4:#b57b00; --c5:#c4527f; --c6:#4f9a2c; --c7:#6250d6; --c8:#d63f3f;
  --s1:#86b6ef; --s2:#5598e7; --s3:#2a78d6; --s4:#184f95;
  --scrim:rgba(9,15,30,.35);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --who-claude:#a9542f; --who-codex:#3f7d5c; --who-ty:#5636b8; --who-none:#646e7f; --who-ink:#ffffff;
  --r:6px; --side:248px; --card-line:transparent; --col-bg:var(--sunk);
  /* system wyglądu: promienie, odstępy, czcionki, kontrolki, cienie, media, awatary */
  --r-sm:4px; --r-lg:8px; --r-pill:999px;
  --g-s:8px; --g-m:12px; --g-l:20px;
  --fs-xs:12px; --fs-sm:13px; --fs-md:14px; --fs-lg:15px; --fs-xl:18px; --fs-h1:22px;
  --ctl-line:#7d8696; --ctl-h:32px; --ctl-h-sm:26px;
  --shadow-1:0 1px 1px rgba(9,30,66,.08); --shadow-2:0 6px 18px rgba(9,15,30,.18);
  --media-bg:#000000; --on-color:#ffffff;
  --av1:#2368c4; --av2:#eb6834; --av3:#1baf7a; --av4:#eda100; --av5:#e87ba4; --av6:#3f7f22; --av7:#6250d6; --av8:#c93636;
  --av-ink1:#ffffff; --av-ink2:#2b1000; --av-ink3:#0b2a1f; --av-ink4:#2b1d00; --av-ink5:#3a0f22; --av-ink6:#ffffff; --av-ink7:#ffffff; --av-ink8:#ffffff;
  /* podgląd posta na platformach (Instagram, Facebook, TikTok) */
  --sp-bg:#ffffff; --sp-ink:#0f1419; --sp-ink-2:#65676b; --sp-line:#dbdbdb; --sp-dot:#c7c7c7; --sp-dot-on:#0095f6; --sp-shade:rgba(0,0,0,.55); --sp-chip:rgba(0,0,0,.6);
  accent-color:var(--accent);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171c; --surface:#1d2027; --sunk:#22262e; --hover:#262a33; --line:#30353f; --line-2:#3d4350;
  --ink:#e7e9ee; --ink-2:#b9bfca; --ink-3:#9aa2b0; --accent:#6b9ef0; --accent-ink:#0f1420; --accent-soft:#1f2c45;
  --l-grey-bg:#2f343e; --l-grey:#c9ced8; --l-blue-bg:#1d3157; --l-blue:#a9c6ff; --l-green-bg:#173a25; --l-green:#8fe0a8;
  --l-yellow-bg:#3d3112; --l-yellow:#f3cf6b; --l-red-bg:#45201d; --l-red:#ffaaa0; --l-purple-bg:#2f2550; --l-purple:#c9b6ff;
  --bar-done:#4cb46c; --bar-rev:#a08af0; --bar-wip:#6b9ef0; --bar-warn:#e0aa2a;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#4f9e34; --c7:#9085e9; --c8:#e05a5a;
  --s1:#184f95; --s2:#2a78d6; --s3:#5598e7; --s4:#86b6ef;
  --scrim:rgba(0,0,0,.5);
  --who-claude:#a9542f; --who-codex:#3b7656; --who-ty:#6a4fc9; --who-none:#5d6675; --who-ink:#ffffff;
  --ctl-line:#6b7382; --card-line:transparent; --col-bg:var(--bg); --shadow-1:none; --shadow-2:0 8px 24px rgba(0,0,0,.5); --media-bg:#000000; --on-color:#ffffff;
  --sp-bg:#000000; --sp-ink:#f5f5f5; --sp-ink-2:#a8a8a8; --sp-line:#363636; --sp-dot:#555555; --sp-dot-on:#0095f6; --sp-shade:rgba(0,0,0,.55); --sp-chip:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171c; --surface:#1d2027; --sunk:#22262e; --hover:#262a33; --line:#30353f; --line-2:#3d4350;
  --ink:#e7e9ee; --ink-2:#b9bfca; --ink-3:#9aa2b0; --accent:#6b9ef0; --accent-ink:#0f1420; --accent-soft:#1f2c45;
  --l-grey-bg:#2f343e; --l-grey:#c9ced8; --l-blue-bg:#1d3157; --l-blue:#a9c6ff; --l-green-bg:#173a25; --l-green:#8fe0a8;
  --l-yellow-bg:#3d3112; --l-yellow:#f3cf6b; --l-red-bg:#45201d; --l-red:#ffaaa0; --l-purple-bg:#2f2550; --l-purple:#c9b6ff;
  --bar-done:#4cb46c; --bar-rev:#a08af0; --bar-wip:#6b9ef0; --bar-warn:#e0aa2a;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#4f9e34; --c7:#9085e9; --c8:#e05a5a;
  --s1:#184f95; --s2:#2a78d6; --s3:#5598e7; --s4:#86b6ef;
  --scrim:rgba(0,0,0,.5);
  --who-claude:#a9542f; --who-codex:#3b7656; --who-ty:#6a4fc9; --who-none:#5d6675; --who-ink:#ffffff;
  --ctl-line:#6b7382; --card-line:transparent; --col-bg:var(--bg); --shadow-1:none; --shadow-2:0 8px 24px rgba(0,0,0,.5); --media-bg:#000000; --on-color:#ffffff;
  --sp-bg:#000000; --sp-ink:#f5f5f5; --sp-ink-2:#a8a8a8; --sp-line:#363636; --sp-dot:#555555; --sp-dot-on:#0095f6; --sp-shade:rgba(0,0,0,.55); --sp-chip:rgba(0,0,0,.6);
  color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
/* ===== SYSTEM WYGLĄDU: zasady wspólne dla wszystkich widoków (klasy niżej, pomocnicze funkcje ds* w skrypcie) =====
 1. Nagłówek strony (.pagehead): h1 (+ .hcnt z licznikiem) i najwyżej jedno zdanie-wniosek w p; opis ekranu w title na h1.
    Po prawej .toolbar (filtr z <label>, na telefonie pod h1 na całą szerokość) albo akcje. Między nagłówkiem a treścią nic luzem.
 2. Treść zawsze w section.panel > h2. W h2 small tylko liczby i jeden link nawigacyjny „Nazwa →” (.navlk).
    Instrukcje i opis mechanizmu do title albo <details class="ds-det"> „Jak to działa”. Akcje poza h2 (wyjątek: przycisk zwijania).
 3. Przyciski: jeden główny .btn na sekcję, formularz albo szufladę; w wierszach list tylko .btn.sec.sm.
    Decyzja właściciela .btn.dec (ramka --l-purple), nieodwracalne .btn.danger. Wysokość: .btn i .fi 32 px, .btn.sm 26 px, telefon 40 px.
 4. Znaczniki: .lz = stan, zwykła wielkość liter, 600. Kolor tylko dla stanów wymagających uwagi: red po terminie, zablokowane,
    błąd; yellow do sprawdzenia, czeka; purple Twoja decyzja; blue trwa. Atrybuty (priorytet, rodzaj, kto) jako tekst .muted
    albo .lz.out. .lz.caps tylko dla stanów krytycznych. .pill = status w pasku (informacja), .chip = filtr (klikalny).
 5. Puste stany: .empty z konkretnym zdaniem, co jest puste (dsEmpty), z uwagą o aktywnym filtrze.
 6. Komunikaty: .banner ok/warn/bad z kropką .dot. Jedno źródło komunikatu z akcją (np. logowanie Claude w Teraz i Agentach,
    .lg-ban), w innych miejscach krótki odsyłacz.
 7. Odstępy tylko przez gap rodzica (--g-s 8, --g-m 12, --g-l 20). Promienie: --r 6 pola i przyciski, --r-lg 8 karty i ramki,
    --r-pill pigułki. Typografia: --fs-xs 12, --fs-sm 13, --fs-md 14, --fs-lg 15, --fs-xl 18, --fs-h1 22; wagi 400/600/650.
 8. Kolory wyłącznie z tokenów (:root i oba bloki ciemne): --shadow-1/2, --media-bg, --on-color, --avN/--av-inkN, --ctl-line
    (obramowanie kontrolek, ≥3:1). --line i --line-2 tylko dla podziałek.
 9. Linki: w tekście accent z podkreśleniem; nawigacyjne do widoku .navlk (accent, 600, „Nazwa →”). Linki do encji (projekt)
    w kolorze tekstu, podkreślenie przy hover i fokusie.
10. Długie listy: dsCut/dsMore („Pokaż wszystkie (N)”, aria-expanded i aria-controls, stan w PF.more). Opisy: .clamp2
    (2 wiersze), pełny tekst w szufladzie albo na stronie szczegółu; title tylko jako dodatek (nie działa na dotyku).
11. Telefon (≤620 px): siatki minmax(0,1fr), cele dotyku ≥40 px, okruszki ukryte, dolny pasek z „Więcej” (do 820 px),
    scroll-padding pod pasek. .sr-only dla tekstu tylko dla czytnika (liczniki z jednostką).
12. Nowe klasy z unikalnym prefiksem; testy/test_wyglad.py wykrywa tę samą klasę w dwóch komponentach. */
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px;padding:0;border:0}
.sk-skip{position:absolute;left:8px;top:-60px;z-index:50;background:var(--surface);color:var(--accent);border:2px solid var(--accent);border-radius:var(--r);padding:8px 12px;font-weight:600;text-decoration:none}
.sk-skip:focus{top:8px}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.navlk,.panel>h2 small a,.nw-foot a,.nw-sub small a{color:var(--accent);font-weight:600;text-decoration:none}
.navlk:hover,.panel>h2 small a:hover,.nw-foot a:hover,.nw-sub small a:hover,.navlk:focus-visible{text-decoration:underline}
.enlk{color:var(--ink);text-decoration:none}
.enlk:hover,.enlk:focus-visible{color:var(--accent);text-decoration:underline}
/* wiersz akcji: wspólny dla wszystkich widoków (zakresowe .x .row niżej tylko go uzupełniają) */
.row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;min-width:0}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
code{font:12.5px/1.45 var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:0 5px;overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)} .soft{color:var(--ink-2)}

.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
/* panel boczny */
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden}
.side>*{min-width:0}
.side-proj{display:grid;gap:var(--g-s);grid-template-columns:minmax(0,1fr)}
.side-empty{padding:4px 8px;font-size:var(--fs-sm)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .mark{width:28px;height:28px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.brand b{font-size:15px;display:block;line-height:1.2}
.brand small{font-size:12px;color:var(--ink-3)}
.nav{display:grid;gap:2px}
.nav a,.plist a{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--r);color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover,.plist a:hover{background:var(--hover);color:var(--ink)}
.nav a[aria-current="page"],.plist a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:16px;height:16px;flex:none}
.nav .count{margin-left:auto;flex:none;font-size:12px;font-weight:600;background:var(--l-purple-bg);color:var(--l-purple);border-radius:10px;padding:0 7px}
.nav .count.blue{background:var(--l-blue-bg);color:var(--l-blue)}
.sidehead{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:0 8px;display:flex;justify-content:space-between}
.search{position:relative;display:block}
.search input{width:100%;min-width:0;border:1px solid var(--ctl-line);background:var(--surface);border-radius:var(--r);padding:6px 10px 6px 30px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink-3)}
.plist{display:grid;gap:1px;grid-template-columns:minmax(0,1fr)}
.plist a{min-width:0}
.plist .av{width:22px;height:22px;font-size:10px}
.plist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .ph{font-size:11px;color:var(--ink-3);white-space:nowrap}
.sidefoot{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;padding:0 6px}
.av{width:28px;height:28px;border-radius:var(--r);display:grid;place-items:center;font-weight:700;color:var(--on-color);font-size:11px;flex:none;letter-spacing:.02em}
.av.sm{width:18px;height:18px;font-size:10px;border-radius:var(--r-sm)}

/* obszar główny */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;padding:12px 24px;padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.crumbs{font-size:13px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.crumbs a{color:var(--ink-3);text-decoration:none}
.crumbs a:hover{color:var(--accent);text-decoration:underline}
.tstat{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.content{padding:20px 24px 40px;padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:var(--g-l);max-width:1320px;width:100%;align-content:start}
.content:focus{outline:none}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--g-m)}
.pagehead>*{min-width:0}
.pagehead>.ph-main{flex:1 1 320px}
.pagehead h1{font-size:var(--fs-h1);font-weight:650}
.pagehead h1:focus,.ptitle h1:focus{outline:none}
.pagehead p{color:var(--ink-3)}
.pagehead .toolbar{justify-content:flex-end}
.mobilenav{display:none}
.banners{display:grid;gap:8px;padding:0 24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.banners:empty{display:none}
.banners>div:first-child{margin-top:12px}
.banner{border:1px solid var(--line-2);border-radius:var(--r-lg);padding:9px 14px;background:var(--surface);color:var(--ink-2);overflow-wrap:anywhere}
.banner>.dot{margin-right:6px;vertical-align:middle}
.banner.ok{border-color:var(--bar-done)}
.banner.bad{border-color:var(--l-red);background:var(--l-red-bg);color:var(--l-red)}
.banner.warn{border-color:var(--l-yellow);background:var(--l-yellow-bg);color:var(--l-yellow)}

/* plakietki, przyciski, pola */
.lz{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r-sm);padding:1px 6px;font-size:var(--fs-xs);font-weight:600;white-space:nowrap;line-height:18px}
.lz.caps{text-transform:uppercase;letter-spacing:.03em;font-weight:700;font-size:11px}
.lz.grey{background:var(--l-grey-bg);color:var(--l-grey)} .lz.blue{background:var(--l-blue-bg);color:var(--l-blue)}
.lz.green{background:var(--l-green-bg);color:var(--l-green)} .lz.yellow{background:var(--l-yellow-bg);color:var(--l-yellow)}
.lz.red{background:var(--l-red-bg);color:var(--l-red)} .lz.purple{background:var(--l-purple-bg);color:var(--l-purple)}
.lz.out{background:transparent;border:1px solid var(--line-2);color:var(--ink-2);line-height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r-pill);padding:2px 10px;font-size:var(--fs-sm);color:var(--ink-2);white-space:nowrap;background:var(--surface)}
.pill b{font-weight:600;color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--bar-done)} .dot.warn{background:var(--bar-warn)} .dot.bad{background:var(--l-red)} .dot.you{background:var(--bar-rev)} .dot.off{background:var(--line-2)} .dot.run{background:var(--bar-wip)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:5px 12px;min-height:var(--ctl-h);line-height:20px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--ctl-line)}
.btn.sec:hover{background:var(--hover);filter:none}
.btn.sm{padding:2px 9px;min-height:var(--ctl-h-sm);font-size:var(--fs-sm)}
.btn.dec{border-color:var(--l-purple)}
.btn.danger,.btn.sec.danger{background:var(--l-red-bg);color:var(--l-red);border-color:var(--l-red)}
.btn.danger:hover{filter:brightness(.97)}
.btn[disabled],.btn[aria-disabled="true"]{background:var(--sunk);color:var(--ink-3);border-color:var(--line-2);cursor:default;filter:none}
.lk{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left;overflow-wrap:anywhere}
.lk:hover{color:var(--accent);text-decoration:underline}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13px;font-weight:600;justify-self:start}
.fi{border:1px solid var(--ctl-line);background:var(--surface);border-radius:var(--r);padding:5px 9px;line-height:20px;min-width:0;max-width:100%}
select.fi,input.fi:not([type=checkbox]):not([type=radio]){min-height:var(--ctl-h)}
.fi.sm{min-height:var(--ctl-h-sm);padding:2px 8px}
.fi::placeholder{color:var(--ink-3)}
textarea.fi{resize:vertical;width:100%}
.sw{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ctl-line);background:var(--surface);border-radius:999px;padding:2px 10px 2px 4px;cursor:pointer;font-size:13px;color:var(--ink-2);white-space:nowrap}
.sw::before{content:"";width:28px;height:16px;border-radius:999px;background:radial-gradient(circle at 8px 8px,var(--ink-3) 0 5px,transparent 5.5px),var(--sunk);border:1px solid var(--line)}
.sw[aria-checked="true"]{color:var(--ink);border-color:var(--accent)}
.sw[aria-checked="true"]::before{background:radial-gradient(circle at 20px 8px,var(--accent-ink) 0 5px,transparent 5.5px),var(--accent)}

/* karty, panele */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);min-width:0}
.panel>h2{font-size:var(--fs-lg);font-weight:650;padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel>h2 small{font-size:var(--fs-xs);font-weight:500;color:var(--ink-3);display:inline-flex;align-items:center;gap:4px 8px;flex-wrap:wrap}
.pad{padding:0 16px 14px;display:grid;gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 16px;display:grid;gap:2px;min-width:0;text-decoration:none;color:inherit}
a.stat:hover{border-color:var(--line-2);background:var(--hover)}
.stat .l{font-size:13px;color:var(--ink-2);font-weight:500}
.stat .v{font-size:26px;font-weight:650;line-height:1.2}
.stat .d{font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.stat.red .v{color:var(--l-red)} .stat.purple .v{color:var(--l-purple)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.sys{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

/* listy */
.rows{list-style:none;margin:0;padding:0 16px 8px}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.rows li:first-child{border-top:0}
.rows .t{font-weight:500;display:block}
.rows .rmeta{font-weight:400}
.rows .s{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.rows .r{text-align:right;font-size:13px;white-space:nowrap;display:grid;gap:4px;justify-items:end}
.rows .r.late{color:var(--l-red);font-weight:650}
.rows a{color:inherit;text-decoration:none}
.rows a:hover .t{color:var(--accent);text-decoration:underline}
.empty{padding:12px 16px 16px;color:var(--ink-3)}
.empty.sm{padding:4px 6px;font-size:var(--fs-sm)}
.rows li.empty{display:block;padding:10px 0}
.pmn{padding:0 16px 14px;color:var(--ink-2)}
.pmn h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:10px 0 4px}
.pmn h3:first-child{margin-top:0}
.pmn ul{margin:0;padding-left:18px}
.pmn li{margin-top:3px}
.pmn b,.mdx b,.pmt b{font-weight:600;color:var(--ink-2)}

/* tabela projektów */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--ink-3);text-align:left;padding:8px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
th.num,td.num{text-align:right;white-space:nowrap}
td.warn{color:var(--l-yellow);overflow-wrap:anywhere}
.tw:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
tbody tr[data-go]{cursor:pointer}
tbody tr[data-go]:hover td{background:var(--hover)}
tbody tr[data-go]:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
tbody tr[data-go]:focus-visible td{background:var(--hover)}
.proj{display:flex;gap:10px;min-width:200px}
.proj b{display:block;font-size:14px}
.proj b a{color:var(--ink);text-decoration:none}
.proj b a:hover{color:var(--accent);text-decoration:underline}
.proj p{font-size:var(--fs-sm);color:var(--ink-3);max-width:48ch;line-height:1.4}
.proj.wk-proj{min-width:160px}
.proj.wk-proj b{align-self:center}
.wk-late{color:var(--l-red);font-weight:650}
.phase{display:grid;gap:4px;min-width:120px}
.phase .steps{display:flex;gap:3px}
.phase .steps i{height:6px;flex:1;border-radius:2px;background:var(--line)}
.phase .steps i.done{background:var(--ink-3)}
.phase .steps i.cur{background:var(--accent)}
.phase span{font-size:13px;font-weight:600}
.prog{display:grid;gap:4px;min-width:130px}
.track{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;display:flex;border:1px solid var(--ctl-line)}
.track i{height:100%;display:block}
.prog span{font-size:12px;color:var(--ink-2)}
.due b{display:block;font-size:13px;font-weight:600;white-space:nowrap}
.due span{font-size:12px;color:var(--ink-3)}
.due.late b{color:var(--l-red)}
.dt{font-size:13px}.dt th,.dt td{padding:6px 8px;text-align:right}.dt th:first-child,.dt td:first-child{text-align:left}
.mx td,.mx th{padding:8px 10px;font-size:13px}

/* strona projektu */
.phead{display:grid;gap:12px}
.ptitle{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.ptitle .av{width:40px;height:40px;font-size:14px;border-radius:8px}
.ptitle h1{font-size:22px;font-weight:650;overflow-wrap:anywhere}
.desc{max-width:75ch;color:var(--ink-2);font-size:15px}
.stepper{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.stepper button{all:unset;box-sizing:border-box;border-top:4px solid var(--line);padding-top:6px;font-size:12px;color:var(--ink-3);cursor:pointer;min-width:0}
.stepper button[disabled]{cursor:default}
.stepper button:not([disabled]):hover b{color:var(--accent)}
.stepper button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stepper b{display:block;font-size:13px;color:var(--ink-2);font-weight:600}
.stepper .done{border-color:var(--ink-3)}
.stepper .cur{border-color:var(--accent)}
.stepper .cur b{color:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 14px;display:grid;gap:2px;min-width:0}
.fact .l{font-size:12px;color:var(--ink-3);font-weight:500}
.fact .v{font-size:15px;font-weight:650;overflow-wrap:anywhere}
.fact .d{font-size:12px;color:var(--ink-3)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.tabs a{padding:8px 12px;color:var(--ink-2);text-decoration:none;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--accent);border-color:var(--accent)}

/* tablica */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.col{background:var(--col-bg);border-radius:var(--r-lg);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:120px;min-width:0}
.col h3{font-size:13px;font-weight:650;color:var(--ink-2);padding:4px 6px;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:8px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow-1);min-width:0}
.card:hover{border-color:var(--line-2);background:var(--hover)}
.card .tt{font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.card .meta{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;font-size:12px;color:var(--ink-3);min-width:0}

.card .foot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.who{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2)}
.who i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;color:var(--who-ink)}
.dl{font-size:12px;font-weight:600;white-space:nowrap}
.dl.late{color:var(--l-red)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .tb-cnt{margin-left:auto}
.pagehead .toolbar .tb-cnt{margin-left:0}
.toolbar select{border:1px solid var(--ctl-line);min-height:var(--ctl-h);background:var(--surface);border-radius:var(--r);padding:5px 10px;max-width:100%;min-width:0}
.addf{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addf .fi[name="title"]{flex:1;min-width:160px}
.addf select{max-width:100%}

/* etapy */
.stagelist{list-style:none;margin:0;padding:0 16px 8px}
.stagelist li{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.stagelist li:first-child{border-top:0}
.stagelist .nm b{display:block}
.stagelist .nm>span{font-size:12px;color:var(--ink-3)}

.tl{position:relative;height:22px;background:var(--sunk);border-radius:4px}
.tl .b{position:absolute;top:4px;bottom:4px;border-radius:3px}

/* księga */
.check{list-style:none;margin:0;padding:0 16px 8px}
.check>li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.check>li:first-child{border-top:0}

.qa>li{padding:12px 0;border-top:1px solid var(--line)}
.qa>li:first-child{border-top:0}

.qa .s{font-size:12.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qa form{display:flex;gap:8px;margin-top:8px;align-items:flex-start}
.qa textarea{flex:1;min-width:0;min-height:38px;resize:vertical;font:inherit;font-size:13.5px}
.qa .qa-ans{margin-top:6px;font-size:13.5px;color:var(--ink-2);border-left:3px solid var(--line-2);padding-left:8px}
.check .ic{width:18px;height:18px;margin-top:1px}
.check .f{font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.check ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.plan{padding:0 16px 14px}
.plan form{display:flex;gap:8px;align-items:flex-start}
.plan textarea{flex:1;min-width:0;min-height:44px;resize:vertical;font:inherit;font-size:14px}
.plan .ask{margin:12px 0 4px;font-size:13px;color:var(--ink-3)}
.plan .pmt{font-size:14px;line-height:1.5;margin:4px 0 8px}
.plan h3{font-size:12.5px;font-weight:600;color:var(--ink-3);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.03em}
.plan ul{list-style:none;margin:0;padding:0}
.plan li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.plan li:first-child{border-top:0}
.plan li label{display:flex;gap:10px;align-items:flex-start;flex:1;min-width:0;cursor:pointer}
.plan li input{margin-top:3px}
.plan .pp{font-size:12.5px;color:var(--ink-3)}
.plan .row{margin-top:10px}
.plan .pp.pp-note{margin-top:8px}
.plan .pp-sm{font-size:var(--fs-xs)}
.post{margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:var(--r-lg);display:grid;gap:10px}
.post img{width:100%;max-width:420px;border-radius:8px;border:1px solid var(--line)}
.cline{margin:6px 0 0;font-size:13.5px}
.kpis{display:flex;flex-wrap:wrap;gap:12px 28px}
.kpis>div{display:grid;gap:2px}
.kpis b{font-size:20px}
.kpis span:last-child{color:var(--ink-3);font-size:12.5px}
.ans{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0}
.ans dt{color:var(--ink-3)} .ans dd{margin:0}
.dbox .move{margin:4px 0 8px;font-size:13.5px}
.pubplan{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.pubplan h3,.pubc h3{margin:0;font-size:var(--fs-md)}
.pubplan .chk{display:inline-flex;gap:6px;align-items:center;font-size:13.5px}
.fup{cursor:pointer}
.pubc{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.pubc>div{min-width:0;border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;display:grid;gap:8px;align-content:start}
.pubc table{width:100%;table-layout:fixed;border-collapse:collapse}
.pubc td{padding:4px 0;vertical-align:middle}
.pubc td:first-child{width:38%;padding-right:8px;overflow-wrap:anywhere}
.pubc select,.pubc input{width:100%;max-width:100%;box-sizing:border-box}
.pubc .note{margin:0}
.pubc .steps{margin:4px 0 8px;padding-left:18px;font-size:13px;line-height:1.5;color:var(--ink-2)}
.pubc summary{cursor:pointer;font-size:13.5px;margin:6px 0}
.mtl{list-style:none;margin:0;padding:8px 16px 16px;display:grid;gap:0}
.tl-day{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.tl-day:last-child{border-bottom:0}
.tl-day.tl-now{margin:0 -16px;padding-left:16px;padding-right:16px;background:var(--accent-soft);box-shadow:inset 3px 0 var(--accent)}
.tl-day.tl-now .tl-date b{color:var(--accent)}
.tl-date{font-size:13.5px;padding-top:4px}
.tl-date b{display:block;font-size:15px}
.tl-date abbr{text-decoration:none}
.tl-items{display:grid;grid-template-columns:minmax(0,1fr);gap:12px 0}
.tl-card{border:0;border-radius:8px;overflow:hidden;background:transparent;display:grid;grid-template-columns:160px minmax(0,1fr);align-content:start}
.tl-items.tl-one{grid-template-columns:minmax(0,1fr)}
.tl-one .tl-card{grid-template-columns:160px minmax(0,1fr)}
.tl-card:hover{border-color:var(--line-2)}
.tl-card:has(.tl-body:hover){background:var(--hover)}
.tl-card.mk-err{border-color:var(--l-red)}
.tl-media{width:100%;aspect-ratio:9/16;max-height:360px;object-fit:cover;background:var(--media-bg);display:block}
img.tl-media{aspect-ratio:1/1;object-fit:cover}
.tl-one .tl-card>video.tl-media,.tl-one .mk-media{align-self:start}
.tl-ph{aspect-ratio:1/1;display:grid;place-items:center;color:var(--ink-2);font-size:13px;background:var(--sunk);padding:12px;text-align:center}
.mk-media{all:unset;cursor:pointer;display:block;min-width:0}
.mk-media:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mk-main{display:grid;align-content:start;min-width:0}
.tl-body{all:unset;cursor:pointer;display:grid;gap:6px;padding:10px 12px;font-size:13.5px;min-width:0}

.mk-ttl{display:block;overflow-wrap:anywhere}
.mk-pre{font-size:12px;margin-right:2px}
.mk-proj{display:grid;gap:2px;min-width:0;font-size:13px}
.mk-pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;max-width:calc(100% - 26px)}
.mk-ch{color:var(--ink-2);min-width:0}
.mk-why{margin:0 12px 8px;font-size:13px;color:var(--l-red);overflow-wrap:anywhere}
.mk-act{padding:0 12px 12px}
.mk-todo{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 16px;font-size:var(--fs-sm);color:var(--ink-2);padding:0 16px 4px}
.mk-todo p{margin:0}
.mk-cnt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.mk-cnt .lk{color:var(--accent);font-weight:600}

.mk-pub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.mk-wnav .btn{min-width:40px;min-height:40px;justify-content:center;font-size:16px}
.mk-next{padding:0 16px 16px}
.wk{font-size:14px;padding:0 6px}
.pvid{width:100%;max-height:520px;border-radius:var(--r-lg);background:var(--media-bg)}
.filmb,.fixb{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}

.stu-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:0;font-size:13px;color:var(--ink-2)}
.stu-box{margin-top:6px;padding:0;font-size:13px;color:var(--ink-2)}
.stu-box[open]>summary{margin-bottom:0}
.stu-box>summary{cursor:pointer;color:var(--ink-2);font-weight:600;max-width:100%;overflow-wrap:anywhere}
.stu-box>summary .muted{font-weight:400}
.stu-box>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.stu-tpl{margin:0;font-size:13.5px;color:var(--ink-2)}
.stu-err{display:grid;gap:6px}
.stu-err .warn{margin:0}
details.stu-det{padding:0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.stu-det+details.stu-det{border-top:1px solid var(--line);padding-top:0}
.stu-det>summary{cursor:pointer;padding:6px 10px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.stu-det>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
details.stu-det[open]>summary{margin-bottom:0;border-bottom:1px solid var(--line)}
.stu-det>.note{margin:6px 10px 8px}
.stu-seq{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr);gap:6px 12px;margin:0;padding:8px 10px;font-size:13.5px}
.stu-seq dt{color:var(--ink-3);overflow-wrap:anywhere}
.stu-seq dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
.stu-warn{margin:0;padding:6px 10px 6px 26px;font-size:13px;color:var(--l-yellow);background:var(--l-yellow-bg);border-radius:6px}
.stu-chips .chip{font-size:12.5px;color:var(--ink-2)}
.stu-box>.note{margin:6px 0 0}
.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px;margin-top:8px}
.stu-proj{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);display:grid;gap:6px;align-content:start;align-self:start;min-width:0}
.stu-ph{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.stu-sws{display:inline-flex;gap:4px}
.stu-sw{width:16px;height:16px;border-radius:4px;border:1px solid var(--line-2);display:inline-block}
.stu-card{margin:0;font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.stu-tl{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:8px}

.stu-th{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}

.stu-seq dd{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px 10px}
.stu-val{flex:1 1 12em;min-width:0}
.stu-edbtn{flex:0 0 auto}
.stu-ed{display:grid;gap:8px;width:100%;padding:8px;border:1px solid var(--line-2);border-radius:8px;background:var(--sunk)}

.stu-ed .fi{width:100%}

.flm-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}

.flm-full{margin:0 0 12px}

.stu-tpv{display:flex;gap:10px;align-items:flex-start}

.stu-sec .stu-seq{padding:4px 0 6px}
.stu-seq.stu-kv,.drawer .stu-seq.stu-kv{grid-template-columns:minmax(0,8.5em) minmax(0,1fr);gap:2px 10px}
.stu-seq.stu-kv dt,.stu-seq.stu-kv dd{padding:1px 0}
.stu-secact{padding:0 0 8px}
.stu-hl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px}
.stu-prev{color:var(--ink);overflow-wrap:anywhere}
.stu-acc{font-weight:700;color:var(--accent)}
.stu-mocks{display:flex;gap:8px;padding:8px 10px;overflow-x:auto}
.stu-plan{margin-top:6px}
.stn-box{border:1px solid var(--line);border-left:3px solid var(--l-yellow);border-radius:6px;padding:8px 10px;background:var(--surface);font-size:13px;display:grid;gap:4px}
.stn-list{margin:0;padding-left:18px;display:grid;gap:3px;color:var(--ink-2);overflow-wrap:anywhere}
.stn-fonts{overflow-wrap:anywhere}
.fpv-kind{margin:4px 0 0}

.drawer dd{margin:0;min-width:0;overflow-wrap:anywhere}
.drawer dd .fi{width:100%}
.drawer dd .row .fi{width:auto;flex:1;min-width:120px}
.drawer h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.seg{border:1px solid var(--ctl-line);min-height:var(--ctl-h-sm);background:var(--surface);border-radius:var(--r);padding:2px 9px;cursor:pointer;font-size:13px}
.seg[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
.x{border:1px solid var(--ctl-line);min-height:var(--ctl-h-sm);background:var(--surface);border-radius:var(--r);padding:4px 10px;cursor:pointer}
.abox{border:1px solid var(--line);background:var(--sunk);border-radius:var(--r-lg);padding:10px 12px;display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.abox.you{border-color:var(--bar-rev);background:var(--l-purple-bg)}
.abox.bad{border-color:var(--l-red);background:var(--l-red-bg)}
.act{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.rsn{font-size:13px;color:var(--ink-3)}
.res{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--sunk);margin:0}
.stp{list-style:none;margin:0;padding:0;font-size:13px;max-height:220px;overflow:auto}
.stp li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:3px 0;border-top:1px solid var(--line)}
.stp li:first-child{border-top:0}
.stp .t{color:var(--ink-3);font-variant-numeric:tabular-nums}
.stp .s{overflow-wrap:anywhere}
.note{font-size:13px;color:var(--ink-3)}
.hint{border:1px dashed var(--line-2);border-radius:8px;padding:12px 16px;color:var(--ink-2);background:var(--surface)}

/* agenci, projekty */
.abar{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;padding:14px 16px}
.abar .sp{flex:1}
.ahint{padding:0 16px 12px;font-size:13.5px;color:var(--ink-2);display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap}
.runs li{grid-template-columns:auto minmax(0,1fr) auto}
.runs .wh{font-size:12.5px;color:var(--ink-3);text-align:right;white-space:nowrap}
.plx li{grid-template-columns:minmax(0,1fr) auto}
.plx .pf{font-size:12px;color:var(--ink-3);overflow-wrap:break-word;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;margin-top:2px}
.plx .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;white-space:normal}
.padd{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:8px 10px;align-items:end;padding:12px 0 16px;margin:0 16px;border-top:1px solid var(--line)}
.padd>.prx-chk{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-2);cursor:pointer}
/* Projekty i standard (#projekty): klasy .prx- tylko w tym widoku */
.prx-acts{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;justify-content:flex-end}
.prx-s{column-gap:12px}
.prx-files{text-decoration:none;white-space:nowrap}
.prx-files:hover,.prx-files:focus-visible{text-decoration:underline}
.plx .pf code{overflow-wrap:break-word;display:block;margin-top:4px}
.prx-path>summary{display:inline;font-weight:500;font-size:12px;color:var(--accent)}
.plx a.t{display:inline-block}
.linkbtn.prx-rm{color:var(--ink-3);font-weight:500}
.linkbtn.prx-rm:hover,.linkbtn.prx-rm:focus-visible{color:var(--l-red);text-decoration:underline}
.plx .r.prx-cf{grid-column:1/-1;justify-content:flex-start}
.prx-coln{display:none}
.prx-h3{grid-column:1/-1;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:0}
.prx-chk input{width:20px;height:20px;margin:0;flex:none}
.prx-sub{grid-column:1/-1}
.prx-none{padding:0}
.prx-ent{color:var(--ink);text-decoration:none;font-weight:600}
.prx-ent:hover,.prx-ent:focus-visible{text-decoration:underline}
.prx-rh{position:sticky;left:0;z-index:1;background:var(--surface);min-width:9rem;font-size:13px;font-weight:600;color:var(--ink);white-space:normal;max-width:15rem;border-bottom:1px solid var(--line)}
.prx-rhi{display:flex;align-items:center;gap:6px;min-width:0}
.prx-rhi .av{flex:none}
.prx-c{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap;text-decoration:none}
a.prx-c:hover,a.prx-c:focus-visible{text-decoration:underline}
.prx-c.prx-ok{color:var(--ink-3)}
.prx-sum{padding:0 16px 10px;margin:0}
.prx-cards{display:none;list-style:none;margin:0;padding:0 12px 12px;gap:8px}
.prx-card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px;min-width:0;font-size:13px;color:var(--ink-2)}
.prx-ch{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.prx-ch .prx-ent{flex:1 1 10rem;min-width:0;overflow-wrap:anywhere}
.prx-ch .lz{margin-left:auto}
.prx-mk{display:flex;flex-wrap:wrap;gap:6px}
.prx-mk a{text-decoration:none}
.prx-gaps{padding:12px 16px 4px;border-top:1px solid var(--line)}
.panel>details[data-prxdet]>summary small,.prx-gb h4 small{font-weight:500;color:var(--ink-3);font-size:var(--fs-sm)}
.prx-gh{font-size:var(--fs-md);margin-bottom:4px}
.prx-gb{border-top:1px solid var(--line);padding:8px 0}
.prx-gb h4{display:flex;align-items:center;gap:6px;margin:0 0 4px;font-size:var(--fs-md)}
.prx-gb h4 .prx-ent{min-width:0;overflow-wrap:anywhere}
.prx-gl>li{scroll-margin:16px}
.prx-gl>li:focus,.prx-gl span[id]:focus{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
.prx-std code{white-space:nowrap}
.prx-std-doc{display:none;margin:6px 0 0}
.prx-std-doc dt{font-weight:600;color:var(--ink);margin-top:10px}
.prx-std-doc dt:first-child{margin-top:0}
.prx-std-doc dd{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.prx-std-doc dd.prx-sec{color:var(--ink-3)}
.prx-pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:8px;margin:0;font-size:12.5px}
.prx-pre code{background:none;border:0;padding:0}
.prx-leg{margin:6px 0 0}
.prx-keys kbd{font:12px/1.5 var(--mono);display:inline-block;min-width:1.6em;text-align:center;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface);color:var(--ink)}
@media (min-width:621px){
  .prx-back{display:none}
  .padd .fi{min-height:var(--ctl-h);box-sizing:border-box}
}
@media (max-width:620px){
  .prx-acts{flex:1 1 100%;justify-content:flex-start}
  .plx li{grid-template-columns:minmax(0,1fr)}
  .plx .r{justify-content:flex-start}
  .prx-coln{display:block;flex:1 1 100%;margin:0}
  .prx-tw{display:none}
  .prx-cards{display:grid}
  .prx-stdt{display:none}
  .prx-std-doc{display:block}
  .panel>details[data-prxdet]>summary{min-height:40px;display:flex;align-items:center}
  .prx-path>summary{display:inline-flex;min-height:40px;align-items:center}
  .linkbtn.prx-rm{min-height:40px}
  .padd{margin:0 12px}
}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dot[style]{box-shadow:0 0 0 1px var(--ctl-line)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ctl-line);background:var(--surface);border-radius:var(--r-pill);padding:2px 10px;cursor:pointer;font-size:13px}
.chip[aria-pressed="false"]{color:var(--ink-3);text-decoration:line-through}
.chip[aria-pressed="false"] .dot{opacity:.3}
/* details: w panelu (.panel>details) z wcięciem panelu; w kartach i ramkach .ds-det bez wcięcia; jedno summary */
.panel>details{padding:0 16px 12px}
.panel>details+details{border-top:1px solid var(--line);padding-top:12px}
.panel>details.ds-gap{padding-top:12px}
/* dec. 36: jeden znacznik dla wszystkich <summary> (▸/▾ ze stałym odstępem), natywny znacznik ukryty także przy display:flex;
   bez znacznika: „⋯” (menu projektu) i summary z własnym podpisem rozwinięcia (pj-ov, pj-add, pj-gap) */
summary{cursor:pointer;font-weight:600;color:var(--ink-2);list-style:none}
summary::-webkit-details-marker{display:none}
summary::marker{content:""}
summary::before{content:"▸";display:inline-block;width:.9em;margin-right:6px;flex:none;color:var(--ink-3);font-size:12px;font-weight:400}
details[open]>summary::before{content:"▾"}
.prx-more>summary::before,.pj-ov>summary::before,.pj-add>summary::before,.pj-gap>summary::before{content:none}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
.panel>details[open]>summary,.ds-det[open]>summary{margin-bottom:8px}
.panel>details ul,.panel>details ol,.ds-det ul,.ds-det ol{margin:6px 0 0;padding-left:20px;color:var(--ink-2)}
.panel>details li,.ds-det li{margin-top:4px}
.ds-det{padding:0}

/* wskaźniki */
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.chartbox{padding:0 16px 14px;display:grid;gap:8px;min-width:0}
.chartbox p.cap{font-size:13px;color:var(--ink-3)}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.chartbox svg text{fill:var(--ink-3);font:12px var(--font)}
.chartbox svg text.lb{fill:var(--ink-2);font-weight:600}
.chartbox svg .gl{stroke:var(--line);stroke-width:1}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:8px 10px;font-size:var(--fs-sm);line-height:1.45;z-index:30;min-width:160px;box-shadow:var(--shadow-2)}
.tip b{display:block;margin-bottom:2px}
.tip .r{display:flex;justify-content:space-between;gap:14px}
.tip .r span:first-child{display:inline-flex;align-items:center;gap:6px}
.tip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.hbar .tr{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--c1);border-radius:0 3px 3px 0}

/* szczegóły zadania, materiały */
.dbox{border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 12px;display:grid;gap:8px;min-width:0}
.dbox h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dbox h3 small{font-size:12px;font-weight:500;text-transform:none;letter-spacing:0}
.dbox p{font-size:14px;overflow-wrap:anywhere}
.dbox .sub{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-top:2px}
.steps-ro{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.steps-ro li{overflow-wrap:anywhere}
.steps-ro label{display:flex;gap:8px;align-items:flex-start}
.steps-ro input{margin:3px 0 0;flex:none}
.steps-ro .ok{color:var(--ink-3);text-decoration:line-through}
.notes{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.mats{display:flex;flex-wrap:wrap;gap:6px}
.rd{display:grid;gap:8px;min-width:0;grid-template-columns:minmax(0,1fr)}
.rd .sub{margin:0}
.rdx{max-height:70vh}
.rd .mat .mh:last-child{border-bottom:0}
.mats .btn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;justify-content:flex-start}
.mats .btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.mat{border:1px solid var(--line);border-radius:6px;background:var(--sunk);display:grid;min-width:0;grid-template-columns:minmax(0,1fr)}
.mat .mh{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:6px 8px 6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mat .mh b{font-size:13px;overflow-wrap:anywhere;min-width:0}
.mat .mh span{display:flex;gap:6px}
.mdx{padding:8px 12px 10px;font-size:13.5px;color:var(--ink-2);max-height:360px;overflow:auto;overflow-wrap:anywhere}
.mdx h3{font-size:12px;margin:10px 0 4px}
.mdx h3:first-child{margin-top:0}
.mdx p{margin:4px 0}
.mdx ul{margin:4px 0;padding-left:18px}
.mdx b{color:var(--ink)}
:is(p,div,ul).warn{border:1px solid var(--bar-warn);background:var(--l-yellow-bg);color:var(--l-yellow);border-radius:6px;padding:6px 10px;font-size:13px;overflow-wrap:anywhere}
.dcap{font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}
.wyn p{white-space:pre-wrap}
.steps-ro label{cursor:pointer}
.dform{display:grid;gap:8px;min-width:0}
.fl{display:grid;gap:3px;font-size:12.5px;color:var(--ink-3);min-width:0;flex:1}
.fl .fi{width:100%;color:var(--ink);font-size:14px}
.abox .row .fl{min-width:140px}

/* Dziś: liczniki, pasek serwera */
.ycnt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 16px 10px;max-width:600px}
.ycnt a{display:flex;flex-direction:column;align-items:flex-start;gap:0;border:1px solid var(--line);border-radius:8px;padding:4px 12px;color:var(--ink-2);text-decoration:none;font-size:var(--fs-xs);line-height:1.3;min-width:0}
.ycnt a:hover{background:var(--hover)}
.ycnt b{font-size:18px;font-weight:650;color:var(--ink)}
.ycnt a.now b{color:var(--l-purple)}
/* linia stanu (serwer, telefon): wzór .banner — ramka, kropka stanu i słowo stanu; kolor ramki tylko przy problemie */
.srvbar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 12px;background:var(--surface);font-size:var(--fs-sm);min-width:0}
.srvbar.warn{border-color:var(--bar-warn)}
.srvbar.bad{border-color:var(--l-red)}
.srvbar>b{margin-right:4px}
.pagehead .srvbar{margin-top:8px}

/* dziś, następny krok, karty projektów */
.nx{display:grid;gap:2px;min-width:150px;max-width:240px}
.nx .lk,.nx b{font-size:13px;font-weight:600;line-height:1.35}
.nx span{font-size:12px;color:var(--ink-3)}
.nx span.late{color:var(--l-red);font-weight:600}
.pcards{display:none;list-style:none;margin:0;padding:0 16px 12px;gap:10px}
.pcard{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;cursor:pointer;min-width:0}
.pcard:hover{background:var(--hover)}
.pcard .ph1{display:flex;gap:10px;align-items:center;min-width:0}
.pcard .ph1 a{font-weight:650;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.pcard .ph1 .lz{margin-left:auto}
.pcard .ph1 a:hover{color:var(--accent);text-decoration:underline}
.pcard .tg2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-2)}
.pcard .kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13px;align-items:baseline}
.pcard .kv>span:nth-child(odd){color:var(--ink-3);font-size:12px}
.pcard .nx{max-width:none;min-width:0}
.colsw{display:none;gap:4px;flex-wrap:wrap}
.colsw .seg{flex:1;min-width:0}
.board .more{font-size:12.5px;color:var(--ink-3);padding:0 6px}
.bnav{display:none}

/* tekst z plików (md): tabele przewijane w poziomie we własnym kontenerze, listy numerowane, linki, kod */
.mdt{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;margin:6px 0;border:1px solid var(--line);border-radius:6px}
.mdt table{width:auto;min-width:100%;font-size:13px}
.mdt th,.mdt td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;min-width:7em;overflow-wrap:break-word;word-break:normal;white-space:normal}
.mdt th{font-size:12px;color:var(--ink-2);border-bottom-width:2px}
.mdt tr:last-child td{border-bottom:0}
.mdx ol,.pmn ol,.pmt ol{margin:4px 0;padding-left:22px}
.mdx li,.pmt li{margin-top:2px}
.mdx a,.pmn a,.pmt a{overflow-wrap:anywhere}
.mdpre{font:12px/1.45 var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0;overflow-x:auto;white-space:pre;max-width:100%}
.mdq{border-left:3px solid var(--line-2);padding-left:8px;color:var(--ink-3)}
.plan .pmt ul,.plan .pmt ol{list-style:revert;padding-left:20px}
.plan .pmt li{display:list-item;border-top:0;padding:2px 0}
/* zmiany agenta: pliki, diff, scalanie */
.chg{display:grid;gap:6px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px}
.chg .sub{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.chg .br{font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}
.chl{list-style:none;margin:0;padding:0;font-size:13px;display:grid;gap:2px;max-height:200px;overflow:auto}
.chl li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:baseline}
.chl code{background:none;border:0;padding:0;overflow-wrap:anywhere}
.chg .ad{color:var(--l-green);font-weight:600}
.chg .rm{color:var(--l-red);font-weight:600}
.qa .row{margin-top:6px}
.panel>.note{padding:0 16px 14px}
.ahint.ds-pad{padding:0 16px 14px}
.diff{font:12px/1.45 var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:6px;margin:0;max-height:420px;overflow:auto;white-space:pre;padding:6px 0;-webkit-overflow-scrolling:touch}
.diff .dw{display:inline-block;min-width:100%}
.diff .dw>span{display:block;padding:0 10px}
.diff .da{background:var(--l-green-bg);color:var(--l-green)}
.diff .dr{background:var(--l-red-bg);color:var(--l-red)}
.diff .dk{color:var(--l-blue)}
.diff .dh{color:var(--ink-3);font-weight:600}
/* Dziś: warunek ukończenia, plan ponad pojemność, propozycje, pomiary */
.gw{font-size:var(--fs-sm);color:var(--ink-2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.gw.none{color:var(--ink-3)}
.over{margin:0 16px 10px;border:1px solid var(--bar-warn);background:var(--l-yellow-bg);color:var(--l-yellow);border-radius:var(--r-lg);padding:8px 12px;display:grid;gap:6px;font-size:13px;min-width:0}
.over ul{margin:0;padding-left:18px}
.over li{overflow-wrap:anywhere}
.prop{font-size:13px;color:var(--ink-2);margin-top:4px;overflow-wrap:anywhere}
.mform{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;margin-top:6px}
.mform .fl{flex:0 1 auto}
.mform .fi{width:130px}
.pst{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pst .wide{grid-column:1/-1}
.pstat{font-size:12px;color:var(--ink-3)}
.sline{display:none}
/* runda 5: następny krok, odblokowania, kontrola serwera, skutki pytań, toast */
.gw.w,.prop{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
.eff{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.eff li,.rows .eff li{display:list-item;border-top:0;padding:0;overflow-wrap:anywhere;margin-top:2px}
.effh{font-size:12px;font-weight:700;color:var(--ink-3);margin-top:6px}
.abox.ok{border-color:var(--bar-done);background:var(--l-green-bg)}

<script>
(function(){
'use strict';
const PREVIEW=/*PREVIEW*/null;
const LIVE=PREVIEW===null;

/* ---------- pomocnicze ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromKey=k=>{const a=String(k).split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const addK=(k,n)=>key(addDays(fromKey(k),n));
const diff=(a,b)=>Math.round((fromKey(a)-fromKey(b))/864e5);
const isDay=s=>/^\d{4}-\d\d-\d\d$/.test(s||'');
const DN=['niedz.','pon.','wt.','śr.','czw.','pt.','sob.'];
const DNI=['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
const MD=['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const pl=(n,a,b,c)=>n===1?a:(n%10>=2&&n%10<=4&&(n%100<12||n%100>14))?b:c;
const dd=k=>{const d=fromKey(k);return d.getDate()+'.'+pad(d.getMonth()+1)};
const ddl=k=>DN[fromKey(k).getDay()]+' '+dd(k);
const dLong=k=>{const d=fromKey(k);return DNI[d.getDay()]+', '+d.getDate()+' '+MD[d.getMonth()]+' '+d.getFullYear()};
const dTo=k=>diff(k,D.todayKey);
const relN=d=>d<0?'po terminie '+(-d)+' '+pl(-d,'dzień','dni','dni'):d===0?'dziś':d===1?'jutro':'za '+d+' '+pl(d,'dzień','dni','dni');
const rel=k=>relN(dTo(k));
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const dur=m=>{const h=Math.floor(m/60),r=m%60;return h&&r?h+' h '+r+' min':h?h+' h':r+' min'};
const fmt1=v=>String(Math.round(v*10)/10).replace('.',',');
const fmtN=n=>{n=+n||0;return Number.isInteger(n)?String(n):n.toFixed(1).replace('.',',')};
const col=c=>/^#[0-9a-f]{6}$/i.test(c||'')?c:'var(--ink-3)';
function resolveRel(v,today){
  if(typeof v==='number')v=(v>=0?'+':'')+v;
  const m=/^([+-]\d+)(T\d\d:\d\d)?$/.exec(typeof v==='string'?v:'');
  return m?key(addDays(today,+m[1]))+(m[2]||''):v;
}

const PHASES=[['pomysl','Pomysł'],['ksiega','Księga'],['budowa','Budowa'],['wdrozenie','Wdrożenie'],['marketing','Marketing'],['utrzymanie','Utrzymanie']];
const PHI={};PHASES.forEach((x,i)=>PHI[x[0]]=i);
const WHO={claude:{n:'Claude',c:'var(--who-claude)',i:'C'},codex:{n:'Codex',c:'var(--who-codex)',i:'X'},ty:{n:'Ty',c:'var(--who-ty)',i:'Ty'},'':{n:'Nieprzypisane',c:'var(--who-none)',i:'–'}};
const COLS=[['todo','Do zrobienia'],['wip','W toku'],['rev','Do odbioru'],['done','Zrobione']];
const ST={ok:['out','w normie'],risk:['yellow','zagrożony'],late:['red','po terminie'],you:['purple','czeka na Ciebie'],done:['grey','zrobione'],none:['out','bez terminu'],
  backlog:['grey','backlog'],paused:['grey','wstrzymany'],finished:['grey','zakończony']};

const MACH={pc:'Windows',mac:'Mac',cloud:'serwer'};
const MACHL={pc:'na Windows',mac:'na Macu',cloud:'na serwerze'};
/* tekst inicjałów awatara: tokeny --av-inkN (kontrast ≥4,5 na tle --avN) */
const AVINK=[1,2,3,4,5,6,7,8].map(i=>'var(--av-ink'+i+')');
const INBOX='Do rozplanowania';
const VIEWS=['asystent','start','przeglad','wskazniki','ty','marketing','media','tablica','terminy','blokady','agenci','koszty','projekty'];
const VNAME={asystent:'Asystent',start:'Start',przeglad:'Przegląd',wskazniki:'Wskaźniki',ty:'Dla Ciebie',marketing:'Marketing',media:'Media',tablica:'Tablica',terminy:'Terminy',blokady:'Blokady',agenci:'Agenci',koszty:'Serwer',projekty:'Projekty'};
/* pełny opis widoku: title i aria-label (krótka nazwa z VNAME w menu, pasku, h1 i okruszkach) */
const VDESC={asystent:'Asystent: rozmowa głosem i tekstem, odpowiedzi jako karty',start:'Start: postęp projektów',przeglad:'Przegląd: co trwa, co na dziś, projekty',wskazniki:'Wskaźniki: postęp, tempo i przepływ pracy',ty:'Dla Ciebie: sprawy, które wymagają Ciebie (pytania, zgody, odbiory, Twoje zadania)',
  marketing:'Marketing: tydzień postów i filmów',media:'Media: zdjęcia i filmy ze wszystkich projektów',tablica:'Tablica: zadania ze wszystkich projektów',terminy:'Terminy: etapy, zadania, publikacje i kalendarz',blokady:'Blokady: zadania, które wstrzymują inne',
  agenci:'Agenci: kto pracuje i historia uruchomień',koszty:'Serwer: stan, pamięć, dysk, koszty i wdrażanie',projekty:'Projekty: rejestr i zgodność plików'};
/* dolny pasek (telefon): 4 widoki + „Więcej” (pozostałe widoki z licznikami i lista projektów) */
const BNAV=['asystent','start','ty','marketing'];
/* menu boczne: główne widoki; reszta w zwiniętym „Więcej” */
const MAINV=['asystent','start','ty','marketing'];
const PTABS=[['plan','Plan'],['tablica','Zadania'],['marketing','Marketing'],['etapy','Etapy'],['wskazniki','Wskaźniki'],['ksiega','Księga']];
const PTMAIN=3;
const lz=k=>{const s=ST[k]||ST.none;return '<span class="lz '+s[0]+'">'+s[1]+'</span>'};
const lzT=s=>{const x=TS[s]||TS.todo;return '<span class="lz '+x[0]+'">'+x[1]+'</span>'};

/* ---------- stan strony ---------- */
let D=null,offline=false,srvErr=0,notice='',noticeT=null,timer=null,pending=0,queue=Promise.resolve(),tmpN=0,loadSeq=0,FX=null,HC={},CUR=null,DR=null,gWait=0,q='';
/* Terminy: tk = ukryte rodzaje (etap, zadanie, publikacja, kalendarz), tmSec = zwinięte/rozwinięte grupy, tmLaterEv = wydarzenia w „Później” */
const PF={bp:'all',mine:false,ms:'all',theme:'',hidden:[],col:'todo',bk:'',more:{},tk:['kalendarz'],tmSec:{},tmLaterEv:false};
try{const z=JSON.parse(localStorage.getItem('pulpit.v1')||'{}');if(z&&typeof z==='object'){
  if(typeof z.bp==='string')PF.bp=z.bp;PF.mine=!!z.mine;if(typeof z.ms==='string')PF.ms=z.ms;
  if(Array.isArray(z.tk))PF.tk=z.tk.filter(k=>['etap','zadanie','publikacja','kalendarz'].indexOf(k)>=0);PF.tmLaterEv=!!z.tmLaterEv;
  if(z.tmSec&&typeof z.tmSec==='object')Object.keys(z.tmSec).forEach(k=>{PF.tmSec[k]=!!z.tmSec[k]});
  if(z.theme==='light'||z.theme==='dark')PF.theme=z.theme;if(COLS.some(c=>c[0]===z.col))PF.col=z.col;if(typeof z.bk==='string')PF.bk=z.bk;if(z.more&&typeof z.more==='object')Object.keys(z.more).forEach(k=>{PF.more[k]=!!z.more[k]});if(Array.isArray(z.hidden))PF.hidden=z.hidden.map(String)}}catch(e){}
try{if(!PF.hidden.length){const h=JSON.parse(localStorage.getItem('panel.hiddenCals')||'[]');if(Array.isArray(h))PF.hidden=h.map(String)}}catch(e){}
let hiddenCals=new Set(PF.hidden);
const savePF=()=>{PF.hidden=Array.from(hiddenCals);try{localStorage.setItem('pulpit.v1',JSON.stringify(PF))}catch(e){}};
function themeL(){return PF.theme==='dark'?'Motyw: ciemny':PF.theme==='light'?'Motyw: jasny':'Motyw: systemowy'}
function applyTheme(){
  if(PF.theme)document.documentElement.setAttribute('data-theme',PF.theme);else document.documentElement.removeAttribute('data-theme');
  $('#theme').textContent=themeL();const b=document.querySelector('[data-bntheme]');if(b)b.textContent=themeL();
}
applyTheme();

/* ---------- dane ---------- */
function normalize(raw){
  const today=isDay(raw.today)?fromKey(raw.today):new Date();
  const rr=v=>resolveRel(v,today);
  const cal=raw.calendar||{};
  const cals=(cal.calendars||[]).map(c=>({id:String(c.id),title:c.title||'',color:col(c.color)}));
  const cmap={};cals.forEach(c=>cmap[c.id]=c);
  const events=(cal.events||[]).map((e,i)=>{
    const cid=String(e.calendarId==null?'':e.calendarId),c=cmap[cid]||{};
    const s=String(rr(e.start)||''),en=String(rr(e.end)||s);
    const o={id:e.id||'e'+i,title:e.title||'(bez tytułu)',allDay:!!e.allDay,calId:cid,cal:e.calendar||c.title||'',color:col(e.color||c.color),loc:e.location||''};
    if(o.allDay){o.d0=s.slice(0,10);o.d1=en.slice(0,10);if(!isDay(o.d0))return null;if(!isDay(o.d1)||o.d1<o.d0)o.d1=o.d0}
    else{o.s=new Date(s);o.e=new Date(en);if(isNaN(o.s)||isNaN(o.e))return null}
    return o}).filter(Boolean);
  const projects=(raw.projects||[]).map(p=>{
    const o=Object.assign({},p,{docs:Array.isArray(p.docs)?p.docs:[],lastDecision:p.lastDecision?Object.assign({},p.lastDecision,{date:rr(p.lastDecision.date)}):null});
    o.name=o.name||o.id;
    o.state=['active','paused','done','backlog'].indexOf(o.state)>=0?o.state:'active';
    o.description=String(o.description||o.goal||'');
    o.client=typeof o.client==='boolean'?o.client:true;
    o.questions=(Array.isArray(o.questions)?o.questions:[]).filter(x=>x&&typeof x.text==='string').map((x,i)=>{const qd=String(rr(x.date)||'');
      return {n:typeof x.n==='number'?x.n:i+1,text:x.text,answer:typeof x.answer==='string'?x.answer:'',date:isDay(qd)?qd:'',
        proposal:typeof x.proposal==='string'?x.proposal.trim():'',
        /* skutki przyjęcia propozycji (wiersze „skutek:” pod pytaniem) */
        effects:(Array.isArray(x.effects)?x.effects:[]).filter(e=>typeof e==='string'&&e.trim()).map(e=>e.trim())}});
    /* priorytet z karty (1 najważniejszy, 5 najmniej); bez pola 3 */
    const pr=typeof p.priority==='string'?parseInt(p.priority,10):p.priority;
    o.prioritySet=Number.isInteger(pr)&&pr>=1&&pr<=5;o.priority=o.prioritySet?pr:3;
    o.threshold=o.threshold==='lekka'||o.threshold==='pelna'?o.threshold:(o.client?'pelna':'lekka');
    o.alias=o.alias||'';
    o.instagram=typeof o.instagram==='string'?o.instagram:'';      /* profil Instagram z karty (bez @) */
    o.book=(Array.isArray(o.book)?o.book:o.docs).map(d=>({key:d.key||'',label:d.label||d.key||'',file:d.file||'',status:['ok','gaps','missing'].indexOf(d.status)>=0?d.status:'gaps',gaps:Array.isArray(d.gaps)?d.gaps:[]}));
    o.bookTotal=typeof o.bookTotal==='number'?o.bookTotal:(Array.isArray(p.book)?o.book.length:(typeof o.docsTotal==='number'?o.docsTotal:o.book.length));
    o.bookOk=typeof o.bookOk==='number'?o.bookOk:(Array.isArray(p.book)?o.book.filter(b=>b.status==='ok').length:(typeof o.docsOk==='number'?o.docsOk:o.book.filter(b=>b.status==='ok').length));
    o.docsOk=typeof o.docsOk==='number'?o.docsOk:o.docs.filter(d=>d.status==='ok').length;
    o.docsTotal=typeof o.docsTotal==='number'?o.docsTotal:o.docs.length;
    o.phaseIn=PHI.hasOwnProperty(p.phase)?p.phase:'';
    o.phaseSrcIn=p.phaseSource==='wyliczona'?'wyliczona':'karta';
    const ns=p.nextStep;
    o.nextIn=ns===undefined?undefined:ns&&typeof ns==='object'&&typeof ns.title==='string'&&ns.title?{title:ns.title,taskId:String(ns.taskId||''),executor:WHO[ns.executor]?ns.executor:'',date:String(rr(ns.date)||'')}:null;
    return o});
  const dm=+raw.dayMinutes;
  return derive({todayKey:key(today),generatedAt:raw.generatedAt||'',projectsSource:raw.projectsSource||'sample',icsPath:raw.icsPath||'/terminy.ics',
    dayMinutes:isFinite(dm)&&dm>0?Math.round(dm):120,
    projects:projects,
    stages:(raw.stages||[]).map(t=>Object.assign({},t,{date:rr(t.date)})),
    tasks:(raw.tasks||[]).map(z=>Object.assign({},z,{date:rr(z.date),kind:z.kind||'zadanie',minutes:+z.minutes||0,detail:normDetail(z.detail),
      needs:Array.isArray(z.needs)?z.needs.filter(x=>typeof x==='string'&&x):(z.needsYou?[z.needsYou]:[]),
      after:Array.isArray(z.after)?z.after.filter(x=>typeof x==='string'&&x.trim()):[],
      waitingFor:Array.isArray(z.waitingFor)?z.waitingFor.filter(x=>x&&typeof x.title==='string'&&x.title).map(x=>({title:x.title,done:!!x.done})):[],
      check:normCheck(z.check),counter:normCounter(z),campFile:String(z.campaignFile||z.kampania||'').trim(),
      unlocksIn:Array.isArray(z.unlocks)?z.unlocks.filter(u=>u&&typeof u.title==='string'&&u.title).map(u=>({id:String(u.id||''),title:u.title,executor:WHO[u.executor]?u.executor:'',date:(v=>isDay(v)?v:'')(String(rr(u.date)||''))})):null,
      unlockCountIn:Number.isFinite(+z.unlockCount)&&z.unlockCount!==null&&z.unlockCount!==''?+z.unlockCount:null})),
    server:normServer(raw.server),
    costs:normCosts(raw.costs),
    resources:normRes(raw.resources),
    deploy:raw.deploy&&typeof raw.deploy==='object'&&!Array.isArray(raw.deploy)?raw.deploy:null,
    publish:normPublish(raw.publish),
    film:raw.film&&typeof raw.film==='object'?{available:!!raw.film.available,explainer:!!raw.film.explainer,account:String(raw.film.account||'')}:null,
    studio:raw.studio&&typeof raw.studio==='object'&&!Array.isArray(raw.studio)?raw.studio:{},
    campaigns:(raw.campaigns||[]).map(c=>{
      const cn={},co=c.counters&&typeof c.counters==='object'?c.counters:{};
      Object.keys(co).forEach(k=>{const n=+co[k];if(k&&isFinite(n))cn[k]=n});
      const r0=isFinite(+c.result)&&+c.result>0?+c.result:0,mk=String(c.counterMetric||c.metric||'').trim().toLowerCase();
      /* wynik = większy z ręcznego wyniku i sumy licznika miernika */
      const rm=mk&&cn.hasOwnProperty(mk)?cn[mk]:0;
      return Object.assign({},c,{start:rr(c.start),end:rr(c.end),channels:c.channels||[],gaps:c.gaps||[],counters:cn,
      target:isFinite(+c.target)&&+c.target>0?+c.target:0,result:Math.max(r0,rm)})}),
    standard:raw.standard||[],agents:normAgents(raw.agents),activity:normActivity(raw.activity),
    pmNote:raw.pmNote?{date:rr(raw.pmNote.date),text:String(raw.pmNote.text||''),at:typeof raw.pmNote.at==='string'?raw.pmNote.at:''}:null,
    history:(Array.isArray(raw.history)?raw.history:[]).map(e=>({date:String(rr(e&&e.date)||''),projects:e&&e.projects&&typeof e.projects==='object'?e.projects:{}}))
      .filter(e=>isDay(e.date)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0),
    cal:{status:LIVE?(cal.status||'error'):'preview',source:LIVE?(cal.source||'sample'):'sample',error:cal.error||'',readAt:cal.readAt||'',connecting:!!cal.connecting,calendars:cals,events:events}});
}
/* szczegóły zadania (wcięte wiersze pod zadaniem); stare dane bez pola detail dają puste wartości */
function normDetail(d){
  d=d&&typeof d==='object'?d:{};
  const s=v=>typeof v==='string'?v.trim():'',L=v=>Array.isArray(v)?v:[];
  /* poprawka: i następne: z serwera albo, u starszego serwera, z notatek */
  let fix=s(d.fix)||s(d.poprawka),next=d.next!=null&&d.next!==''?d.next:d['następne']!=null&&d['następne']!==''?d['następne']:d.nastepne;
  const notes=[];
  /* wynik publikacji: pola z serwera (stats albo klucze), u starszego serwera wiersze w notatkach */
  const so=d.stats&&typeof d.stats==='object'?d.stats:{},sv=(...a)=>{for(const x of a)if(x!=null&&String(x).trim()!=='')return String(x).trim();return ''};
  const stats={views:sv(so.views,d.views,d['wyświetlenia']),clicks:sv(so.clicks,d.clicks,d['kliknięcia']),accounts:sv(so.accounts,d.accounts,d.konta),link:sv(so.link,d.link)};
  L(d.notes).filter(x=>typeof x==='string'&&x.trim()).forEach(x=>{const m=/^\s*(następne|nastepne|poprawka)\s*:\s*(.*)$/i.exec(x);
    const ps=/^\s*(wyświetlenia|wyswietlenia|kliknięcia|klikniecia|konta|link)\s*:\s*(.*)$/i.exec(x);
    if(ps){const f=STATK[ps[1].toLowerCase()];if(!stats[f])stats[f]=ps[2].trim();return}
    if(!m)notes.push(x);else if(/^popr/i.test(m[1])){if(!fix)fix=m[2].trim()}else if(next==null||next==='')next=m[2].trim()});
  return {goal:s(d.goal),doneWhen:s(d.doneWhen),
    refs:L(d.refs).filter(r=>r&&typeof r.path==='string'&&r.path.trim()).map(r=>({path:r.path.trim(),anchor:s(r.anchor)})),
    /* i: numer kroku w pliku (od 0), potrzebny do zapisu klucza krok */
    steps:L(d.steps).map((x,i)=>x&&typeof x.text==='string'&&x.text.trim()?{done:!!x.done,text:x.text.trim(),i:i}:null).filter(Boolean),

  if(inside){k=a.dataset.k||'';if(!k)i=Array.prototype.indexOf.call(el.querySelectorAll(FOCUSABLE),a)}

/* Twoje sprawy (zadania kto: ty i z wymaga, pytania bez odpowiedzi) tylko z aktywnych projektów, w trzech grupach:
   youToday: termin do dziś, zgody i odbiory bez przyszłego terminu, pytania z terminem do dziś albo bez terminu;
   youWeek: termin w najbliższych 7 dniach od dziś (także zadania, które czekają na inne); youLater: reszta.
   Zadanie, które czeka na niezrobione zadania (po:), nie trafia do Dziś.
   checked: otwarte zadania, które kontrola serwera („sprawdza:”) uznała za zrobione; poza Dziś, do zamknięcia. */
const NOWR=x=>x.late?0:x.need==='zgoda'?1:x.need==='odbiór'?2:x.q?4:3;
const isChecked=t=>t.state!=='done'&&!!t.check&&t.check.ok===true;
function youState(){
  const f=facts();if(f.ys)return f.ys;
  const endW=addK(D.todayKey,6),on=p=>!!p&&p.state==='active';
  const youToday=[],youWeek=[],youLater=[],checked=[];
  const put=(x,now)=>{if(now)youToday.push(x);else if(x.d&&x.d<=endW)youWeek.push(x);else youLater.push(x)};
  f.open.forEach(t=>{if(!on(P(t.project)))return;
    if(isChecked(t)){checked.push(t);return}
    if(!needsMe(t))return;
    const d=isDay(t.date)?t.date:'',due=!!d&&d<=D.todayKey;
    put({t:t,late:isLate(t),need:t.needsYou||'',d:d,min:+t.minutes||0,uc:t.unlockCount||0},!t.waits.length&&(t.needsYou?(due||!d):(t.executor==='ty'&&due)))});
  f.qs.forEach(q=>{if(!on(q.p))return;const d=q.date||'';put({q:q,late:!!d&&d<D.todayKey,need:'',d:d,min:0,uc:0},!d||d<=D.todayKey)});
  /* kolejność: termin (po terminie najpierw), potem ile zadań odblokowuje, potem priorytet projektu (1 najważniejszy), potem rodzaj sprawy */
  const prOf=x=>{const p=x.q?x.q.p:P(x.t.project);return p?p.priority:3};
  const by=(a,b)=>(a.d||'9999').localeCompare(b.d||'9999')||(b.uc-a.uc)||prOf(a)-prOf(b)||NOWR(a)-NOWR(b);
  youToday.sort(by);youWeek.sort(by);youLater.sort(by);
  checked.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
  return f.ys={youToday:youToday,youWeek:youWeek,youLater:youLater,checked:checked};
}

function answerQ(pid,n,text,accept){
  const p=P(pid);if(!p||!canMeta(p))return;const x=p.questions.find(y=>y.n===n);if(!x)return;
  text=String(text||'').replace(/\s+/g,' ').trim().slice(0,2000);
  const eff=x.effects||[],own=!accept&&!!text&&eff.length>0&&text!==x.proposal;
  x.answer=text;delete QD[pid+':'+n];FX=null;render(true);
  if(!LIVE){say(PRV);return}
  const body={id:pid,n:n,answer:text};if(accept)body.accept=true;
  enqueue(async()=>{const r=await post('/api/question/answer',body);
    if(!r.ok){if(r.status!==401)say(failMsg(r,'Nie zapisano odpowiedzi.'));return}
    const d=r.data||{},ap=Array.isArray(d.applied)?d.applied:null,fl=Array.isArray(d.failed)?d.failed:[];
    if(accept){
      if(!eff.length&&!ap)return say('Przyjęto propozycję.');
      if(!ap&&!fl.length)return say('Przyjęto propozycję. Serwer nie podał wyniku zmian w zadaniach.',10000);
      const a=ap||[],all=a.length+fl.length;
      say('Przyjęto propozycję. Wprowadzono '+a.length+' z '+all+' '+pl(all,'zmiany','zmian','zmian')+'.'+(a.length?' Wykonano: '+a.map(opTxt).filter(Boolean).join('; ')+'.':'')+
        (fl.length?' Nie wykonano: '+fl.map(opTxt).filter(Boolean).join('; ')+'.':''),fl.length?15000:9000);
    }else if(own){
      const tk=d.task&&typeof d.task==='object'?d.task.title:typeof d.task==='string'?d.task:'';
      say('Zapisano odpowiedź. Zmian z propozycji nie wykonano'+(tk?'; agent ma zadanie „'+tk+'”.':'.'),9000);
    }else say(text?'Zapisano odpowiedź.':'Usunięto odpowiedź.');

/* kolejność kart: otwarte — po terminie, potem data rosnąco (bez daty na końcu), przy remisie Twoje przed agentami, potem plik;
   „Zrobione” — od najnowszego (odwrócona kolejność z plików); sortowanie na kopii, D.tasks bez zmian */
function tbSort(L,k){
  if(k==='done')return L.slice().reverse();
  return L.map((t,i)=>[t,i]).sort((x,y)=>{const a=x[0],b=y[0],la=lateT(a)?0:1,lb=lateT(b)?0:1;if(la!==lb)return la-lb;
    const da=isDay(a.date)?a.date:'~',db=isDay(b.date)?b.date:'~';if(da!==db)return da<db?-1:1;
    const ya=a.executor==='ty'?0:1,yb=b.executor==='ty'?0:1;return ya!==yb?ya-yb:x[1]-y[1]}).map(x=>x[0]);
}
const TB_EMPTY={todo:'Brak zadań do zrobienia.',wip:'Nic w toku.',rev:'Nic do odbioru.',done:'Nic jeszcze nie zrobiono.'};
/* poprawki UI: kolumna „Do zrobienia” w grupach. Twoje (i zgody, odbiory) po okresach: Po terminie, Dziś, Do 7 dni

   pokazują 15 kart, reszta po „Pokaż wszystkie”. Stan zwinięcia w A.tbGrp (sesja), „Pokaż wszystkie” w PF.more */
const TB_CUT=15;
const TB_PER=[['late','Po terminie',1],['today','Dziś',1],['week','Termin w ciągu 7 dni',1],['later','Później',0],['none','Bez terminu',0]];

function tbGrpHead(key,label,n,open,cls){

function tbTodo(L,showProj,b){
  const G=A.tbGrp||{},op=(k,d)=>G[k]!=null?G[k]:d,mine=L.filter(tbMine),ready=mine.filter(t=>!t.waits.length),wait=mine.filter(t=>t.waits.length),ag=L.filter(t=>!tbMine(t));
  const per={};TB_PER.forEach(p=>{per[p[0]]=ready.filter(t=>tbPer(t)===p[0])});
  const anyOpen=TB_PER.some(p=>p[2]&&per[p[0]].length);

  TB_PER.forEach(([k,lab,d])=>{const X=per[k];if(!X.length)return;const key=b+':'+k,open=op(key,d||!anyOpen);

/* Przegląd jako jedna ścieżka, od tego, co właściciel ma zrobić: Decyzje (3 najważniejsze z akcją) → Dziś (5 spraw, „Ponad plan”
   jednym wierszem) → pytania z terminem do jutra → Ryzyka (z akcją) → Teraz → Projekty → zwinięte: Proponuje PM, Terminy w 7 dni,
   Kampanie, Plan dnia. Ten sam porządek na telefonie. Pozycja pokazana wyżej nie powtarza się niżej. */
const PV_TODAY=5,PV_DEC=3;

const pvFold=(k,title,small,body,tip,open)=>'<details class="pv-fold" data-pvdet="'+k+'"'+(open||PF.more[k]?' open':'')+'><summary'+(tip?' title="'+esc(tip)+'"':'')+'><span class="pv-ft">'+title+'</span>'+(small?'<small>'+small+'</small>':'')+'</summary>'+body+'</details>';

function pvDecs(ys){

function vPrzeglad(){
  const f=facts(),a=D.agents,ys=youState();
  const act=D.projects.filter(p=>p.state==='active'),back=D.projects.filter(p=>p.state==='backlog').length,paused=D.projects.filter(p=>p.state==='paused').length;
  /* 3 najważniejsze decyzje; ta sama sprawa w kilku projektach liczy się raz i stoi w jednym zwijanym wierszu */
  const dKey=x=>x.t&&x.need?x.need+'|'+x.t.title:'',decA=pvDecs(ys),pick={};let pn=0;
  decA.forEach(x=>{const k=dKey(x)||(x.q?'q|'+qKey(x.q):'t|'+x.t.id);if(!pick[k]&&pn<PV_DEC){pick[k]=1;pn++}});
  const dec=decA.filter(x=>pick[dKey(x)||(x.q?'q|'+qKey(x.q):'t|'+x.t.id)]),shownT={},shownQ={};
  /* shownT: gdzie zadanie stoi wyżej (Następny krok w tabeli projektów pisze „w Decyzjach” albo „w Dziś”) */

/* markdown z plików i notatek: nagłówki, listy (także numerowane), tabele w przewijanym kontenerze, kod, cytaty, linki http(s) */
const MDSEP=/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
function mdInl(s){
  return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<]*[^\s<.,;:!?)])/g,'$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
}
function mdCells(l){
  let s=l.trim().replace(/\\\|/g,'\u0001');
  if(s[0]==='|')s=s.slice(1);if(s.slice(-1)==='|')s=s.slice(0,-1);
  return s.split('|').map(c=>c.trim().replace(/\u0001/g,'|'));
}
function md(text){
  const out=[];let list=null,rows=null,code=null;
  const chk=x=>x.replace(/^\[( |x|X)\]\s+/,(m,c)=>c===' '?'☐ ':'☑ ');
  const whole=x=>{const m=/^\*\*([^*]+)\*\*([.:]?)$/.exec(x.trim());return m?m[1]+m[2]:x};
  const flushL=()=>{if(!list)return;out.push('<'+list.t+(list.t==='ol'&&list.s!==1?' start="'+list.s+'"':'')+'>'+list.items.map(x=>'<li>'+mdInl(chk(whole(x)))+'</li>').join('')+'</'+list.t+'>');list=null};
  const flushT=()=>{
    if(!rows)return;const R=rows;rows=null;
    if(R.length===1){out.push('<p>'+mdInl(R[0])+'</p>');return}
    const sep=MDSEP.test(R[1]),head=sep?mdCells(R[0]):null,body=(sep?R.slice(2):R).filter(l=>!MDSEP.test(l)).map(mdCells);
    const n=Math.max(head?head.length:0,...body.map(r=>r.length)),fill=r=>r.concat(Array(Math.max(0,n-r.length)).fill(''));
    out.push('<div class="mdt"><table>'+(head?'<thead><tr>'+fill(head).map(c=>'<th>'+mdInl(c)+'</th>').join('')+'</tr></thead>':'')+
      '<tbody>'+body.map(r=>'<tr>'+fill(r).map(c=>'<td>'+mdInl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>')};
  String(text==null?'':text).split(/\r?\n/).forEach(l=>{
    if(code){if(/^\s*```/.test(l)){out.push('<pre class="mdpre">'+esc(code.join('\n'))+'</pre>');code=null}else code.push(l);return}
    if(/^\s*```/.test(l)){flushL();flushT();code=[];return}
    if(/^\s*\|/.test(l)){flushL();(rows||(rows=[])).push(l);return}
    flushT();
    const ul=/^\s*[-*+]\s+(.*)$/.exec(l),ol=/^\s*(\d+)[.)]\s+(.*)$/.exec(l),hd=/^#{1,6}\s+(.*)$/.exec(l);
    if(ul||ol){const t=ul?'ul':'ol';if(list&&list.t!==t)flushL();if(!list)list={t:t,s:ol?+ol[1]:1,items:[]};list.items.push(ul?ul[1]:ol[2]);return}
    if(list&&/^\s{2,}\S/.test(l)){list.items[list.items.length-1]+=' · '+l.trim();return}
    flushL();
    if(hd)out.push('<h3>'+mdInl(hd[1])+'</h3>');
    else if(/^\s*>/.test(l))out.push('<p class="mdq">'+mdInl(l.replace(/^\s*>\s?/,''))+'</p>');
    else if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l))return;
    else if(l.trim())out.push('<p>'+mdInl(l)+'</p>');
  });
  if(code)out.push('<pre class="mdpre">'+esc(code.join('\n'))+'</pre>');
  flushL();flushT();
  return out.join('');
}

const tyWaits=x=>!!x.t&&!!x.t.waits&&x.t.waits.length>0&&x.t.state!=='done';
const tyKind=x=>x.q?'q':x.need==='zgoda'?'zg':x.need==='odbiór'?'od':'z';
const tyPid=x=>x.q?x.q.p.id:x.t.project;
/* grupowanie wierszy w Dla Ciebie: sprawy o tym samym kluczu (≥ min) w jednym zwijanym wierszu na miejscu pierwszej z nich */
function tyFold(L,o,keyOf,min,sumOf){
  const C={};L.forEach(x=>{const k=keyOf(x);if(k)C[k]=(C[k]||0)+1});
  const done={};
  return L.map(x=>{const k=keyOf(x);
    if(!k||C[k]<min)return todayRow(x,o);
    if(done[k])return '';done[k]=1;
    const G=L.filter(y=>keyOf(y)===k),dk='tyg-'+o.grp+'-'+k;
    return '<li class="ty-pg"><details data-pvdet="'+esc(dk)+'"'+(PF.more[dk]?' open':'')+'><summary>'+sumOf(G)+'</summary><ul class="rows">'+G.map(y=>todayRow(y,o)).join('')+'</ul></details></li>'}).join('');
}
