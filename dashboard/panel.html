<title>Panel projektów</title>
<style>
/* Pulpit projektów: panel boczny (widoki + lista projektów z wyszukiwarką), obszar główny, szuflada szczegółów.
   Wygląd według ksiega/pulpit-projektow.html, dane z /api/data. Kontrakt: dashboard/PULPIT.md. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --sunk:#f0f2f5; --hover:#eef1f6; --line:#dde1e7; --line-2:#c9ced8;
  --ink:#1d2433; --ink-2:#465163; --ink-3:#687385; --accent:#2563c9; --accent-ink:#ffffff; --accent-soft:#e3ecfb;
  --l-grey-bg:#e4e7ec; --l-grey:#3b4454; --l-blue-bg:#dbe7fd; --l-blue:#1d4fa8; --l-green-bg:#d9f5e1; --l-green:#176a32;
  --l-yellow-bg:#fff0bf; --l-yellow:#6e4d00; --l-red-bg:#ffe1de; --l-red:#a8281a; --l-purple-bg:#ebe3ff; --l-purple:#5636b8;
  --bar-done:#2a8a4a; --bar-rev:#7c5cd6; --bar-wip:#2563c9; --bar-warn:#d99a00;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#4f9a2c; --c7:#6250d6; --c8:#d63f3f;
  --s1:#86b6ef; --s2:#5598e7; --s3:#2a78d6; --s4:#184f95;
  --scrim:rgba(9,15,30,.35);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px; --side:248px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171c; --surface:#1d2027; --sunk:#22262e; --hover:#262a33; --line:#30353f; --line-2:#3d4350;
  --ink:#e7e9ee; --ink-2:#b9bfca; --ink-3:#8d95a3; --accent:#6b9ef0; --accent-ink:#0f1420; --accent-soft:#1f2c45;
  --l-grey-bg:#2f343e; --l-grey:#c9ced8; --l-blue-bg:#1d3157; --l-blue:#a9c6ff; --l-green-bg:#173a25; --l-green:#8fe0a8;
  --l-yellow-bg:#3d3112; --l-yellow:#f3cf6b; --l-red-bg:#45201d; --l-red:#ffaaa0; --l-purple-bg:#2f2550; --l-purple:#c9b6ff;
  --bar-done:#4cb46c; --bar-rev:#a08af0; --bar-wip:#6b9ef0; --bar-warn:#e0aa2a;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#4f9e34; --c7:#9085e9; --c8:#e05a5a;
  --s1:#184f95; --s2:#2a78d6; --s3:#5598e7; --s4:#86b6ef;
  --scrim:rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171c; --surface:#1d2027; --sunk:#22262e; --hover:#262a33; --line:#30353f; --line-2:#3d4350;
  --ink:#e7e9ee; --ink-2:#b9bfca; --ink-3:#8d95a3; --accent:#6b9ef0; --accent-ink:#0f1420; --accent-soft:#1f2c45;
  --l-grey-bg:#2f343e; --l-grey:#c9ced8; --l-blue-bg:#1d3157; --l-blue:#a9c6ff; --l-green-bg:#173a25; --l-green:#8fe0a8;
  --l-yellow-bg:#3d3112; --l-yellow:#f3cf6b; --l-red-bg:#45201d; --l-red:#ffaaa0; --l-purple-bg:#2f2550; --l-purple:#c9b6ff;
  --bar-done:#4cb46c; --bar-rev:#a08af0; --bar-wip:#6b9ef0; --bar-warn:#e0aa2a;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#4f9e34; --c7:#9085e9; --c8:#e05a5a;
  --s1:#184f95; --s2:#2a78d6; --s3:#5598e7; --s4:#86b6ef;
  --scrim:rgba(0,0,0,.5);
  color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
code{font:12.5px/1.45 var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:0 5px;overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)} .soft{color:var(--ink-2)}

.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
/* panel boczny */
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .mark{width:28px;height:28px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.brand b{font-size:15px;display:block;line-height:1.2}
.brand small{font-size:12px;color:var(--ink-3)}
.nav{display:grid;gap:2px}
.nav a,.plist a{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--r);color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover,.plist a:hover{background:var(--hover);color:var(--ink)}
.nav a[aria-current="page"],.plist a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:16px;height:16px;flex:none}
.nav .count{margin-left:auto;font-size:12px;font-weight:600;background:var(--l-purple-bg);color:var(--l-purple);border-radius:10px;padding:0 7px}
.nav .count.blue{background:var(--l-blue-bg);color:var(--l-blue)}
.sidehead{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:0 8px;display:flex;justify-content:space-between}
.search{position:relative;display:block}
.search input{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:6px 10px 6px 30px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink-3)}
.plist{display:grid;gap:1px}
.plist .av{width:22px;height:22px;font-size:10px}
.plist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .ph{font-size:11px;color:var(--ink-3);white-space:nowrap}
.sidefoot{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;padding:0 6px}
.av{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:11px;flex:none;letter-spacing:.02em}
.av.sm{width:18px;height:18px;font-size:9px;border-radius:4px}

/* obszar główny */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;padding:12px 24px;padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.crumbs{font-size:13px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.crumbs a{color:var(--ink-3);text-decoration:none}
.crumbs a:hover{color:var(--accent);text-decoration:underline}
.tstat{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.content{padding:20px 24px 40px;padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:20px;max-width:1320px;width:100%;align-content:start}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.pagehead h1{font-size:22px;font-weight:650}
.pagehead p{color:var(--ink-3)}
.mobilenav{display:none}
.banners{display:grid;gap:8px;padding:0 24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.banners:empty{display:none}
.banners>div:first-child{margin-top:12px}
.banner{border:1px solid var(--line-2);border-radius:8px;padding:9px 14px;background:var(--surface);color:var(--ink-2);overflow-wrap:anywhere}
.banner.bad{border-color:var(--l-red);background:var(--l-red-bg);color:var(--l-red)}

/* plakietki, przyciski, pola */
.lz{display:inline-flex;align-items:center;gap:4px;border-radius:3px;padding:1px 6px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;line-height:18px}
.lz.grey{background:var(--l-grey-bg);color:var(--l-grey)} .lz.blue{background:var(--l-blue-bg);color:var(--l-blue)}
.lz.green{background:var(--l-green-bg);color:var(--l-green)} .lz.yellow{background:var(--l-yellow-bg);color:var(--l-yellow)}
.lz.red{background:var(--l-red-bg);color:var(--l-red)} .lz.purple{background:var(--l-purple-bg);color:var(--l-purple)}
.lz.out{background:transparent;border:1px solid var(--line-2);color:var(--ink-2);line-height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;background:var(--surface)}
.pill b{font-weight:600;color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--bar-done)} .dot.warn{background:var(--bar-warn)} .dot.bad{background:var(--l-red)} .dot.you{background:var(--bar-rev)} .dot.off{background:var(--line-2)} .dot.run{background:var(--bar-wip)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:6px 12px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.sec:hover{background:var(--hover);filter:none}
.btn.sm{padding:2px 9px;font-size:13px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:default;filter:none}
.lk{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left;overflow-wrap:anywhere}
.lk:hover{color:var(--accent);text-decoration:underline}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13px;font-weight:600;justify-self:start}
.fi{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:5px 9px;min-width:0;max-width:100%}
.fi::placeholder{color:var(--ink-3)}
textarea.fi{resize:vertical;width:100%}
.sw{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:2px 10px 2px 4px;cursor:pointer;font-size:13px;color:var(--ink-2);white-space:nowrap}
.sw::before{content:"";width:28px;height:16px;border-radius:999px;background:radial-gradient(circle at 8px 8px,var(--ink-3) 0 5px,transparent 5.5px),var(--sunk);border:1px solid var(--line)}
.sw[aria-checked="true"]{color:var(--ink);border-color:var(--accent)}
.sw[aria-checked="true"]::before{background:radial-gradient(circle at 20px 8px,var(--accent-ink) 0 5px,transparent 5.5px),var(--accent)}

/* karty, panele */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel>h2{font-size:15px;font-weight:650;padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel>h2 small{font-size:12px;font-weight:500;color:var(--ink-3)}
.panel>h2 small a{color:var(--ink-3)}
.pad{padding:0 16px 14px;display:grid;gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;display:grid;gap:2px;min-width:0;text-decoration:none;color:inherit}
a.stat:hover{border-color:var(--line-2);background:var(--hover)}
.stat .l{font-size:13px;color:var(--ink-2);font-weight:500}
.stat .v{font-size:26px;font-weight:650;line-height:1.2}
.stat .d{font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.stat.red .v{color:var(--l-red)} .stat.purple .v{color:var(--l-purple)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.sys{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

/* listy */
.rows{list-style:none;margin:0;padding:0 16px 8px}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.rows li:first-child{border-top:0}
.rows .t{font-weight:500;display:block}
.rows .s{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.rows .r{text-align:right;font-size:13px;white-space:nowrap;display:grid;gap:4px;justify-items:end}
.rows .r.late{color:var(--l-red);font-weight:650}
.rows a{color:inherit;text-decoration:none}
.rows a:hover .t{color:var(--accent);text-decoration:underline}
.empty{padding:12px 16px 16px;color:var(--ink-3)}
.rows li.empty{display:block;padding:10px 0}
.pmn{padding:0 16px 14px;color:var(--ink-2)}
.pmn h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:10px 0 4px}
.pmn h3:first-child{margin-top:0}
.pmn ul{margin:0;padding-left:18px}
.pmn li{margin-top:3px}
.pmn b{color:var(--ink)}

/* tabela projektów */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--ink-3);text-align:left;padding:8px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr[data-go]{cursor:pointer}
tbody tr[data-go]:hover td{background:var(--hover)}
.proj{display:flex;gap:10px;min-width:200px}
.proj b{display:block;font-size:14px}
.proj b a{color:var(--ink);text-decoration:none}
.proj b a:hover{color:var(--accent);text-decoration:underline}
.proj p{font-size:13px;color:var(--ink-3);max-width:48ch;line-height:1.4}
.phase{display:grid;gap:4px;min-width:120px}
.phase .steps{display:flex;gap:3px}
.phase .steps i{height:6px;flex:1;border-radius:2px;background:var(--line)}
.phase .steps i.done{background:var(--ink-3)}
.phase .steps i.cur{background:var(--accent)}
.phase span{font-size:13px;font-weight:600}
.prog{display:grid;gap:4px;min-width:130px}
.track{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;display:flex;border:1px solid var(--line)}
.track i{height:100%;display:block}
.prog span{font-size:12px;color:var(--ink-2)}
.due b{display:block;font-size:13px;font-weight:600;white-space:nowrap}
.due span{font-size:12px;color:var(--ink-3)}
.due.late b{color:var(--l-red)}
.dt{font-size:13px}.dt th,.dt td{padding:6px 8px;text-align:right}.dt th:first-child,.dt td:first-child{text-align:left}
.mx td,.mx th{padding:8px 10px;font-size:13px}

/* strona projektu */
.phead{display:grid;gap:12px}
.ptitle{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.ptitle .av{width:40px;height:40px;font-size:14px;border-radius:8px}
.ptitle h1{font-size:22px;font-weight:650;overflow-wrap:anywhere}
.desc{max-width:75ch;color:var(--ink-2);font-size:15px}
.stepper{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.stepper button{all:unset;box-sizing:border-box;border-top:4px solid var(--line);padding-top:6px;font-size:12px;color:var(--ink-3);cursor:pointer;min-width:0}
.stepper button[disabled]{cursor:default}
.stepper button:not([disabled]):hover b{color:var(--accent)}
.stepper button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stepper b{display:block;font-size:13px;color:var(--ink-2);font-weight:600}
.stepper .done{border-color:var(--ink-3)}
.stepper .cur{border-color:var(--accent)}
.stepper .cur b{color:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:grid;gap:2px;min-width:0}
.fact .l{font-size:12px;color:var(--ink-3);font-weight:500}
.fact .v{font-size:15px;font-weight:650;overflow-wrap:anywhere}
.fact .d{font-size:12px;color:var(--ink-3)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.tabs a{padding:8px 12px;color:var(--ink-2);text-decoration:none;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--accent);border-color:var(--accent)}

/* tablica */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{background:var(--sunk);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:120px;min-width:0}
.col h3{font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;padding:4px 6px;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:8px;cursor:pointer;text-align:left;width:100%;box-shadow:0 1px 1px rgba(9,30,66,.08);min-width:0}
.card:hover{border-color:var(--line-2);background:var(--hover)}
.card .tt{font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.card .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.card .bd{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2)}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.who{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2)}
.who i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;color:#fff}
.dl{font-size:12px;font-weight:600;white-space:nowrap}
.dl.late{color:var(--l-red)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar select,.toolbar .tg{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:5px 10px;max-width:100%;min-width:0}
.toolbar .tg{cursor:pointer;font-weight:500}
.toolbar .tg[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.addf{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addf .fi[name="title"]{flex:1;min-width:160px}
.addf select{max-width:100%}

/* etapy */
.stagelist{list-style:none;margin:0;padding:0 16px 8px}
.stagelist li{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.stagelist li:first-child{border-top:0}
.stagelist .nm b{display:block}
.stagelist .nm span{font-size:12px;color:var(--ink-3)}
.stagelist .ed{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tl{position:relative;height:22px;background:var(--sunk);border-radius:4px}
.tl .b{position:absolute;top:4px;bottom:4px;border-radius:3px}
.tl .today{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--l-red)}

/* księga */
.check{list-style:none;margin:0;padding:0 16px 8px}
.check>li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.check>li:first-child{border-top:0}
.qa{list-style:none;margin:0;padding:0 16px 8px}
.qa>li{padding:12px 0;border-top:1px solid var(--line)}
.qa>li:first-child{border-top:0}
.qa .q{font-size:14px;line-height:1.45}
.qa .s{font-size:12.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qa form{display:flex;gap:8px;margin-top:8px;align-items:flex-start}
.qa textarea{flex:1;min-width:0;min-height:38px;resize:vertical;font:inherit;font-size:13.5px}
.qa .ans{margin-top:6px;font-size:13.5px;color:var(--ink-2);border-left:3px solid var(--line-2);padding-left:8px}

.steps-ro label{cursor:pointer}
.dform{display:grid;gap:8px;min-width:0}
.fl{display:grid;gap:3px;font-size:12.5px;color:var(--ink-3);min-width:0;flex:1}
.fl .fi{width:100%;color:var(--ink);font-size:14px}
.abox .row .fl{min-width:140px}

/* Dziś: liczniki, pasek serwera */
.ycnt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 16px 10px;max-width:600px}
.ycnt a{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;border:1px solid var(--line);border-radius:8px;padding:4px 12px;color:var(--ink-2);text-decoration:none;font-size:13px;line-height:1.3;min-width:0}
.ycnt a:hover{background:var(--hover)}
.ycnt b{font-size:18px;font-weight:650;color:var(--ink)}
.ycnt a.now b{color:var(--l-purple)}
.srvbar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--bar-done);border-radius:8px;padding:8px 12px;background:var(--surface);font-size:13px;min-width:0}
.srvbar.warn{border-left-color:var(--bar-warn)}
.srvbar.bad{border-left-color:var(--l-red)}
.srvbar>b{margin-right:4px}
.pagehead .srvbar{margin-top:8px}

/* dziś, następny krok, karty projektów */
.nx{display:grid;gap:2px;min-width:150px;max-width:240px}
.nx .lk,.nx b{font-size:13px;font-weight:600;line-height:1.35}
.nx span{font-size:12px;color:var(--ink-3)}
.nx span.late{color:var(--l-red);font-weight:600}
.pcards{display:none;list-style:none;margin:0;padding:0 16px 12px;gap:10px}
.pcard{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;cursor:pointer;min-width:0}
.pcard:hover{background:var(--hover)}
.pcard .ph1{display:flex;gap:10px;align-items:center;min-width:0}
.pcard .ph1 a{font-weight:650;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.pcard .ph1 .lz{margin-left:auto}
.pcard .ph1 a:hover{color:var(--accent);text-decoration:underline}
.pcard .tg2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-2)}
.pcard .kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13px;align-items:baseline}
.pcard .kv>span:nth-child(odd){color:var(--ink-3);font-size:12px}
.pcard .nx{max-width:none;min-width:0}
.colsw{display:none;gap:4px;flex-wrap:wrap}
.colsw .seg{flex:1;min-width:0}
.board .more{display:none;font-size:12.5px;color:var(--ink-3);padding:0 6px}
.bnav{display:none}

/* tekst z plików (md): tabele przewijane w poziomie we własnym kontenerze, listy numerowane, linki, kod */
.mdt{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;margin:6px 0;border:1px solid var(--line);border-radius:6px}
.mdt table{width:auto;min-width:100%;font-size:13px}
.mdt th,.mdt td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;min-width:7em;overflow-wrap:break-word;word-break:normal;white-space:normal}
.mdt th{font-size:12px;color:var(--ink-2);border-bottom-width:2px}
.mdt tr:last-child td{border-bottom:0}
.mdx ol,.pmn ol,.pmt ol{margin:4px 0;padding-left:22px}
.mdx li,.pmt li{margin-top:2px}
.mdx a,.pmn a,.pmt a{overflow-wrap:anywhere}
.mdpre{font:12px/1.45 var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0;overflow-x:auto;white-space:pre;max-width:100%}
.mdq{border-left:3px solid var(--line-2);padding-left:8px;color:var(--ink-3)}
.plan .pmt ul,.plan .pmt ol{list-style:revert;padding-left:20px}
.plan .pmt li{display:list-item;border-top:0;padding:2px 0}
/* zmiany agenta: pliki, diff, scalanie */
.chg{display:grid;gap:6px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px}
.chg .sub{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.chg .br{font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}
.chl{list-style:none;margin:0;padding:0;font-size:13px;display:grid;gap:2px;max-height:200px;overflow:auto}
.chl li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:baseline}
.chl code{background:none;border:0;padding:0;overflow-wrap:anywhere}
.chg .ad{color:var(--l-green);font-weight:600}
.chg .rm{color:var(--l-red);font-weight:600}
.qa .row{display:flex;gap:8px;flex-wrap:wrap}
.diff{font:12px/1.45 var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:6px;margin:0;max-height:420px;overflow:auto;white-space:pre;padding:6px 0;-webkit-overflow-scrolling:touch}
.diff .dw{display:inline-block;min-width:100%}
.diff .dw>span{display:block;padding:0 10px}
.diff .da{background:var(--l-green-bg);color:var(--l-green)}
.diff .dr{background:var(--l-red-bg);color:var(--l-red)}
.diff .dk{color:var(--l-blue)}
.diff .dh{color:var(--ink-3);font-weight:600}
/* Dziś: warunek ukończenia, plan ponad pojemność, propozycje, pomiary */
.gw{font-size:12.5px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gw.none{color:var(--ink-3)}
.over{margin:0 16px 10px;border:1px solid var(--bar-warn);background:var(--l-yellow-bg);color:var(--l-yellow);border-radius:8px;padding:8px 12px;display:grid;gap:6px;font-size:13px;min-width:0}
.over ul{margin:0;padding-left:18px}
.over li{overflow-wrap:anywhere}
.over .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prop{font-size:13px;color:var(--ink-2);margin-top:4px;overflow-wrap:anywhere}
.mform{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;margin-top:6px}
.mform .fl{flex:0 1 auto}
.mform .fi{width:130px}
.pst{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pst .wide{grid-column:1/-1}
.pstat{font-size:12px;color:var(--ink-3)}
.sline{display:none}
/* runda 5: następny krok, odblokowania, kontrola serwera, skutki pytań, toast */
.gw.w,.prop{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
.eff{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.eff li,.rows .eff li{display:list-item;border-top:0;padding:0;overflow-wrap:anywhere;margin-top:2px}
.effh{font-size:12px;font-weight:700;color:var(--ink-3);margin-top:6px}
.abox.ok{border-color:var(--bar-done);background:var(--l-green-bg)}
.chkd{margin:0 16px 10px;border:1px solid var(--bar-done);background:var(--l-green-bg);border-radius:8px;padding:6px 12px 2px;min-width:0}
.chkd>b{font-size:13px;color:var(--l-green)}
.chkd .rows{padding:0}
.chkd .rows li{border-top-color:var(--line-2)}
.unl{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.unl li{overflow-wrap:anywhere;line-height:1.4}
.unl .muted{font-size:12.5px}
.cnl{white-space:normal;max-width:240px;font-size:12px;overflow-wrap:anywhere}
.hcnt{display:inline-block;font-size:14px;font-weight:650;background:var(--l-purple-bg);color:var(--l-purple);border-radius:10px;padding:0 9px;vertical-align:middle;margin-left:6px;line-height:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:40;width:max-content;max-width:min(560px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 14px;font-size:14px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.25);overflow-wrap:anywhere;cursor:pointer}
.toast:empty{opacity:0;pointer-events:none;padding:0;box-shadow:none}

@media (max-width:1100px){
  .stats,.facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.cgrid{grid-template-columns:minmax(0,1fr)}
  .kgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mobilenav{display:flex;gap:8px;width:100%}
  .mobilenav select{flex:1;min-width:0;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:6px 8px}
  .topbar,.content,.banners{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .stepper{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:10px}
  .stagelist li{grid-template-columns:minmax(0,1fr);gap:6px}
  .stagelist .ed{justify-content:flex-start}
  .padd{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:620px){
  .kgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:minmax(0,1fr)}
  /* lista uruchomień (Agenci, Teraz): stan i czas w pierwszym wierszu, tytuł z opisem na całą szerokość pod nimi */
  .runs li{grid-template-columns:auto minmax(0,1fr);row-gap:4px}
  .runs li>span:first-child{grid-row:1;grid-column:1}
  .runs li>div{grid-row:2;grid-column:1/-1}
  .runs .wh{grid-row:1;grid-column:2;text-align:right}
  .drawer dl{grid-template-columns:minmax(0,1fr);gap:2px}
  .drawer dd{margin-bottom:8px}
  .hbar{grid-template-columns:80px minmax(0,1fr) 78px}
  .abar .sp{display:none}
  /* telefon: pola 16 px (iOS nie powiększa), przyciski 40 px, dolny pasek */
  input,select,textarea:not(.ttl){font-size:16px!important}
  .btn,.btn.sm,.seg,.x,.tg,.chip,.sw,.toolbar select,.fi:not(textarea){min-height:40px}
  .btn.sm{padding:4px 12px}
  .tw.ptable{display:none}
  .pcards{display:grid}
  .colsw{display:flex}
  .board .col:not(.on){display:none}
  .board .col.done .old{display:none}
  .board .col.done .more{display:block}
  .bnav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
    padding:4px max(4px,env(safe-area-inset-right,0px)) max(4px,env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  .bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;padding:4px 1px;border-radius:var(--r);color:var(--ink-2);text-decoration:none;font-size:11px;font-weight:600;position:relative;min-width:0;text-align:center;line-height:1.2}
  .bnav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
  .bnav svg{width:20px;height:20px}
  .bnav .count{position:absolute;top:2px;left:calc(50% + 6px);font-size:10.5px;font-weight:700;background:var(--l-purple-bg);color:var(--l-purple);border-radius:9px;padding:0 5px;line-height:16px}
  .bnav .count.blue{background:var(--l-blue-bg);color:var(--l-blue)}
  .bnav .count.plain{background:var(--surface);color:var(--ink-3);border:1px solid var(--line);line-height:14px}
  .content{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .drawer{padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}
  .nx{max-width:none}
  /* telefon: jedna linia stanu zamiast pigułek, Dziś zaraz pod nagłówkiem */
  .sline{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface);font-size:13.5px;color:var(--ink-2);text-decoration:none;margin-top:8px;min-width:0}
  .sline.s-ok{border-left:4px solid var(--bar-done)}
  .sline.s-warn{border-left:4px solid var(--bar-warn)}
  .sline.s-bad{border-left:4px solid var(--l-red)}
  .sline span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pagehead .sys,.pagehead .srvbar,.pvwarn{display:none}
  .pst{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  /* telefon: „gotowe, gdy” i następny krok w całości */
  .gw{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
  .toast{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .chkd .r{white-space:normal}
}
@media (max-width:480px){.stats,.facts{grid-template-columns:minmax(0,1fr)}
  .rows:not(.runs):not(.plx) li{grid-template-columns:minmax(0,1fr)}
  .rows:not(.runs):not(.plx) .r{text-align:left;justify-items:start;display:flex;gap:8px;align-items:center;flex-wrap:wrap;white-space:normal}
  .rows:not(.runs):not(.plx) .r br{display:none}
  .rows:not(.runs):not(.plx) .r>span>span.muted{margin-left:6px}}

/* Teraz (Przegląd): jedna sekcja — trwa, zaplanowane publikacje, ostatnie 24 h; prefiks nw- */
.nw-head{display:flex;align-items:center;gap:8px}
.nw-head .dot{width:9px;height:9px}
.nw-idle{margin:0;padding:0 16px 14px;color:var(--ink-2);font-size:13.5px}
.nw-idle .linkbtn,.nw-idle a{margin-left:4px}
.nw-sub{display:flex;justify-content:space-between;align-items:center;gap:4px 8px;flex-wrap:wrap;margin:0;padding:10px 16px 2px;border-top:1px solid var(--line);font-size:13.5px;font-weight:650;color:var(--ink)}
.nw-sub small{font-size:12px;font-weight:500;color:var(--ink-3)}
.nw-sub small a{color:var(--ink-3)}
.nw-tog{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.nw-tog:hover{color:var(--accent)}
.nw-car{display:inline-block;width:1em;color:var(--ink-3)}
.nw-fail{margin:0;padding:6px 16px 0;font-size:12.5px;font-weight:650;color:var(--l-red)}
.nw-rows .s{row-gap:2px}
.nw-act{flex-basis:100%;color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere;min-width:0}
.nw-why{flex-basis:100%;color:var(--l-red);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere;min-width:0}
.nw-err{color:var(--l-red);font-weight:650}
.nw-more{padding:0 16px 12px;margin:0}
.nw-rows .wh{font-variant-numeric:tabular-nums}
.nw-m{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.nw-dot{color:var(--ink-3)}
.nw-do{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.nw-nb{white-space:nowrap}
.nw-hs{display:inline-flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.nw-au{white-space:nowrap}
.nw-note{margin:0;padding:2px 16px 8px;font-size:12px;color:var(--ink-3)}
.nw-note.nw-bad{color:var(--l-red)}
.nw-foot{margin:0;padding:4px 16px 12px;border-top:1px solid var(--line);font-size:12.5px}
.nw-foot a{color:var(--ink-3)}
.nw-last{padding-top:0}
@keyframes nw-pulse{0%,100%{opacity:1}50%{opacity:.35}}
.nw-live{animation:nw-pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.nw-live{animation:none}}
/* desktop: znaczniki w jednej kolumnie o stałej szerokości, tytuły zaczynają się w tym samym miejscu */
@media (min-width:621px){.nw-rows li{grid-template-columns:10rem minmax(0,1fr) auto}.nw-rows li>span:first-child .lz{white-space:normal}}
.mk-hit{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Blokady: drzewo zależności (po:/unlocks); prefiks bk- */
.bk-line{display:flex;align-items:center;gap:8px;margin:0 16px 10px;padding:8px 12px;border-radius:8px;background:var(--l-purple-bg);color:var(--l-purple);text-decoration:none;font-size:13.5px;min-width:0}
.bk-line svg{width:16px;height:16px;flex:none}
.bk-line span{min-width:0;flex:1}
.bk-line b{font-weight:650;white-space:nowrap}
.bk-line:hover b{text-decoration:underline}
.pagehead+.bk-line{margin:0 0 14px}
.bk-intro{color:var(--ink-3);font-size:13px;padding:0 16px 10px;max-width:80ch;margin:0}
.bk-tree,.bk-sub{list-style:none;margin:0;padding:0}
.bk-tree{padding:0 16px 10px}
.bk-tree>.bk-node{border-top:1px solid var(--line)}
.bk-tree>.bk-node:first-child{border-top:0}
.bk-sub{margin-left:11px;padding-left:14px;border-left:2px solid var(--line)}
.bk-row{display:flex;align-items:flex-start;justify-content:space-between;gap:6px 8px;padding:9px 0;flex-wrap:wrap}
.bk-sub .bk-row{padding:6px 0}
.bk-main{min-width:0;flex:1 1 220px}
.bk-t{font-weight:500;display:block;text-align:left}
.bk-tree>.bk-node>.bk-row .bk-t{font-weight:600}
.bk-meta{font-size:12px;color:var(--ink-3);display:flex;gap:4px 8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.bk-n{font-size:12.5px;color:var(--ink-2);white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:1px 9px;background:var(--sunk)}
.bk-n b{font-weight:700;color:var(--ink)}
.bk-nn{display:none}
/* Twoje: tło i pasek po lewej; w poddrzewie bez przesunięcia tytułu względem rodzeństwa (ujemny margines = padding) */
/* „Twoje”: pełne wyróżnienie tylko korzenia (do zrobienia teraz); niżej i na listach sam pasek po lewej */
.bk-tree>.bk-you>.bk-row{background:var(--l-purple-bg);border-radius:6px;padding-left:8px;padding-right:8px;margin:4px -8px;box-shadow:inset 3px 0 0 var(--l-purple)}
.bk-tree>.bk-you>.bk-row .bk-n{background:var(--surface);border-color:var(--l-purple)}
.bk-tree>.bk-you>.bk-row .bk-n b{color:var(--l-purple)}
.bk-youl>.bk-row{box-shadow:inset 2px 0 0 var(--l-purple);padding-left:8px}
.bk-sub>.bk-youl>.bk-row{margin-left:-14px;padding-left:12px}
.bk-later{color:var(--l-purple);font-weight:600}
.bk-tog{flex:none;width:24px;height:24px;margin:-1px 0 0 -4px;display:inline-flex;align-items:center;justify-content:center;background:none;border:0;border-radius:4px;padding:0;font:inherit;font-size:15px;color:var(--ink-3);cursor:pointer}
.bk-tog:hover{color:var(--accent);background:var(--hover)}
.bk-tg0{flex:none;width:20px}
.bk-row>.bk-main{order:1}
.bk-row>.bk-n{order:2}
.bk-then{font-size:11.5px;color:var(--ink-3);margin:0 0 0 24px;letter-spacing:.01em}
.bk-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bk-legend{display:flex;align-items:center;gap:6px}
.bk-cdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.bk-gh{margin:0;padding:10px 16px 0;font-size:13px;font-weight:650;color:var(--l-red);overflow-wrap:anywhere}
.bk-gh small{color:var(--ink-3);font-weight:500}
.bk-rep .bk-t{font-weight:400;color:var(--ink-2)}
.bk-cut{display:inline-block;font-size:12.5px;padding:4px 0;margin:0 0 6px;text-align:left}
.bk-jump{font-size:12px}
.bk-sum{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.bk-go{cursor:pointer;font:inherit;font-size:12.5px}
.bk-go1{white-space:normal;text-align:left}
.bk-go:hover{border-color:var(--line-2);background:var(--hover)}
.bk-crit>.bk-row>.bk-main>.bk-t::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:middle}
.bk-hit>.bk-row{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:no-preference){.bk-hit>.bk-row,.mk-hit{transition:outline-color .3s}}
.bk-why{font-size:12.5px;color:var(--l-red);margin-top:2px;overflow-wrap:anywhere}
.bk-why.none{color:var(--ink-3)}
.nav .count.plain{background:transparent;color:var(--ink-3);border:1px solid var(--line)}
@media (max-width:620px){
  .nw-more .linkbtn,.nw-tog,.nw-idle .linkbtn,.bk-cut,.bk-jump{min-height:40px;display:inline-flex;align-items:center}
  .bk-sum .bk-go:not(.bk-go1){display:none}
  .bk-line{margin:0 12px 10px}

<script>
(function(){
'use strict';
const PREVIEW=/*PREVIEW*/null;

/* ---------- pomocnicze ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromKey=k=>{const a=String(k).split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const addK=(k,n)=>key(addDays(fromKey(k),n));
const diff=(a,b)=>Math.round((fromKey(a)-fromKey(b))/864e5);
const isDay=s=>/^\d{4}-\d\d-\d\d$/.test(s||'');
const DN=['niedz.','pon.','wt.','śr.','czw.','pt.','sob.'];

const MD=['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const pl=(n,a,b,c)=>n===1?a:(n%10>=2&&n%10<=4&&(n%100<12||n%100>14))?b:c;
const dd=k=>{const d=fromKey(k);return d.getDate()+'.'+pad(d.getMonth()+1)};
const ddl=k=>DN[fromKey(k).getDay()]+' '+dd(k);
const dLong=k=>{const d=fromKey(k);return DNI[d.getDay()]+', '+d.getDate()+' '+MD[d.getMonth()]+' '+d.getFullYear()};
const dTo=k=>diff(k,D.todayKey);
const relN=d=>d<0?'po terminie '+(-d)+' '+pl(-d,'dzień','dni','dni'):d===0?'dziś':d===1?'jutro':'za '+d+' '+pl(d,'dzień','dni','dni');
const rel=k=>relN(dTo(k));
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const dur=m=>{const h=Math.floor(m/60),r=m%60;return h&&r?h+' h '+r+' min':h?h+' h':r+' min'};
const fmt1=v=>String(Math.round(v*10)/10).replace('.',',');
const fmtN=n=>{n=+n||0;return Number.isInteger(n)?String(n):n.toFixed(1).replace('.',',')};
const col=c=>/^#[0-9a-f]{6}$/i.test(c||'')?c:'#8d95a3';
function resolveRel(v,today){
  if(typeof v==='number')v=(v>=0?'+':'')+v;
  const m=/^([+-]\d+)(T\d\d:\d\d)?$/.exec(typeof v==='string'?v:'');
  return m?key(addDays(today,+m[1]))+(m[2]||''):v;
}

const PHASES=[['pomysl','Pomysł'],['ksiega','Księga'],['budowa','Budowa'],['wdrozenie','Wdrożenie'],['marketing','Marketing'],['utrzymanie','Utrzymanie']];
const PHI={};PHASES.forEach((x,i)=>PHI[x[0]]=i);
const WHO={claude:{n:'Claude',c:'#c4673d',i:'C'},codex:{n:'Codex',c:'#3f7d5c',i:'X'},ty:{n:'Ty',c:'#5636b8',i:'Ty'},'':{n:'Nieprzypisane',c:'#7a8494',i:'–'}};
const COLS=[['todo','Do zrobienia'],['wip','W toku'],['rev','Do odbioru'],['done','Zrobione']];
const ST={ok:['green','w normie'],risk:['yellow','zagrożony'],late:['red','po terminie'],you:['purple','czeka na Ciebie'],done:['grey','zrobione'],none:['out','bez terminu'],
  backlog:['grey','backlog'],paused:['grey','wstrzymany'],finished:['grey','zakończony']};
const TS={todo:['grey','do zrobienia'],doing:['blue','w toku'],blocked:['red','zablokowane'],done:['green','zrobione']};
const CST={plan:['out','planowana'],active:['green','w toku'],done:['grey','zakończona'],paused:['yellow','wstrzymana']};
/* D13: panel i agenci na serwerze w chmurze; Mac do Chrome, iOS i Androida; Windows na godziny (pole gdzie: pc) */
const MACH={pc:'Windows',mac:'Mac',cloud:'serwer'};
const MACHL={pc:'na Windows',mac:'na Macu',cloud:'na serwerze'};
const AVINK=['#fff','#fff','#0b2a1f','#2b1d00','#3a0f22','#fff','#fff','#fff'];
const INBOX='Do rozplanowania';
const VIEWS=['przeglad','wskazniki','ty','marketing','tablica','terminy','blokady','agenci','koszty','projekty'];
const VNAME={przeglad:'Przegląd',wskazniki:'Wskaźniki',ty:'Wymaga Ciebie',marketing:'Marketing',tablica:'Tablica zadań',terminy:'Terminy',blokady:'Blokady',agenci:'Agenci',koszty:'Koszty',projekty:'Projekty i standard'};
const PTABS=[['tablica','Tablica'],['wskazniki','Wskaźniki'],['etapy','Etapy i terminy'],['ksiega','Księga'],['marketing','Marketing']];
const lz=k=>{const s=ST[k]||ST.none;return '<span class="lz '+s[0]+'">'+s[1]+'</span>'};
const lzT=s=>{const x=TS[s]||TS.todo;return '<span class="lz '+x[0]+'">'+x[1]+'</span>'};

/* ---------- stan strony ---------- */
let D=null,offline=false,notice='',noticeT=null,timer=null,pending=0,queue=Promise.resolve(),tmpN=0,loadSeq=0,FX=null,HC={},CUR=null,DR=null,gWait=0,q='';
const PF={bp:'all',mine:false,ms:'all',theme:'',hidden:[],col:'todo',bk:''};
try{const z=JSON.parse(localStorage.getItem('pulpit.v1')||'{}');if(z&&typeof z==='object'){
  if(typeof z.bp==='string')PF.bp=z.bp;PF.mine=!!z.mine;if(typeof z.ms==='string')PF.ms=z.ms;
  if(z.theme==='light'||z.theme==='dark')PF.theme=z.theme;if(COLS.some(c=>c[0]===z.col))PF.col=z.col;if(typeof z.bk==='string')PF.bk=z.bk;if(Array.isArray(z.hidden))PF.hidden=z.hidden.map(String)}}catch(e){}
try{if(!PF.hidden.length){const h=JSON.parse(localStorage.getItem('panel.hiddenCals')||'[]');if(Array.isArray(h))PF.hidden=h.map(String)}}catch(e){}
let hiddenCals=new Set(PF.hidden);
const savePF=()=>{PF.hidden=Array.from(hiddenCals);try{localStorage.setItem('pulpit.v1',JSON.stringify(PF))}catch(e){}};
function applyTheme(){
  if(PF.theme)document.documentElement.setAttribute('data-theme',PF.theme);else document.documentElement.removeAttribute('data-theme');
  $('#theme').textContent=PF.theme==='dark'?'Motyw: ciemny':PF.theme==='light'?'Motyw: jasny':'Motyw: systemowy';
}
applyTheme();

/* ---------- dane ---------- */
function normalize(raw){
  const today=isDay(raw.today)?fromKey(raw.today):new Date();
  const rr=v=>resolveRel(v,today);
  const cal=raw.calendar||{};
  const cals=(cal.calendars||[]).map(c=>({id:String(c.id),title:c.title||'',color:col(c.color)}));
  const cmap={};cals.forEach(c=>cmap[c.id]=c);
  const events=(cal.events||[]).map((e,i)=>{
    const cid=String(e.calendarId==null?'':e.calendarId),c=cmap[cid]||{};
    const s=String(rr(e.start)||''),en=String(rr(e.end)||s);
    const o={id:e.id||'e'+i,title:e.title||'(bez tytułu)',allDay:!!e.allDay,calId:cid,cal:e.calendar||c.title||'',color:col(e.color||c.color),loc:e.location||''};
    if(o.allDay){o.d0=s.slice(0,10);o.d1=en.slice(0,10);if(!isDay(o.d0))return null;if(!isDay(o.d1)||o.d1<o.d0)o.d1=o.d0}
    else{o.s=new Date(s);o.e=new Date(en);if(isNaN(o.s)||isNaN(o.e))return null}
    return o}).filter(Boolean);
  const projects=(raw.projects||[]).map(p=>{
    const o=Object.assign({},p,{docs:Array.isArray(p.docs)?p.docs:[],lastDecision:p.lastDecision?Object.assign({},p.lastDecision,{date:rr(p.lastDecision.date)}):null});
    o.name=o.name||o.id;
    o.state=['active','paused','done','backlog'].indexOf(o.state)>=0?o.state:'active';
    o.description=String(o.description||o.goal||'');
    o.client=typeof o.client==='boolean'?o.client:true;
    o.questions=(Array.isArray(o.questions)?o.questions:[]).filter(x=>x&&typeof x.text==='string').map((x,i)=>{const qd=String(rr(x.date)||'');
      return {n:typeof x.n==='number'?x.n:i+1,text:x.text,answer:typeof x.answer==='string'?x.answer:'',date:isDay(qd)?qd:'',
        proposal:typeof x.proposal==='string'?x.proposal.trim():'',
        /* skutki przyjęcia propozycji (wiersze „skutek:” pod pytaniem) */
        effects:(Array.isArray(x.effects)?x.effects:[]).filter(e=>typeof e==='string'&&e.trim()).map(e=>e.trim())}});
    /* priorytet z karty (1 najważniejszy, 5 najmniej); bez pola 3 */
    const pr=typeof p.priority==='string'?parseInt(p.priority,10):p.priority;
    o.prioritySet=Number.isInteger(pr)&&pr>=1&&pr<=5;o.priority=o.prioritySet?pr:3;
    o.threshold=o.threshold==='lekka'||o.threshold==='pelna'?o.threshold:(o.client?'pelna':'lekka');
    o.alias=o.alias||'';
    o.book=(Array.isArray(o.book)?o.book:o.docs).map(d=>({key:d.key||'',label:d.label||d.key||'',file:d.file||'',status:['ok','gaps','missing'].indexOf(d.status)>=0?d.status:'gaps',gaps:Array.isArray(d.gaps)?d.gaps:[]}));
    o.bookTotal=typeof o.bookTotal==='number'?o.bookTotal:(Array.isArray(p.book)?o.book.length:(typeof o.docsTotal==='number'?o.docsTotal:o.book.length));
    o.bookOk=typeof o.bookOk==='number'?o.bookOk:(Array.isArray(p.book)?o.book.filter(b=>b.status==='ok').length:(typeof o.docsOk==='number'?o.docsOk:o.book.filter(b=>b.status==='ok').length));
    o.docsOk=typeof o.docsOk==='number'?o.docsOk:o.docs.filter(d=>d.status==='ok').length;
    o.docsTotal=typeof o.docsTotal==='number'?o.docsTotal:o.docs.length;
    o.phaseIn=PHI.hasOwnProperty(p.phase)?p.phase:'';
    o.phaseSrcIn=p.phaseSource==='wyliczona'?'wyliczona':'karta';
    const ns=p.nextStep;
    o.nextIn=ns===undefined?undefined:ns&&typeof ns==='object'&&typeof ns.title==='string'&&ns.title?{title:ns.title,taskId:String(ns.taskId||''),executor:WHO[ns.executor]?ns.executor:'',date:String(rr(ns.date)||'')}:null;
    return o});
  const dm=+raw.dayMinutes;
  return derive({todayKey:key(today),generatedAt:raw.generatedAt||'',projectsSource:raw.projectsSource||'sample',icsPath:raw.icsPath||'/terminy.ics',
    dayMinutes:isFinite(dm)&&dm>0?Math.round(dm):120,
    projects:projects,
    stages:(raw.stages||[]).map(t=>Object.assign({},t,{date:rr(t.date)})),
    tasks:(raw.tasks||[]).map(z=>Object.assign({},z,{date:rr(z.date),kind:z.kind||'zadanie',minutes:+z.minutes||0,detail:normDetail(z.detail),
      needs:Array.isArray(z.needs)?z.needs.filter(x=>typeof x==='string'&&x):(z.needsYou?[z.needsYou]:[]),
      after:Array.isArray(z.after)?z.after.filter(x=>typeof x==='string'&&x.trim()):[],
      waitingFor:Array.isArray(z.waitingFor)?z.waitingFor.filter(x=>x&&typeof x.title==='string'&&x.title).map(x=>({title:x.title,done:!!x.done})):[],
      check:normCheck(z.check),counter:normCounter(z),campFile:String(z.campaignFile||z.kampania||'').trim(),
      unlocksIn:Array.isArray(z.unlocks)?z.unlocks.filter(u=>u&&typeof u.title==='string'&&u.title).map(u=>({id:String(u.id||''),title:u.title,executor:WHO[u.executor]?u.executor:'',date:(v=>isDay(v)?v:'')(String(rr(u.date)||''))})):null,
      unlockCountIn:Number.isFinite(+z.unlockCount)&&z.unlockCount!==null&&z.unlockCount!==''?+z.unlockCount:null})),
    server:normServer(raw.server),
    costs:normCosts(raw.costs),
    publish:normPublish(raw.publish),
    film:raw.film&&typeof raw.film==='object'?{available:!!raw.film.available,explainer:!!raw.film.explainer,account:String(raw.film.account||'')}:null,
    studio:raw.studio&&typeof raw.studio==='object'&&!Array.isArray(raw.studio)?raw.studio:{},
    campaigns:(raw.campaigns||[]).map(c=>{
      const cn={},co=c.counters&&typeof c.counters==='object'?c.counters:{};
      Object.keys(co).forEach(k=>{const n=+co[k];if(k&&isFinite(n))cn[k]=n});
      const r0=isFinite(+c.result)&&+c.result>0?+c.result:0,mk=String(c.counterMetric||c.metric||'').trim().toLowerCase();
      /* wynik = większy z ręcznego wyniku i sumy licznika miernika */
      const rm=mk&&cn.hasOwnProperty(mk)?cn[mk]:0;
      return Object.assign({},c,{start:rr(c.start),end:rr(c.end),channels:c.channels||[],gaps:c.gaps||[],counters:cn,
      target:isFinite(+c.target)&&+c.target>0?+c.target:0,result:Math.max(r0,rm)})}),
    standard:raw.standard||[],agents:normAgents(raw.agents),activity:normActivity(raw.activity),
    pmNote:raw.pmNote?{date:rr(raw.pmNote.date),text:String(raw.pmNote.text||'')}:null,
    history:(Array.isArray(raw.history)?raw.history:[]).map(e=>({date:String(rr(e&&e.date)||''),projects:e&&e.projects&&typeof e.projects==='object'?e.projects:{}}))
      .filter(e=>isDay(e.date)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0),
    cal:{status:LIVE?(cal.status||'error'):'preview',source:LIVE?(cal.source||'sample'):'sample',error:cal.error||'',readAt:cal.readAt||'',connecting:!!cal.connecting,calendars:cals,events:events}});
}
/* szczegóły zadania (wcięte wiersze pod zadaniem); stare dane bez pola detail dają puste wartości */
function normDetail(d){
  d=d&&typeof d==='object'?d:{};
  const s=v=>typeof v==='string'?v.trim():'',L=v=>Array.isArray(v)?v:[];
  /* poprawka: i następne: z serwera albo, u starszego serwera, z notatek */
  let fix=s(d.fix)||s(d.poprawka),next=d.next!=null&&d.next!==''?d.next:d['następne']!=null&&d['następne']!==''?d['następne']:d.nastepne;
  const notes=[];
  /* wynik publikacji: pola z serwera (stats albo klucze), u starszego serwera wiersze w notatkach */
  const so=d.stats&&typeof d.stats==='object'?d.stats:{},sv=(...a)=>{for(const x of a)if(x!=null&&String(x).trim()!=='')return String(x).trim();return ''};
  const stats={views:sv(so.views,d.views,d['wyświetlenia']),clicks:sv(so.clicks,d.clicks,d['kliknięcia']),accounts:sv(so.accounts,d.accounts,d.konta),link:sv(so.link,d.link)};
  L(d.notes).filter(x=>typeof x==='string'&&x.trim()).forEach(x=>{const m=/^\s*(następne|nastepne|poprawka)\s*:\s*(.*)$/i.exec(x);
    const ps=/^\s*(wyświetlenia|wyswietlenia|kliknięcia|klikniecia|konta|link)\s*:\s*(.*)$/i.exec(x);
    if(ps){const f=STATK[ps[1].toLowerCase()];if(!stats[f])stats[f]=ps[2].trim();return}
    if(!m)notes.push(x);else if(/^popr/i.test(m[1])){if(!fix)fix=m[2].trim()}else if(next==null||next==='')next=m[2].trim()});
  return {goal:s(d.goal),doneWhen:s(d.doneWhen),
    refs:L(d.refs).filter(r=>r&&typeof r.path==='string'&&r.path.trim()).map(r=>({path:r.path.trim(),anchor:s(r.anchor)})),
    /* i: numer kroku w pliku (od 0), potrzebny do zapisu klucza krok */
    steps:L(d.steps).map((x,i)=>x&&typeof x.text==='string'&&x.text.trim()?{done:!!x.done,text:x.text.trim(),i:i}:null).filter(Boolean),
    result:s(d.result),decision:s(d.decision),left:s(d.left),fix:fix,next:parseNext(next),notes:notes,stats:stats,
    scheduled:s(d.scheduled),
    branch:/^agent\/[\w.\/-]+$/.test(s(d.branch))?s(d.branch):'',asks:L(d.asks).filter(x=>typeof x==='string'&&x.trim()).map(x=>x.trim()).slice(0,6),
    answers:L(d.answers).filter(a=>a&&typeof a.label==='string'&&a.label.trim()).map(a=>({label:a.label.trim(),value:s(a.value)}))};
}
const STATK={'wyświetlenia':'views','wyswietlenia':'views','kliknięcia':'clicks','klikniecia':'clicks','konta':'accounts','link':'link'};
const hasStats=s=>!!(s&&(s.views||s.clicks||s.accounts||s.link));
/* następne: "Tytuł | kto: … | kiedy: …" albo {title, executor, date} */
function parseNext(v){
  if(v==null||v==='')return null;
  const who=x=>{x=String(x||'').trim().toLowerCase();return x==='claude'||x==='codex'||x==='ty'?x:''};
  if(typeof v==='object'){const t=typeof v.title==='string'?v.title.trim():'';return t?{title:t,executor:who(v.executor||v.kto),date:isDay(v.date||v.kiedy)?(v.date||v.kiedy):''}:null}
  const parts=String(v).split('|'),o={title:parts[0].trim(),executor:'',date:''};
  parts.slice(1).forEach(x=>{const m=/^\s*(kto|kiedy)\s*:\s*(.*?)\s*$/i.exec(x);if(!m)return;if(m[1].toLowerCase()==='kto')o.executor=who(m[2]);else if(isDay(m[2]))o.date=m[2]});
  return o.title?o:null;
}
const hasPlan=d=>!!(d.goal||d.doneWhen||d.refs.length||d.steps.length||d.notes.length);
const hasWyn=d=>!!(d.result||d.decision||d.left||d.next);
/* „sprawdza: <klucz>”: wynik kontroli serwera; ok true, false albo null (brak danych) */
function normCheck(c){
  if(!c||typeof c!=='object'||typeof c.key!=='string'||!c.key.trim())return null;
  return {key:c.key.trim(),ok:c.ok===true?true:c.ok===false?false:null,at:typeof c.at==='string'?c.at:''};
}
/* „licznik: <nazwa>”: nazwa liczby wpisywanej przy zamknięciu zadania */
function normCounter(z){
  const v=z.counter&&typeof z.counter==='object'?z.counter.name:z.counter!=null?z.counter:z.licznik;
  return typeof v==='string'?v.trim().toLowerCase().slice(0,40):'';
}
/* czas kontroli: „09:10” dziś, inaczej „18.11 09:10” */
function atShort(s){
  const m=/^(\d{4}-\d\d-\d\d)(?:[T ](\d\d:\d\d))?/.exec(String(s||''));if(!m)return '';
  return (D&&m[1]===D.todayKey?'':dd(m[1])+(m[2]?' ':''))+(m[2]||'');
}
function normServer(s){
  if(!s||typeof s!=='object')return null;
  const c=s.checks&&typeof s.checks==='object'?s.checks:{},o={};
  Object.keys(c).forEach(k=>{const v=String(c[k]);o[k]=v==='ok'||v==='zle'?v:'brak'});
  return {checks:o,backupAt:typeof s.backupAt==='string'?s.backupAt:'',backupOff:!!s.backupOff,at:typeof s.at==='string'?s.at:''};
}
/* koszty Hetznera (dashboard/koszty.py): szacunek z cennika API, kwoty brutto w EUR */
function normCosts(c){
  if(!c||typeof c!=='object')return null;
  if(!c.configured)return {configured:false};
  const n=v=>isFinite(+v)?+v:0,it=x=>({name:String(x.name||''),kind:String(x.kind||''),detail:String(x.detail||''),location:String(x.location||''),since:isDay(x.since)?x.since:'',monthly:n(x.monthly),month:n(x.month),total:n(x.total)});

      t.after.forEach(fr=>{const f=fr.trim().toLowerCase(),m=f?L.find(x=>x!==t&&x.title.toLowerCase().indexOf(f)>=0):null;

    const ts=o.tasks.filter(t=>t.project===p.id&&t.kind!=='publikacja');
    const c={todo:0,wip:0,rev:0,blocked:0,done:0,all:ts.length};ts.forEach(t=>c[t.col]++);

const opTxt=o=>typeof o==='string'?o:o&&typeof o==='object'?String(o.effect||o.op||o.text||'')+((o.error||o.reason)?': '+(o.error||o.reason):''):'';
function answerQ(pid,n,text,accept){
  const p=P(pid);if(!p||!canMeta(p))return;const x=p.questions.find(y=>y.n===n);if(!x)return;
  text=String(text||'').replace(/\s+/g,' ').trim().slice(0,2000);

      if(!eff.length&&!ap)return say('Przyjęto propozycję. Odpowiedź zapisana w KARTA.md.');
      if(!ap&&!fl.length)return say('Przyjęto propozycję. Serwer nie podał wyniku zmian w zadaniach.',10000);

      say('Przyjęto propozycję. Zmiany w ZADANIA.md: '+a.length+' z '+all+'.'+(a.length?' Wykonano: '+a.map(opTxt).filter(Boolean).join('; ')+'.':'')+

/* markdown z plików i notatek: nagłówki, listy (także numerowane), tabele w przewijanym kontenerze, kod, cytaty, linki http(s) */
const MDSEP=/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
function mdInl(s){
  return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<]*[^\s<.,;:!?)])/g,'$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
}
function mdCells(l){
  let s=l.trim().replace(/\\\|/g,'\u0001');
  if(s[0]==='|')s=s.slice(1);if(s.slice(-1)==='|')s=s.slice(0,-1);
  return s.split('|').map(c=>c.trim().replace(/\u0001/g,'|'));
}
function md(text){
  const out=[];let list=null,rows=null,code=null;
  const chk=x=>x.replace(/^\[( |x|X)\]\s+/,(m,c)=>c===' '?'☐ ':'☑ ');
  const flushL=()=>{if(!list)return;out.push('<'+list.t+(list.t==='ol'&&list.s!==1?' start="'+list.s+'"':'')+'>'+list.items.map(x=>'<li>'+mdInl(chk(x))+'</li>').join('')+'</'+list.t+'>');list=null};
  const flushT=()=>{
    if(!rows)return;const R=rows;rows=null;
    if(R.length===1){out.push('<p>'+mdInl(R[0])+'</p>');return}
    const sep=MDSEP.test(R[1]),head=sep?mdCells(R[0]):null,body=(sep?R.slice(2):R).filter(l=>!MDSEP.test(l)).map(mdCells);
    const n=Math.max(head?head.length:0,...body.map(r=>r.length)),fill=r=>r.concat(Array(Math.max(0,n-r.length)).fill(''));
    out.push('<div class="mdt"><table>'+(head?'<thead><tr>'+fill(head).map(c=>'<th>'+mdInl(c)+'</th>').join('')+'</tr></thead>':'')+
      '<tbody>'+body.map(r=>'<tr>'+fill(r).map(c=>'<td>'+mdInl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>')};
  String(text==null?'':text).split(/\r?\n/).forEach(l=>{
    if(code){if(/^\s*```/.test(l)){out.push('<pre class="mdpre">'+esc(code.join('\n'))+'</pre>');code=null}else code.push(l);return}
    if(/^\s*```/.test(l)){flushL();flushT();code=[];return}
    if(/^\s*\|/.test(l)){flushL();(rows||(rows=[])).push(l);return}
    flushT();
    const ul=/^\s*[-*+]\s+(.*)$/.exec(l),ol=/^\s*(\d+)[.)]\s+(.*)$/.exec(l),hd=/^#{1,6}\s+(.*)$/.exec(l);
    if(ul||ol){const t=ul?'ul':'ol';if(list&&list.t!==t)flushL();if(!list)list={t:t,s:ol?+ol[1]:1,items:[]};list.items.push(ul?ul[1]:ol[2]);return}
    if(list&&/^\s{2,}\S/.test(l)){list.items[list.items.length-1]+=' · '+l.trim();return}
    flushL();
    if(hd)out.push('<h3>'+mdInl(hd[1])+'</h3>');
    else if(/^\s*>/.test(l))out.push('<p class="mdq">'+mdInl(l.replace(/^\s*>\s?/,''))+'</p>');
    else if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l))return;
    else if(l.trim())out.push('<p>'+mdInl(l)+'</p>');
  });
  if(code)out.push('<pre class="mdpre">'+esc(code.join('\n'))+'</pre>');
  flushL();flushT();
  return out.join('');
}

/* ---------- Blokady: drzewo zależności z po: (unlocks) ---------- */
/*bkGraph:start*/
/* model blokad bez zależności od reszty panelu (test: testy/test_blokady.py).
   tasks: otwarte zadania [{id,title,state,executor,you,date,prio,cost,kids:[id zadań, które czekają na to],waits:[tytuły],miss:[fragmenty po: bez zadania]}],
   today: 'RRRR-MM-DD'. Twoje: you (kto: ty albo czeka na Twoją zgodę lub odbiór) albo executor 'ty'.
   cost: dni pracy na zadanie (z czas: przy Twoich zadaniach, inaczej 1).
   Korzenie: nie czekają na nic, nie są zablokowane [!] i odblokowują co najmniej jedno zadanie.
   count: wszystkie zależne (także pośrednio, każde raz), direct: bezpośrednie (jak „wstrzymuje” w raporcie PM),
   next/late: najbliższy termin i liczba zależnych po terminie, chain: najdłuższy łańcuch zależnych (cykle zwinięte
   w jeden węzeł, czas liniowy, bez rekurencji).
   slack(korzeń): zapas każdej ścieżki osobno — dla zależnego z terminem: dni do terminu minus dni pracy na najdłuższej
   drodze od korzenia do niego (z nim włącznie); worst: najmniejszy zapas wśród terminów od dziś. tight: worst < 0
   („ciasno”; inna miara niż „bez zapasu” etapu w raporcie PM). crit(korzeń): ścieżka krytyczna — na każdym poziomie
   dziecko, za którym jest zależny o najmniejszym zapasie (także po terminie); remis: dłuższy łańcuch, wcześniejszy termin.
   early: poprzednicy z terminem późniejszym niż to zadanie (zła kolejność, jak `order` w raporcie PM).
   fix: zależności do poprawy (cykl, po: bez zadania, czeka na zadanie z takim problemem: via missing/cycle);
   zablokowane [!] są tylko w blocked. Kolejność: Twoje, z zależnymi po terminie, najwięcej zależnych, najbliższy
   termin (własny albo zależnego), priorytet projektu, tytuł. */
function bkGraph(tasks,today){
  const ix={};tasks.forEach(t=>{ix[t.id]=t});
  const km={};
  const kids=t=>{if(km[t.id])return km[t.id];const L=[],s={};(t.kids||[]).forEach(id=>{const x=ix[id];if(x&&x!==t&&!s[x.id]){s[x.id]=1;L.push(x)}});return km[t.id]=L};
  const pred={};tasks.forEach(t=>{kids(t).forEach(x=>{(pred[x.id]||(pred[x.id]=[])).push(t)})});
  const reachL=(L,next)=>{next=next||kids;const seen={},st=L.slice(),out=[];L.forEach(t=>{seen[t.id]=1});
    while(st.length){next(st.pop()).forEach(x=>{if(!seen[x.id]){seen[x.id]=1;out.push(x);st.push(x)}})}
    return out};
  /* silnie spójne składowe (Tarjan, iteracyjnie: długi łańcuch nie przepełni stosu): cykl = zadania w jednej składowej;
     składowe powstają od końca łańcucha (składowa osiągalna z innej ma mniejszy numer) */
  const scc={},comps=[],ind={},low={},onS={},S=[];let n=0;
  tasks.forEach(t0=>{if(ind[t0.id]!=null)return;
    const st=[[t0,0]];ind[t0.id]=low[t0.id]=n++;S.push(t0);onS[t0.id]=1;
    while(st.length){const fr=st[st.length-1],v=fr[0],K=kids(v);
      if(fr[1]<K.length){const w=K[fr[1]++];
        if(ind[w.id]==null){ind[w.id]=low[w.id]=n++;S.push(w);onS[w.id]=1;st.push([w,0])}
        else if(onS[w.id])low[v.id]=Math.min(low[v.id],ind[w.id]);
      }else{st.pop();
        if(st.length){const u=st[st.length-1][0];low[u.id]=Math.min(low[u.id],low[v.id])}
        if(low[v.id]===ind[v.id]){const c=[];let w;do{w=S.pop();onS[w.id]=0;scc[w.id]=comps.length;c.push(w)}while(w!==v);comps.push(c)}}}
  });
  const cch=comps.map(()=>0);
  comps.forEach((c,i)=>{let m=0;c.forEach(t=>kids(t).forEach(x=>{const j=scc[x.id];if(j!==i)m=Math.max(m,1+cch[j])}));cch[i]=c.length-1+m});
  const chain=t=>cch[scc[t.id]];
  const cyc=t=>kids(t).filter(x=>scc[x.id]===scc[t.id]);
  const memo={};
  const info=t=>{if(memo[t.id])return memo[t.id];
    const R=reachL([t]),k=kids(t);let next='',late=0;
    R.forEach(x=>{if(x.date){if(!next||x.date<next)next=x.date;if(x.date<today)late++}});
    return memo[t.id]={count:R.length,direct:k.length,next:next,late:late,cycle:cyc(t)}};
  const days=d=>Math.round((new Date(d+'T00:00:00')-new Date(today+'T00:00:00'))/864e5);
  const cost=t=>Math.max(1,Math.round(+t.cost||1));
  const ccost=comps.map(c=>Math.max.apply(null,c.map(cost)));
  const slm={};
  const slack=r=>{if(slm[r.id])return slm[r.id];
    const rc=scc[r.id],dist={},sl={},bc={};let worst=null;dist[rc]=0;
    for(let i=rc;i>=0;i--){if(dist[i]==null)continue;
      comps[i].forEach(t=>kids(t).forEach(x=>{const j=scc[x.id];if(j!==i){const v=dist[i]+ccost[j];if(dist[j]==null||v>dist[j])dist[j]=v}}))}
    for(let i=rc-1;i>=0;i--){if(dist[i]==null)continue;
      comps[i].forEach(x=>{if(!x.date)return;const d=days(x.date),v=d-dist[i];sl[x.id]=v;
        if(x.date>=today&&(!worst||v<worst.slack||(v===worst.slack&&x.date<worst.date)))worst={slack:v,steps:dist[i],days:d,id:x.id,title:x.title,date:x.date}})}
    for(let i=0;i<=rc;i++){if(dist[i]==null)continue;let b=Infinity;
      comps[i].forEach(x=>{if(sl[x.id]!=null)b=Math.min(b,sl[x.id]);kids(x).forEach(y=>{const j=scc[y.id];if(j!==i&&bc[j]!=null)b=Math.min(b,bc[j])})});bc[i]=b}
    return slm[r.id]={worst:worst,slackOf:id=>sl[id],best:id=>bc[scc[id]]}};
  const tight=t=>{const w=slack(t).worst;return w&&w.slack<0?{steps:w.steps,days:w.days,id:w.id,title:w.title,date:w.date}:null};
  const crit=(r,max)=>{const out={},s=slack(r);let x=r,g=0;max=max||5;
    while(x&&g++<max){out[x.id]=1;const k=kids(x).filter(y=>!out[y.id]);if(!k.length)break;
      x=k.slice().sort((a,b)=>(s.best(a.id)-s.best(b.id))||(chain(b)-chain(a))||((a.date||'9999').localeCompare(b.date||'9999')))[0]}
    return out};
  const early=t=>t.date?(pred[t.id]||[]).filter(p=>p.date&&p.date>t.date):[];
  const mine=t=>!!t.you||t.executor==='ty';
  const dl=t=>{const n=info(t).next,o=t.date||'';return !o?n:!n?o:o<n?o:n};
  const by=(a,b)=>(mine(b)-mine(a))||((info(b).late>0)-(info(a).late>0))||(info(b).count-info(a).count)||(dl(a)||'9999').localeCompare(dl(b)||'9999')||
    ((a.prio||3)-(b.prio||3))||String(a.title).localeCompare(String(b.title));
  const roots=tasks.filter(t=>!t.waits.length&&t.state!=='blocked'&&kids(t).length).sort(by);
  const blocked=tasks.filter(t=>t.state==='blocked').sort(by);
  /* zadania z waits, do których nie prowadzi żaden korzeń ani zablokowane: cykl albo po: bez zadania wyżej w łańcuchu */
  const cov={};roots.concat(blocked).concat(reachL(roots.concat(blocked))).forEach(t=>{cov[t.id]=1});
  const bad=t=>(t.miss||[]).length?'missing':cyc(t).length?'cycle':'';
  const fix=[];
  tasks.forEach(t=>{if(t.state==='blocked')return;const why=[];
    (t.miss||[]).forEach(f=>why.push({kind:'missing',text:f}));
    const c=cyc(t);if(c.length)why.push({kind:'cycle',text:c.map(x=>x.title).join('; '),comp:scc[t.id]});
    if(!why.length&&t.waits.length&&!cov[t.id]){
      const up=reachL([t],x=>pred[x.id]||[]),src=up.find(bad);
      why.push({kind:'orphan',text:t.waits.join('; '),via:src?bad(src):'',src:src?src.title:''})}
    if(why.length)fix.push({t:t,why:why})});
  fix.sort((a,b)=>by(a.t,b.t));
  return {roots:roots,blocked:blocked,fix:fix,info:info,chain:chain,tight:tight,slack:slack,crit:crit,early:early,mine:mine,
    kids:t=>kids(t).slice().sort(by),reach:L=>reachL(L).length,reachL:L=>reachL(L),byId:id=>ix[id]||null,comp:i=>comps[i]||[]};
}
/*bkGraph:end*/
const BK_DEPTH=5,BK_OPEN=2;

/* model z zadań panelu (liczony raz na stan danych, w facts()). kids z unlocksL (id z serwera; bez id: po tytule
   w tym samym pliku, tylko gdy tytuł jest jeden), miss: brakujące poprzedniki z derive (t.missing, to samo
   dopasowanie po: co na serwerze); Twoje: needsMe (kto: ty, zgoda, odbiór); cost: czas: Twojego zadania
   w dniach pojemności (dayMinutes), inaczej 1 dzień */
function bkModel(){
  const f=facts();if(f.bk)return f.bk;
  const nodes=[],dm=D.dayMinutes||120;
  const byTitle=(t,title)=>{const L=D.tasks.filter(y=>y.project===t.project&&y.file===t.file&&y.title===title);return L.length===1?L[0].id:''};
  f.open.forEach(t=>{const p=P(t.project);
    nodes.push({id:t.id,title:t.title,state:t.state,executor:t.executor,you:needsMe(t),date:isDay(t.date)?t.date:'',prio:p?p.priority:3,
      cost:t.executor==='ty'&&+t.minutes>dm?Math.ceil(+t.minutes/dm):1,
      kids:(t.unlocksL||[]).filter(u=>!u.done).map(u=>u.id||byTitle(t,u.title)).filter(Boolean),
      waits:t.waits,miss:t.missing||[],t:t})});

/* Twoje zadania z aktywnych projektów, na które czeka co najmniej jedno otwarte zadanie */
const bkYouL=()=>{const m=bkModel();return D.tasks.filter(t=>needsMe(t)&&(P(t.project)||{}).state==='active').map(t=>m.byId(t.id)).filter(n=>n&&m.info(n).direct>0)};

const BK_NEED={zgoda:['czeka na Twoją zgodę','potem Twoja zgoda'],'odbiór':['czeka na Twój odbiór','potem Twój odbiór']};
function bkMeta(n,withProj,extra,sub){

/* miejsce każdego zadania na stronie: najpłytszy poziom, pierwszy rodzic w kolejności (BFS), pierwszy korzeń w kolejności.
   Tam rysowane w całości; w innym miejscu tego drzewa albo pod innym korzeniem jednym wierszem „pokazane też pod: …”.
   drawn: wspólne dla całej strony {id: {root, parent}} */
function bkHomes(m,root,drawn){
  const home={},q=[[root,0]];home[root.id]={parent:null,depth:0};
  while(q.length){const [n,d]=q.shift();if(d+1>=BK_DEPTH)continue;
    m.kids(n).forEach(x=>{if(home[x.id])return;
      const g=drawn&&drawn[x.id];
      if(g&&g.root!==root.id){home[x.id]={parent:n,depth:d+1,other:g};return}
      home[x.id]={parent:n,depth:d+1};q.push([x,d+1])})}
  if(drawn)Object.keys(home).forEach(id=>{if(!home[id].other&&!drawn[id])drawn[id]={root:root.id,parent:home[id].parent,homes:home}});

}
const bkDom=s=>String(s).replace(/[^\w-]/g,'_');
/* klucze rozwinięcia gałęzi od korzenia do rodzica zadania (Przejdź rozwija je przed przewinięciem) */
const bkPath=(rootId,homes,parent)=>{const L=[];let x=parent,g=0;while(x&&g++<BK_DEPTH+1){L.unshift(rootId+'>'+x.id);const h=homes[x.id];x=h?h.parent:null}return L};

const BKWHY={missing:w=>'czeka na „'+w.text+'”, a takiego zadania nie ma w pliku',cycle:w=>'zależność w kółko z: '+w.text,
  orphan:w=>'czeka na: '+w.text+(w.via==='missing'?'; wyżej w łańcuchu „'+w.src+'” czeka na zadanie, którego nie ma w pliku':

/* Zależności do poprawy pogrupowane po przyczynie: brakujące zadanie, cykl, łańcuch z problemem wyżej */
function bkFixGroups(m,fix){

    else if(w.kind==='cycle')add('c\n'+w.comp,'Zależność w kółko: '+m.comp(w.comp).map(y=>'„'+y.title+'”').join(', '),x);

function vBlokady(){

  const roots=m.roots.filter(inP),blocked=m.blocked.filter(inP),fix=m.fix.filter(x=>inP(x.t));

    '<ul class="bk-tree">'+bkTree(m,fo,null)+'</ul></section>';
  const drawn={},rootsH=roots.map(n=>bkTree(m,n,drawn)).join('');
  const crit=roots.some(n=>m.chain(n)>1);
  h+='<section class="panel" id="bk-roots" tabindex="-1"><h2>Do zrobienia najpierw <small class="num">'+roots.length+'</small></h2>'+
    (crit?'<p class="bk-intro bk-legend"><i class="bk-cdot" aria-hidden="true"></i>Kropka: ścieżka krytyczna (do zadania z najmniejszym zapasem do terminu).</p>':'')+
    (roots.length?'<ul class="bk-tree">'+rootsH+'</ul>':'<p class="empty">Żadne zadanie nie wstrzymuje innych.</p>')+'</section>';

  h+='<section class="panel" id="bk-blocked" tabindex="-1"><h2>Zablokowane <small class="num">'+blocked.length+'</small></h2>'+
    (blocked.length?'<ul class="bk-tree">'+blocked.map(n=>bkTree(m,n,drawn,{flat:1,why:'<div class="bk-why'+(n.t.blocked?'':' none')+'">'+(n.t.blocked?'powód: '+esc(n.t.blocked):'bez podanego powodu')+'</div>'+

      :'<p class="empty">Brak zablokowanych zadań.</p>')+'</section>';
  if(fix.length)h+='<section class="panel" id="bk-fix" tabindex="-1"><h2>Zależności do poprawy <small class="num">'+fix.length+'</small></h2><p class="bk-intro">Te zadania nie ruszą, dopóki nie poprawisz pola po: w pliku zadań.</p>'+

/* przejście do sekcji albo do zadania w drzewie: najpierw rozwija gałęzie na drodze do niego (data-bkpath), potem

function bkJump(id,path){
  if(path&&path.length){const o=A.bkOpen||(A.bkOpen={});let ch=false;path.forEach(k=>{if(o[k]!==true){o[k]=true;ch=true}});if(ch)render(true)}
  const n=document.getElementById(id);
  if(!n){say('Nie znaleziono tego zadania na stronie. Użyj „Rozwiń wszystko”.');return}
  n.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
  const b=n.querySelector('.bk-t')||n;if(b.focus)b.focus({preventScroll:true});
  n.classList.add('bk-hit');setTimeout(()=>n.classList.remove('bk-hit'),1600);
}
/* Teraz → Marketing: tydzień z dniem posta i przewinięcie do tego dnia */
function mkDay(day){
  if(!isDay(day)){location.hash='marketing';return}
  const d=fromKey(day);d.setDate(d.getDate()-(d.getDay()+6)%7);
  A.mweek=Math.round((d-weekStart(0))/6048e5);
  if(location.hash==='#marketing')render(true);else location.hash='marketing';
  let n=0;const find=()=>{const el=document.querySelector('.tl-day[data-day="'+day+'"]');
    if(el){el.setAttribute('tabindex','-1');el.scrollIntoView({block:'start'});el.focus({preventScroll:true});el.classList.add('mk-hit');setTimeout(()=>el.classList.remove('mk-hit'),1600)}
    else if(n++<15)setTimeout(find,60)};
  setTimeout(find,30);
}

const CFD_ST=[['done','Zrobione','--s4'],['rev','Do odbioru','--s3'],['wip','W toku','--s2'],['todo','Do zrobienia','--s1']];
const WEEKS=()=>[7,6,5,4,3,2,1,0].map(i=>addK(D.todayKey,-7*i));
const histReady=()=>D.history.length>0&&D.history[0].date<=addK(D.todayKey,-14);
function nowCounts(p){const c=p.c;return {todo:c.todo,wip:c.wip+c.blocked,rev:c.rev,done:c.done,total:c.all}}
function hist(p){
  if(HC[p.id])return HC[p.id];
  const W=WEEKS(),out=W.map((w,i)=>{
    if(i===7)return nowCounts(p);
    let e=null;for(let j=D.history.length-1;j>=0;j--){if(D.history[j].date<=w){e=D.history[j];break}}
    if(!e)return null;const n=e.projects[p.id];if(!n)return {todo:0,wip:0,rev:0,done:0,total:0};
    const r={todo:+n.todo||0,wip:(+n.wip||0)+(+n.blocked||0),rev:+n.rev||0,done:+n.done||0};r.total=+n.total||(r.todo+r.wip+r.rev+r.done);return r});
  return HC[p.id]=out;
}
function sumHist(L){return WEEKS().map((_,i)=>{const hs=L.map(p=>hist(p)[i]);if(hs.every(h=>!h))return null;const r={total:0,done:0,wip:0,rev:0,todo:0};hs.forEach(h=>{if(h)for(const k in r)r[k]+=h[k]});return r})}

  return '<div class="kgrid">'+
   '<div class="stat"><span class="l">Postęp</span><span class="v num">'+(n.total?Math.round(pct)+'%':'—')+'</span><span class="d num">'+n.done+' z '+n.total+' zadań'+(dp!=null&&ready?' · '+(dp>=0?'+':'')+dp+' pkt w 4 tyg.':'')+'</span></div>'+

function barChart(id,L){

  return leg+'<svg viewBox="0 0 '+Wd+' '+Hh+'" data-chart="'+id+'" role="img" aria-label="Zadania zakończone w kolejnych tygodniach">'+g+bars+'<rect class="hit" x="'+ml+'" y="'+mt+'" width="'+iw+'" height="'+ih+'" fill="transparent"/></svg>';
}
function cfdChart(id,L){

    areas+='<path d="M'+hi.map((h,j)=>x(idx[j])+','+y(h)).join('L')+'L'+lo.map((l,j)=>x(idx[j])+','+y(l)).reverse().join('L')+'Z" fill="var('+v+')" stroke="var(--surface)" stroke-width="2" stroke-linejoin="round"/>';

  '<button class="linkbtn" data-toggle="t-'+id+'">Pokaż liczby w tabeli</button><div class="tw" id="t-'+id+'" hidden><table class="dt"><thead><tr><th>Tydzień do</th>'+CFD_ST.slice().reverse().map(s=>'<th>'+s[1]+'</th>').join('')+'</tr></thead><tbody>'+idx.map(i=>'<tr><td>'+dd(W[i])+'</td>'+CFD_ST.slice().reverse().map(s=>'<td class="num">'+H[i][s[0]]+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}
function burnChart(p){
  const s=p.stagesL.find(x=>!x.done&&isDay(x.date));
  if(!s)return '<p class="cap">Brak etapu w toku z terminem.</p>';
  const n=s.total,open=s.open;

  const days=Math.max(1,diff(s.date,s.start)),today=Math.min(days,Math.max(0,diff(D.todayKey,s.start)));
  const Wd=600,Hh=230,ml=30,mr=20,mt=12,mb=26,iw=Wd-ml-mr,ih=Hh-mt-mb,x=i=>ml+iw*i/days,y=v=>mt+ih-ih*v/Math.max(1,n);
  let g='';for(let v=0;v<=n;v+=n>8?Math.ceil(n/8):1){g+='<line class="gl" x1="'+ml+'" x2="'+(ml+iw)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(ml-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>'}
  [0,Math.round(days/2),days].forEach(i=>{g+='<text x="'+x(i)+'" y="'+(Hh-6)+'" text-anchor="middle">'+dd(addK(s.start,i))+'</text>'});
  const ideal='<path d="M'+x(0)+','+y(n)+'L'+x(days)+','+y(0)+'" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>';
  const real='<path d="M'+x(0)+','+y(n)+'L'+x(today)+','+y(open)+'" stroke="var(--c1)" stroke-width="2" fill="none"/><circle cx="'+x(today)+'" cy="'+y(open)+'" r="4" fill="var(--c1)" stroke="var(--surface)" stroke-width="2"/>';
  const left=diff(s.date,D.todayKey),pace=today?(n-open)/today:0,need=left>0?open/left:open;

    '<svg viewBox="0 0 '+Wd+' '+Hh+'" role="img" aria-label="Zadania pozostałe w etapie '+esc(s.title)+'">'+g+ideal+real+'<text class="lb" x="'+Math.min(x(today)+8,Wd-90)+'" y="'+(y(open)-8)+'">dziś: '+open+' z '+n+'</text></svg>'+
    '<p class="cap">Etap „'+esc(s.title)+'” do '+dd(s.date)+'. Tempo '+fmt1(pace)+' zadania dziennie, potrzebne '+fmt1(need)+'. '+(left<0?'Termin minął.':pace>=need?'Przy obecnym tempie etap zdąży.':'Przy obecnym tempie etap się spóźni.')+'</p>';

function resFiles(t){
  const d=t.detail;if(!d)return [];
  const txt=[d.result,d.left].filter(Boolean).join('\n'),out=[],seen={};
  d.refs.forEach(r=>{seen[r.path+'#'+r.anchor]=1});
  const re=/(^|[\s(„"'`:])((?:[\w.\-]+\/)*[\w\-][\w.\-]*\.(?:md|txt))(?:#([\w\-]+))?(?=$|[\s),.;:"'`”])/gi;

function saveAsks(t,vals){

  const lines=d.asks.map((a,k)=>a.replace(/=/g,'-')+' = '+cleanT(vals[k]).slice(0,200));
  d.answers=d.asks.map((a,k)=>({label:a,value:cleanT(vals[k])}));

async function loadDiff(id){
  let d={ok:false,error:'Nie udało się wczytać zmian.'};
  try{
    const res=await fetch(diffUrl(id),{cache:'no-store'});
    if(res.status===401){location.assign('/wejscie');return}
    const ct=res.headers.get('Content-Type')||'';
    if(/json/i.test(ct)){
      let j={};try{j=await res.json()}catch(e){}
      const tx=typeof j.text==='string'?j.text:typeof j.diff==='string'?j.diff:null;
      d=res.ok&&j.ok!==false&&tx!=null?{ok:true,text:tx,cut:!!(j.truncated||j.cut)}:{ok:false,error:String(j.error||(res.status===404?'Brak zmian tego uruchomienia na serwerze.':'Nie udało się wczytać zmian.'))};
    }else{const tx=await res.text();d=res.ok?{ok:true,text:tx}:{ok:false,error:res.status===404?'Brak zmian tego uruchomienia na serwerze.':'Nie udało się wczytać zmian.'}}
  }catch(e){}
  DF[id]=d;if(DR)renderDrawer(true);
}
function toggleDiff(id){

function mergeRun(id){
  const r=runById(id)||BR[id];A.mconf='';

  if(!LIVE){say(PRV);renderDrawer(true);return}
  if(A.busy.merge)return;

  enqueue(async()=>{
    const x=await post('/api/agent/merge',r.pseudo?{project:r.project,branch:r.branch}:{id:id});A.busy.merge='';
    if(x.ok){A.merged[id]=1;say('Scalono '+(r.branch||'gałąź')+' do '+(r.base||'bazy')+'. Lokalnie, bez push.');
      const t=r.pseudo?D.tasks.find(y=>y.id===r.task):null;if(t&&t.state!=='done')finishTask(t,'scalono '+r.branch+' (lokalnie, bez push)',null,null)}

async function loadMat(pid,r){

function campOf(t){

/* Kto i kiedy nagra film: jedno zdanie. Serwer (auto_record) co minutę nagrywa nową wersję scenariusza raz; pokaz

function filmWho(fi,d,day,t){
  const F=D.film||{},kind=(fi&&fi.kind)||'pokaz',r=d.rec||{},st=r.state||'';

  const old=(isDay(day)&&day<D.todayKey)||d.filmManual||(t&&t.kind==='publikacja'&&t.state==='done');
  if(d.film&&!d.filmStale)return '';

  if(!d.film&&st==='error')return 'Tej wersji scenariusza panel już nie ponowi sam. Po poprawce scenariusza nagra film sam; możesz też kliknąć „Nagraj ponownie”.';
  const tools=kind==='objasnienie'?F.explainer:F.available;
  if(!tools)return 'Ten panel nie ma narzędzi do nagrywania. Film nagra sam panel na serwerze, kilka minut po zapisaniu scenariusza.';
  if(kind==='pokaz'&&!F.account)return 'Panel nagra film sam, gdy dodasz konto demo (Agenci → Publikacja).';
  return (d.film?'Film jest starszy niż szablon albo marka w studiu. Panel nagra go sam od nowa':'Panel nagra film sam')+' w ciągu kilku minut; nie musisz nic klikać. „'+(d.film?'Nagraj ponownie':'Nagraj film')+'” zaczyna od razu.';
}
/* stan filmu posta jednym słowem (kafelek tygodnia i skrót w szufladzie) */
function filmState(d,t,day){
  const r=d.rec||{},fi=d.filmInfo&&typeof d.filmInfo==='object'?d.filmInfo:null,F=D.film||{},kind=(fi&&fi.kind)||'pokaz';
  const old=(isDay(day)&&day<D.todayKey)||d.filmManual||(t&&t.kind==='publikacja'&&t.state==='done');
  if(r.state==='running'||r.state==='queued')return ['blue','nagrywa się film'];

/* „Wyróżnij zaznaczone słowo”: zaznaczenie (albo słowo pod kursorem) w gwiazdkach, poprzednie wyróżnienie znika */
function stuHighlight(el){
  const k=el.dataset.stuhl||'',form=el.closest('form'),i=form&&form.querySelector('[data-fval="'+CSS.escape(k)+'"]');
  if(!i)return;
  let v=i.value,a=i.selectionStart==null?0:i.selectionStart,b=i.selectionEnd==null?a:i.selectionEnd;
  const before=v.slice(0,a).split('*').length-1,inside=v.slice(a,b).split('*').length-1;
  v=v.replace(/\*/g,'');a-=before;b-=before+inside;
  const W=/[^\s.,:;!?„”"()]/;   /* zawsze całe słowa: zaznaczenie w środku słowa obejmuje całe słowo */
  while(a>0&&W.test(v[a-1]))a--;while(b<v.length&&W.test(v[b]))b++;
  while(a<b&&v[a]===' ')a++;while(b>a&&v[b-1]===' ')b--;
  if(a===b){say('Zaznacz słowo w polu, które ma być w kolorze marki.');i.focus();return}
  v=v.slice(0,a)+'*'+v.slice(a,b)+'*'+v.slice(b);
  if(v.length>(+i.maxLength||90)){say('Tekst byłby za długi.');return}
  i.value=v;(A.fVal||(A.fVal={}))[k]=v;
  const pv=form.querySelector('[data-stuprev="'+CSS.escape(k)+'"]');if(pv)pv.innerHTML=stuPrev(v,stuAcc(form.dataset.fset||''));
  i.focus();i.setSelectionRange(a,b+2);
}

  if(hasN&&nm){const c=campOf(t);if(c){c.counters[nm]=(c.counters[nm]||0)+count;if(String(c.counterMetric||c.metric||'').trim().toLowerCase()===nm)c.result=Math.max(+c.result||0,c.counters[nm])}}

    if(result){const a=await detailPost(ref,'wynik',result);if(!a.ok){if(a.status!==401)say(failMsg(a,'Nie zapisano wyniku.'));return}}

/* ---------- wczytywanie ---------- */
const restSig=raw=>{const o=Object.assign({},raw);delete o.agents;delete o.generatedAt;delete o.activity;return JSON.stringify(o)};
const idle=()=>{if(!pending){A.starting={};A.busy.pm=A.busy.check=A.busy.add=false}};
/* w trakcie edycji albo gdy reszta danych się nie zmieniła: tylko blok agentów */
function applyAgents(raw){
  D.agents=normAgents(raw.agents);D.activity=normActivity(raw.activity);D.generatedAt=raw.generatedAt||D.generatedAt;
  const m={};(raw.tasks||[]).forEach(z=>{m[z.id+'\n'+z.title]=z});
  D.tasks.forEach(t=>{const z=m[t.id+'\n'+t.title];if(z){t.runId=z.runId||'';t.runBlock=z.runBlock||''}});
  if(raw.pmNote)D.pmNote={date:raw.pmNote.date,text:String(raw.pmNote.text||'')};
  render();
}
/* po wdrożeniu nowej wersji panel przeładowuje się sam; gdy coś edytujesz, czeka, aż skończysz */
let VER='';
function newVersion(v){
  v=typeof v==='string'?v:'';
  if(!v)return false;
  if(!VER){VER=v;return false}
  if(v===VER)return false;
  if(editing()||pending||(DR&&DR.form)){if(!A.verSaid){A.verSaid=1;say('Jest nowa wersja panelu. Przeładuje się, gdy skończysz edycję.')}return false}
  location.reload();return true;
}
async function load(force){
  clearTimeout(timer);
  const seq=++loadSeq;
  try{
    const r=await fetch('/api/data',{cache:'no-store'});
    if(r.status===401){location.assign('/wejscie');return}
    if(!r.ok)throw new Error(r.status);
    const raw=await r.json();
    if(seq!==loadSeq)return;
    if(newVersion(raw.panelVersion))return;
    const sig=restSig(raw),hold=force!==true&&(editing()||pending),was=offline;
    idle();offline=false;
    if(D&&(hold||(force!==true&&sig===A.sig&&Date.now()-A.fullAt<60000))){applyAgents(raw);if(was)renderTop()}
    else{D=normalize(raw);A.sig=sig;A.fullAt=Date.now();render(force===true)}
  }catch(e){
    if(seq!==loadSeq)return;
    offline=true;idle();
    if(D)render();else $('#view').innerHTML='<div class="banner bad">Brak połączenia z serwerem panelu. Uruchom: <code>python3 dashboard/server.py</code></div>';
  }
  timer=setTimeout(load,D&&D.cal.connecting?2000:nwBusy()?3000:D&&(editing()||pending)?15000:60000);
}
