# /etc/systemd/system/panel.service.d/agenci.conf (instaluje zainstaluj-rozwoj.sh)
# Restart panelu (wdrożenie) nie przerywa agentów: systemd zatrzymuje tylko proces panelu, a uruchomienia agentów
# (pośrednik dashboard/przebieg.py we własnej sesji) pracują dalej; panel po starcie podejmuje ich śledzenie.
# Ile agentów naraz: ustawienie w panelu (Agenci), nie zmienna PANEL_AGENTS_MAX z usługi.
[Service]
KillMode=process
UnsetEnvironment=PANEL_AGENTS_MAX
